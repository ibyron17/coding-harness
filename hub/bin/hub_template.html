  function pad2(n){ return (n < 10 ? '0' : '') + n; }

  // 절대 시각 라벨. 오늘이면 HH:MM, 다른 날이면 M/D HH:MM.
  // 날짜를 함께 주는 이유: 이벤트 보존이 7일이고 done 세션은 시간 경과로 숨겨지지 않으므로
  // (shouldRenderSession 참조), "어제 14:32" 와 "오늘 14:32" 가 한 카드에 공존한다.
  // usageResetText 가 먼저 이 규칙을 갖고 있었고, 그 함수도 이제 이것을 재사용한다.
  function absoluteTimeLabel(atMs, nowMs){
    var target = new Date(atMs);
    var now = new Date(nowMs);
    var timePart = pad2(target.getHours()) + ':' + pad2(target.getMinutes());
    var sameDay = target.getFullYear() === now.getFullYear()
      && target.getMonth() === now.getMonth()
      && target.getDate() === now.getDate();
    return sameDay ? timePart : (target.getMonth() + 1) + '/' + target.getDate() + ' ' + timePart;
  }

  // interrupted 배지 라벨 접미(결정 RI10 §7) — 초기화 시각이 미래면 " · 초기화 16:30",
  // 지났으면 " · 초기화됨", 없으면 접미 없음. 어순은 사용량 패널 usageResetText(「초기화
  // 18:32 · …」)와 같다 — USAGE_RESET_LABEL 을 재사용한다(새 문구를 만들지 않는다).
  function interruptedLabelSuffix(interruption, nowMs){
    if(!interruption || interruption.resets_at_ms == null) return '';
    return interruption.resets_at_ms > nowMs
      ? ' · ' + USAGE_RESET_LABEL + ' ' + absoluteTimeLabel(interruption.resets_at_ms, nowMs)
      : ' · ' + USAGE_RESET_LABEL + '됨';
  }

  // interrupted 배지 툴팁 문구(결정 RI10 §7). 순수 함수 — DOM 에 닿지 않는다(staleBadgeTooltipText
  // 와 같은 관례). absoluteTimeLabel·remainingLabel 을 재사용한다 — 새 포맷 함수를 만들지 않는다.
  function interruptedBadgeTooltipText(interruption, nowMs){
    var prefix = '사용 한도에 걸려 ' + absoluteTimeLabel(interruption.interrupted_at_ms, nowMs) + ' 에 턴이 멈췄습니다. ';
    var resetsAtMs = interruption.resets_at_ms;
    if(resetsAtMs == null) return prefix + INTERRUPTED_TOOLTIP_NO_RESETS;
    if(resetsAtMs <= nowMs) return prefix + INTERRUPTED_TOOLTIP_RESET_PASSED;
    return prefix + '초기화 ' + absoluteTimeLabel(resetsAtMs, nowMs) + ' · ' + remainingLabel(resetsAtMs, nowMs)
      + ' — 그 뒤 이 세션에 이어서 지시하면 계속됩니다.';
  }

  // background 배지 툴팁 문구(결정 BW9·BW10 §7). 순수 함수 — DOM 에 닿지 않는다
  // (interruptedBadgeTooltipText 와 같은 관례). absoluteTimeLabel 을 재사용한다 — 새 포맷
  // 함수를 만들지 않는다. parts 는 불변식(task_count>0 또는 wakeup_count>0 이어야 background
  // 상태가 성립한다, BW4·BW6)상 비지 않는다.
  function backgroundBadgeTooltipText(backgroundWait, nowMs){
    var parts = [];
    if(backgroundWait.task_count > 0) parts.push(BACKGROUND_TASK_COUNT_LABEL + backgroundWait.task_count + BACKGROUND_COUNT_SUFFIX);
    if(backgroundWait.wakeup_count > 0) parts.push(BACKGROUND_WAKEUP_COUNT_LABEL + backgroundWait.wakeup_count + BACKGROUND_COUNT_SUFFIX);
    var sentence = '이 세션은 ' + absoluteTimeLabel(backgroundWait.since_ms, nowMs) + ' 부터 ' + parts.join('·')
      + '를 기다리고 있습니다. 끝나거나 알림이 오면 이어서 진행합니다 — '
      + absoluteTimeLabel(backgroundWait.until_ms, nowMs) + ' 까지 소식이 없으면 이 표시를 거둡니다.';
    if(!backgroundWait.output) return sentence;
    return sentence + '\n' + backgroundOutputTooltipLine(backgroundWait.output, nowMs);
  }

  // 백그라운드 대기 배지 툴팁의 출력 줄(결정 LA10). 「확인된」을 붙이는 이유: 훅이 센 작업 수와 찾은 출력 파일 수가 다를 수 있다.
  function backgroundOutputTooltipLine(output, nowMs){
    return SESSION_OUTPUT_TOOLTIP_LABEL + absoluteTimeLabel(output.updated_at_ms, nowMs) + '(' + elapsedLabel(output.updated_at_ms)
      + ')에 마지막으로 늘었습니다 — 확인된 출력 파일 ' + output.file_count + '개 · ' + byteSizeLabel(output.total_bytes)
      + '. ' + SESSION_OUTPUT_TOOLTIP_NOTE;
  }

  // stale 은 "소식 없음"만으로 부족하다 — 멈추기 전 마지막으로 뭘 하고 있었는지(base_state)를
  // 병기해야 사용자가 "죽었나 아니면 그냥 조용한가"를 가늠할 수 있다(검수 M6 ③). interrupted
  // 는 초기화 시각 접미가 붙는다(결정 RI10) — 둘 다 baseState(세션 배지)가 있을 때만 호출된다,
  // 프로젝트 배지는 renderStateBadge 가 STATE_LABEL 을 직접 쓴다.
  function stateLabel(state, baseState, interruption, nowMs){
    if(state === 'stale') return STATE_LABEL.stale + ' · 직전 ' + STATE_LABEL[baseState];
    if(state === 'interrupted') return STATE_LABEL.interrupted + interruptedLabelSuffix(interruption, nowMs);
    if(state === 'background') return BACKGROUND_SESSION_LABEL;
    return STATE_LABEL[state];
  }

  // stale 배지 툴팁 문구. 순수 함수 — DOM 에 닿지 않는다(agentRunTooltipText 와 같은 관례).
  // ① 판정 기준, ② 마지막 이벤트/활동의 절대 시각+경과(absoluteTimeLabel·elapsedLabel 재사용
  // — 새 포맷 함수를 만들지 않는다), ③ 해석 한 줄을 붙인다. baseState 가 있으면 세션 배지용
  // (직전 상태도 병기), 없으면 프로젝트 배지용이다(검수 M6 ③ 의 stateLabel 과 같은 분기).
  function staleBadgeTooltipText(lastActivityAtMs, baseState, nowMs){
    var whenText = absoluteTimeLabel(lastActivityAtMs, nowMs) + ' · ' + elapsedLabel(lastActivityAtMs);
    if(baseState){
      return STALE_TOOLTIP_SESSION_CRITERION + ' 마지막 이벤트 ' + whenText
        + ' · 직전 상태 ' + STATE_LABEL[baseState] + '. ' + STALE_TOOLTIP_SESSION_NOTE;
    }
    // 마지막 활동 시각은 판정 근거가 아니라 참고 정보다(위 STALE_TOOLTIP_PROJECT_CRITERION
    // 주석의 다중 세션 승격 vs 활동 시각 최댓값 불일치 — 검수 MEDIUM).
    return STALE_TOOLTIP_PROJECT_CRITERION + ' (참고) 마지막 활동 ' + whenText + '. ' + STALE_TOOLTIP_PROJECT_NOTE;
  }

  // 색 + 형태(글리프) + 텍스트 3채널 배지(색각 안전 팔레트 보강). baseState 는 선택 인자다 —
  // 세션 배지는 stale·interrupted 면 접미를 병기하고(stateLabel), 프로젝트 배지는 baseState 가
  // 없어 STATE_LABEL 을 그대로 쓴다. 여기서 baseState 를 필수로 만들면 stale 프로젝트에서
  // "소식 없음 · 직전 undefined" 가 나온다. lastActivityAtMs 는 stale 배지에만, interruption
  // (결정 RI10)은 interrupted 배지에만 쓰인다. data-tooltip 은 stale·interrupted 에만
  // 붙는다 — 그 외 상태는 보이는 텍스트와 같은 툴팁이 소음이라는 결정 R4 관례 그대로다.
  // interrupted·background 는 baseState 유무로 세션/프로젝트 배지를 가른다(stateLabel 과
  // 같은 분기) — 프로젝트 배지는 어느 세션이 멈췄는지·기다리는지 시각 정보가 없어 정적 문구
  // (INTERRUPTED_TOOLTIP_PROJECT·BACKGROUND_TOOLTIP_PROJECT)를 쓴다. backgroundWait 는
  // background 배지에만 쓰인다(결정 BW9).
  function renderStateBadge(state, baseState, lastActivityAtMs, interruption, backgroundWait){
    var nowMs = Date.now();
    var label = baseState ? stateLabel(state, baseState, interruption, nowMs) : STATE_LABEL[state];
    var tooltipAttribute = '';
    if(state === 'stale'){
      tooltipAttribute = ' data-tooltip="' + escapeHtml(staleBadgeTooltipText(lastActivityAtMs, baseState, nowMs)) + '"';
    } else if(state === 'interrupted'){
      var interruptedTooltipText = baseState ? interruptedBadgeTooltipText(interruption, nowMs) : INTERRUPTED_TOOLTIP_PROJECT;
      tooltipAttribute = ' data-tooltip="' + escapeHtml(interruptedTooltipText) + '"';
    } else if(state === 'background'){
      var backgroundTooltipText = baseState ? backgroundBadgeTooltipText(backgroundWait, nowMs) : BACKGROUND_TOOLTIP_PROJECT;
      tooltipAttribute = ' data-tooltip="' + escapeHtml(backgroundTooltipText) + '"';
    }
    return '<span class="badge state-' + state + '"' + tooltipAttribute + '>'
         + '<span class="glyph" aria-hidden="true">' + STATE_GLYPH[state] + '</span>'
         + label + '</span>';
  }

  // 승인 대기 표지를 보일 세션인가(결정 AW1) — 판정은 서버(hub_session.is_awaiting_approval)가 한 곳에서 한다. macOS 알림과 같은
  // 규칙이다(결정 MN5, docs/prps/hub-macos-notification.md). 화면은 그 결과만 읽는다. 키가 없는 옛 서버의 페이로드는
  // undefined 라 false 다(오늘 화면 그대로 — 페일 클로즈). 순수 함수 — DOM 에 닿지 않는다.
  function isAwaitingApproval(session){
    return session.is_awaiting_approval === true;
  }

  // 첫 줄 상태 배지 뒤의 승인 대기 표지(결정 AW3·AW4). 해당 없으면 빈 문자열 — 첫 줄이 오늘과 같다. 모양은 .badge 어휘 +
  // 경고색 안쪽 링이라 서브에이전트 실행 칩(.agent-chip)과 겹치지 않는다(결정 AW5 — LM12 가 걷은 단계 칩의 부활이 아니다).
  function renderApprovalWaitBadge(session){
    if(!isAwaitingApproval(session)) return '';
    return '<span class="badge approval-wait" data-tooltip="' + escapeHtml(APPROVAL_WAIT_TOOLTIP) + '">'
      + '<span class="glyph" aria-hidden="true">' + APPROVAL_WAIT_GLYPH + '</span>' + APPROVAL_WAIT_LABEL + '</span>';
  }

  // 실행 목록의 칩 라벨(결정 AR8) — 단계 매핑이 있으면 단계 이름, 없으면 agent_type 을
  // AGENT_RUN_CHIP_MAX_CHARS 로 자른다. 320px 실측에서 agent_type 원문을 그대로 쓰면 칩
  // 글자가 두 줄로 찢어졌다(목업 1차) — 그 방어다.
  function agentRunChipLabel(run){
    if(run.phase) return run.phase;
    var agentType = run.agent_type || '';
    if(agentType.length > AGENT_RUN_CHIP_MAX_CHARS){
      return agentType.slice(0, AGENT_RUN_CHIP_MAX_CHARS) + TRUNCATION_MARK;
    }
    return agentType;
  }

  // 실행 목록의 제목(결정 AR9 → TF12, docs/prps/hub-agent-title-and-excerpt-freshness.md) — 재개된
  // 실행이면 마지막 재개 요청의 요약(resume_title), 아니면 meta.description, 없으면 agent_type 으로
  // 강등한다. 빈 줄을 만들지 않는다(meta 를 못 읽은 실행도 오늘 화면과 같은 정보 수준으로는 남는다).
  // 재개됐어도 요약을 못 찾았으면(요청에 요약이 없거나 읽는 범위 밖) 서버가 resume_title 을 비워 주고
  // description 으로 돌아간다 — 더 옛 재개의 요약을 찾아 대신 보이지 않는다. 두 필드를 싣기 전 서버의
  // 페이로드(키 없음)도 undefined 로 같은 폴백을 탄다.
  function agentRunDisplayTitle(run){
    return run.resume_title || run.title || run.agent_type;
  }

  // 순수 구간 길이 라벨(호출→경과가 아니라 두 시각의 차) — elapsedLabel 과 형식은 같지만
  // "…전" 접미가 없다(경과 시간이지 "마지막으로부터"가 아니기 때문이다).
  function durationLabel(durationMs){
    var minutes = Math.floor(durationMs / MS_PER_MINUTE);
    if(!isFinite(minutes) || minutes < 1) return '1분 미만';
    if(minutes < MINUTES_PER_HOUR) return minutes + '분';
    return Math.floor(minutes / MINUTES_PER_HOUR) + '시간 ' + (minutes % MINUTES_PER_HOUR) + '분';
  }

  // 세션 첫 줄의 소요 시간 — 해당 작업을 시작한 순간부터 센다(결정 LM11): 시작 = 서버가 정한 session.task_started_at_ms(같은 세션에서 다른 작업을
  // 시작하면 새 시각으로 초기화된다), 그 값이 없으면 session.started_at_ms(세션 시작)로 되돌아간다. 끝 = 세션이 도는 중(working·background)이면 지금까지,
  // 멈춘 세션(idle·done·stale·interrupted)이면 마지막 이벤트로 고정한다(멈춘 세션의 시간이 계속 불어나면 의미가 없다). 음수는 durationLabel 이 「1분 미만」으로 처리한다.
  // 서버가 계산하지 않는 클라이언트 파생값이라 snapshot_content_key 에 영향이 없고(task_started_at_ms 는 정적 정수), 30초 틱의 render() 가
  // 다른 경과 라벨과 같은 경로로 다시 그린다. nowMs 는 호출부가 Date.now() 로 넘긴다.
  function sessionElapsedLabel(session, nowMs){
    var startMs = session.task_started_at_ms != null ? session.task_started_at_ms : session.started_at_ms;
    var isRunning = session.state === 'working' || session.state === 'background';
    var endMs = isRunning ? nowMs : session.last_event_at_ms;
    return durationLabel(endMs - startMs) + SESSION_DURATION_SUFFIX;
  }

  // 실행 1건의 경과 시간(결정 AR6/D2) — ★ 서버가 계산하지 않는다. 끝난 실행은
  // ended_at_ms − started_at_ms(정적), 도는 실행은 nowMs − started_at_ms 다. nowMs 는
  // 호출부가 Date.now() 로 넘긴다 — 그래야 목록 전체가 같은 "지금" 을 공유한다.
  function agentRunElapsedLabel(run, nowMs){
    var durationMs = run.ended_at_ms ? (run.ended_at_ms - run.started_at_ms) : (nowMs - run.started_at_ms);
    return durationLabel(durationMs);
  }

  // 재개 횟수 라벨 — "재개 2회". 훅 SubagentStart 재발화 수(resume_count)를 그대로 쓴다(결정 TF7·TF12).
  function agentRunResumeCountLabel(run){
    return AGENT_RUN_RESUME_COUNT_PREFIX + run.resume_count + AGENT_RUN_RESUME_COUNT_SUFFIX;
  }

  // ---- 실행 중 활동 표시(결정 LA8~LA10, docs/prps/hub-live-activity.md) — 아래 순수 함수들은 DOM 에 닿지 않는다.
  // 활동 값(run.activity)은 서버가 호스트 기록에서 뽑은 구조 값(시각·개수·도구 종류)뿐이다 — 자유 문자열이 없어 escapeHtml 이
  // 필요한 값은 이 문구 조립 결과 하나다. 키가 없는 옛 서버의 페이로드는 undefined 라 「활동 없음」과 같은 경로(오늘 화면)를 탄다.

  // 바이트 → 사람이 읽는 크기(툴팁 전용). 1024 단위, KB 는 반올림·MB 는 소수 한 자리.
  function byteSizeLabel(totalBytes){
    if(totalBytes < BYTES_PER_KIB) return totalBytes + 'B';
    if(totalBytes < BYTES_PER_KIB * BYTES_PER_KIB) return Math.round(totalBytes / BYTES_PER_KIB) + 'KB';
    return (totalBytes / (BYTES_PER_KIB * BYTES_PER_KIB)).toFixed(1) + 'MB';
  }

  // 「4분째」 — durationLabel 에 꼬리를 붙이는 얇은 래퍼(활동 줄이 새로 만드는 포맷 함수는 이것 하나다).
  function elapsedSinceLabel(fromMs, nowMs){
    return durationLabel(nowMs - fromMs) + ACTIVITY_ELAPSED_SUFFIX;
  }

  // 「새 기록 없음」 여부(결정 LA8) — 서버는 「언제부터 의심할지」라는 정적 시각만 싣고 클라이언트가 지금과 견준다. 임계값(10분)의
  // 출처는 파이썬 상수 하나다 — 자바스크립트에 사본을 두지 않는다. 시각이 null 이면(결과를 기다리는 호출이 있다) 표지가 서지 않는다.
  function isActivityStalled(activity, nowMs){
    return activity.stall_suspect_at_ms != null && nowMs >= activity.stall_suspect_at_ms;
  }

  // 결과를 기다리는 호출이 있을 때의 문구 — 「명령 실행 중 · 4분째」, 여럿이면 「명령 실행 중 외 1건 · 4분째」, 1분 미만이면 「방금 시작」.
  // 종류·시각은 가장 오래된 호출의 것이다(서버가 그렇게 싣는다).
  function pendingActivityText(activity, nowMs){
    var text = TOOL_KIND_PENDING_LABEL[activity.pending_tool_kind];
    if(activity.pending_count > 1) text += ACTIVITY_PENDING_MORE_INFIX + (activity.pending_count - 1) + ACTIVITY_COUNT_SUFFIX;
    var isJustStarted = nowMs - activity.pending_since_ms < MS_PER_MINUTE;
    return text + ACTIVITY_SEPARATOR
      + (isJustStarted ? ACTIVITY_JUST_STARTED_LABEL : elapsedSinceLabel(activity.pending_since_ms, nowMs));
  }

  // 도구 사이의 문구 — 「마지막 기록 3분 전 · 실행」. 마지막 도구 종류가 없으면 종류를 생략한다.
  function lastRecordActivityText(activity){
    var text = ACTIVITY_LAST_RECORD_LABEL + ' ' + elapsedLabel(activity.last_record_at_ms);
    return activity.last_tool_kind ? text + ACTIVITY_SEPARATOR + TOOL_KIND_NOUN[activity.last_tool_kind] : text;
  }

  // 활동 줄 본문(글리프 제외). 우선순위(결정 LA9): ① 새 기록 없음(경과 = 지금 − 마지막 기록) ② 결과를 기다리는 호출 ③ 마지막 기록.
  // 백그라운드 출력 꼬리(` · 출력 1분 전`)는 셋 공통이다.
  function agentRunActivityText(activity, nowMs){
    var text;
    if(isActivityStalled(activity, nowMs)){
      text = elapsedSinceLabel(activity.last_record_at_ms, nowMs) + ' ' + ACTIVITY_STALL_LABEL;
    } else if(activity.pending_count > 0){
      text = pendingActivityText(activity, nowMs);
    } else {
      text = lastRecordActivityText(activity);
    }
    var output = activity.background_output;
    return output ? text + ACTIVITY_SEPARATOR + ACTIVITY_OUTPUT_LABEL + elapsedLabel(output.updated_at_ms) : text;
  }

  // 도는 실행의 활동 값 — 끝난 실행·활동 없음·키가 없는 옛 페이로드는 null 이다. 활동 줄과 행 툴팁 줄이 이 한 곳을 거쳐 같은 판정을
  // 쓴다(결정 LA9 — 끝난 실행에 활동이 실려 와도 둘 다 생기지 않는다). is_running 은 서버가 판정한 값을 읽기만 한다(G7).
  function runningActivityOf(run){
    return run.is_running && run.activity ? run.activity : null;
  }

  // 실행 줄 안의 활동 줄(결정 LA9) — 도는 실행이고 활동이 있을 때만, 아니면 빈 문자열(줄 자체가 생기지 않는다). 「새 기록 없음」이면
  // ▲(소식 없음 배지와 같은 글리프, 낭독기에는 숨긴다 — 문구가 이미 말한다)와 경고색 글자 모양이 붙는다.
  function renderAgentRunActivity(run, nowMs){
    var activity = runningActivityOf(run);
    if(!activity) return '';
    var isStalled = isActivityStalled(activity, nowMs);
    var glyphHtml = isStalled ? '<span class="glyph" aria-hidden="true">' + STATE_GLYPH.stale + '</span>' : '';
    return '<span class="agent-run-activity' + (isStalled ? ' agent-run-activity-stall' : '') + '">'
      + glyphHtml + escapeHtml(agentRunActivityText(activity, nowMs)) + '</span>';
  }

  // 종류별 도구 개수 — 「읽기 6 · 수정 2 · 실행 3」. 0 인 종류는 생략하고, 하나도 없으면 빈 문자열이다.
  function toolCountsLabel(counts){
    var parts = [];
    Object.keys(TOOL_KIND_NOUN).forEach(function(kind){
      if(counts[kind] > 0) parts.push(TOOL_KIND_NOUN[kind] + ' ' + counts[kind]);
    });
    return parts.join(ACTIVITY_SEPARATOR);
  }

  // 행 툴팁 둘째 줄 — 「마지막 기록 14:31(방금) · 14:27 이후 도구 — 읽기 6 · 수정 2」. 개수 범위는 기록 끝 창의 실제 범위다(결정 LA5).
  function activityLastRecordTooltipLine(activity, nowMs){
    var line = ACTIVITY_LAST_RECORD_LABEL + ' ' + absoluteTimeLabel(activity.last_record_at_ms, nowMs)
      + '(' + elapsedLabel(activity.last_record_at_ms) + ')';
    var countsLabel = toolCountsLabel(activity.recent_tool_counts);
    if(!countsLabel) return line;
    return line + ACTIVITY_SEPARATOR + absoluteTimeLabel(activity.recent_counts_since_ms, nowMs)
      + ' ' + ACTIVITY_COUNTS_SINCE_LABEL + countsLabel;
  }

  // 「결과를 기다리는 도구 1건 — 명령 실행 중, 14:27 부터」(결과를 기다리는 호출이 있을 때만).
  function activityPendingTooltipLine(activity, nowMs){
    return ACTIVITY_PENDING_TOOLTIP_LABEL + activity.pending_count + ACTIVITY_COUNT_SUFFIX + ' — '
      + TOOL_KIND_PENDING_LABEL[activity.pending_tool_kind] + ', ' + absoluteTimeLabel(activity.pending_since_ms, nowMs) + ' 부터';
  }

  // 「백그라운드 출력 파일 1개 — 14:30 갱신 · 48KB」(실행이 띄운 출력 파일을 찾았을 때만).
  function activityOutputTooltipLine(output, nowMs){
    return ACTIVITY_OUTPUT_TOOLTIP_LABEL + output.file_count + '개 — ' + absoluteTimeLabel(output.updated_at_ms, nowMs)
      + SESSION_OUTPUT_UPDATED_SUFFIX + ACTIVITY_SEPARATOR + byteSizeLabel(output.total_bytes);
  }

  // 「새 기록 없음」 설명 두 줄(표지가 서 있을 때만). 「기준 N분」은 서버가 준 시각에서 거꾸로 센다 — 표지 시각 = max(마지막 기록,
  // 실행 시작(재개 시각)) + 임계값이라(결정 LA8, run.started_at_ms 는 서버가 그 계산에 쓴 값과 같다) 임계값의 사본 없이 같은 값이 나온다.
  // 해석(「길게 생각하는 중일 수도 있습니다」)은 줄이 아니라 이 툴팁에만 둔다 — 허브는 원인을 모른다(P9).
  function activityStallTooltipLines(run, nowMs){
    var activity = run.activity;
    var thresholdMs = activity.stall_suspect_at_ms - Math.max(activity.last_record_at_ms, run.started_at_ms);
    return [
      absoluteTimeLabel(activity.last_record_at_ms, nowMs) + ACTIVITY_STALL_TOOLTIP_TAIL + durationLabel(thresholdMs) + ').',
      ACTIVITY_STALL_TOOLTIP_NOTE
    ];
  }

  // 행 툴팁에 첫 줄(오늘 문구) 뒤로 더해지는 줄들 — 도는 실행이고 활동이 있을 때만(아니면 빈 배열이라 툴팁이 오늘과 같다).
  function agentRunActivityTooltipLines(run, nowMs){
    var activity = runningActivityOf(run);
    if(!activity) return [];
    var lines = [activityLastRecordTooltipLine(activity, nowMs)];
    if(activity.pending_count > 0) lines.push(activityPendingTooltipLine(activity, nowMs));
    if(activity.background_output) lines.push(activityOutputTooltipLine(activity.background_output, nowMs));
    return isActivityStalled(activity, nowMs) ? lines.concat(activityStallTooltipLines(run, nowMs)) : lines;
  }

  // 백그라운드 대기 세션 첫 줄의 출력 갱신(결정 LA10) — 「출력 1분 전 갱신」. 대기 상태이고 출력 파일을 찾았을 때만 그린다(키가 없는
  // 옛 페이로드는 undefined). 배지 라벨은 건드리지 않는다.
  function renderSessionActivity(session){
    var output = session.state === 'background' && session.background_wait ? session.background_wait.output : null;
    if(!output) return '';
    return '<span class="session-activity">' + ACTIVITY_OUTPUT_LABEL + elapsedLabel(output.updated_at_ms)
      + SESSION_OUTPUT_UPDATED_SUFFIX + '</span>';
  }

  // 칩 툴팁 문구(기존 함수 확장). 순수 함수 — DOM 에 닿지 않는다.
  // 예: "code-reviewer · 검수 단계 · sonnet · 시작 16:50 · 진행 중"
  // 재개된 실행(결정 TF12)은 시작 라벨이 「재개」로 바뀌고(그 시각이 마지막 재개였다) 끝에 횟수가 붙는다:
  //     "code-reviewer · 검수 단계 · sonnet · 재개 16:57 · 진행 중 · 재개 2회"
  // 재개 여부는 resume_count 로만 본다(키가 없는 구버전 서버 페이로드는 undefined > 0 이라 오늘 문구 그대로).
  // 타입·모델·시작 시각은 화면(칩·제목·경과)에 없으므로 여기가 유일한 출처다(결정 R4 충족).
  // 도는 실행에 활동이 있으면(결정 LA9) 이 첫 줄 뒤로 줄이 더해진다 — .tooltip 이 white-space:pre-wrap 이라 줄바꿈이 산다.
  // 활동이 없으면 첫 줄 하나뿐이라 오늘 문구 그대로다.
  function agentRunTooltipText(run){
    var nowMs = Date.now();
    var phaseLabel = run.phase ? (run.phase + ' 단계') : AGENT_RUN_NO_PHASE_LABEL;
    var modelLabel = run.model || AGENT_RUN_NO_MODEL_LABEL;
    var isResumed = run.resume_count > 0;
    var startedLabel = (isResumed ? AGENT_RUN_RESUMED_AT_LABEL : SESSION_START_LABEL) + ' '
      + absoluteTimeLabel(run.started_at_ms, nowMs);
    var statusLabel = run.is_running ? AGENT_RUN_RUNNING_LABEL : AGENT_RUN_ENDED_LABEL;
    var resumeCountSuffix = isResumed ? ' · ' + agentRunResumeCountLabel(run) : '';
    var firstLine = run.agent_type + ' · ' + phaseLabel + ' · ' + modelLabel + ' · ' + startedLabel + ' · ' + statusLabel
      + resumeCountSuffix;
    return [firstLine].concat(agentRunActivityTooltipLines(run, nowMs)).join('\n');
  }

  // 화면에 실을 실행 목록의 유일한 판정자(결정 AR11·PT4-A, docs/prps/
  // hub-session-list-and-glow-fixes.md §5.4 「(A) 채택 확정」). renderAgentRunList 와
  // shouldRenderSession 이 이 함수를 공유한다 — shouldRenderSession 이 agent_runs.length 를
  // 직접 보면 "줄은 없는데 카드는 남는" 어긋남이 생긴다(GOTCHA 3). 이전 작업 실행
  // (run.is_previous_task, 서버가 채운 사실)은 여기서 걸러낸다 — 끝난 작업의 실행이 새
  // 프롬프트로 작업을 다시 시작한 뒤에도 그대로 남아 새 작업의 것처럼 읽히는 결함(이슈 3)을
  // 막는다. 실행이 전부 이전 작업이면 이 함수는 빈 배열을 돌려주고, shouldRenderSession 이
  // 그 결과를 그대로 보므로 — 발췌·워크플로우 칩도 없는 done 세션이면 — 세션 줄 자체가
  // 사라질 수 있다(결정 V2 의 정확한 귀결이지 회귀가 아니다, §5.4 4항).
  function visibleAgentRunRows(runs){
    if(!runs) return [];
    return runs.filter(function(run){ return !run.is_previous_task; }).slice(0, MAX_VISIBLE_AGENT_RUNS);
  }

  // 실행 1건 — 단계 칩 + 제목 + 경과 3칸. 실행 중이면 칩에 강조색 + 보조기술용 텍스트가 붙는다.
  // 글리프는 두지 않는다(결정 MX10, docs/prps/hub-session-modal-cleanup.md) — 실행 중/종료의
  // 시각 구분은 색 하나이고, 화면 낭독기에는 아래 텍스트가 「진행 중」으로 읽힌다. 툴팁은 행 전체에
  // 붙는다(§7.5) — 타입·모델·시작 시각의 유일한 출처다. 도는 실행의 활동 줄(결정 LA9)은 행 **안**의 마지막
  // 자식이라 행 툴팁·렌더 키(agent_id)를 공유하고, 활동 줄이 있는 행에만 modifier 가 붙는다(오늘의 줄 모양 보존).
  function renderAgentRunRow(run, nowMs){
    var runningClass = run.is_running ? ' agent-chip-running' : '';
    var runningSrText = run.is_running
      ? '<span class="sr-only"> ' + AGENT_RUN_RUNNING_LABEL + '</span>' : '';
    var activityHtml = renderAgentRunActivity(run, nowMs);
    var activityClass = activityHtml ? ' agent-run-with-activity' : '';
    return '<div class="agent-run' + activityClass + '" ' + RENDER_KEY_ATTRIBUTE + '="' + escapeHtml(run.agent_id)
      + '" data-tooltip="' + escapeHtml(agentRunTooltipText(run)) + '">'
      + '<span class="agent-chip' + runningClass + '">'
      + escapeHtml(agentRunChipLabel(run)) + runningSrText + '</span>'
      + '<span class="agent-run-title">' + escapeHtml(agentRunDisplayTitle(run)) + '</span>'
      + '<span class="agent-run-meta">' + escapeHtml(agentRunElapsedLabel(run, nowMs)) + '</span>'
      + activityHtml + '</div>';
  }

  // 실행 목록 전체. 상한(MAX_VISIBLE_AGENT_RUNS=5) 을 넘는 실행은 개수 줄로만 알린다(결정
  // AR11 — K3 조용히 버림의 이 목록 한정 개정). summarize_agent_runs(서버)가 실행 중을
  // 항상 먼저 주므로(결정 K2) 상한 안에서도 지금 진행 중인 작업은 계속 보인다.
  function renderAgentRunList(runs){
    var visibleRows = visibleAgentRunRows(runs);
    if(!visibleRows.length) return '';
    var nowMs = Date.now();
    var rowsHtml = visibleRows.map(function(run){ return renderAgentRunRow(run, nowMs); }).join('');
    // 오버플로 개수는 상한(MAX_VISIBLE_AGENT_RUNS) 초과분만 센다 — 이전 작업이라 걸러진
    // 실행(run.is_previous_task)은 "더 볼 수 있는 것"이 아니라 애초에 안 보이는 것이므로
    // 여기 넣으면 "+N건 더"가 실제로 없는 실행을 있는 것처럼 알리게 된다(visibleAgentRunRows
    // 의 필터와 같은 술어를 다시 써서 세는 이유).
    var currentTaskRunCount = runs.filter(function(run){ return !run.is_previous_task; }).length;
    var overflowCount = currentTaskRunCount - visibleRows.length;
    var overflowHtml = overflowCount > 0
      ? '<div class="agent-run-more">+' + overflowCount + AGENT_RUN_OVERFLOW_SUFFIX + '</div>' : '';
    return '<div class="agent-run-list">' + rowsHtml + overflowHtml + '</div>';
  }

  // 카드에 보일 발췌 문구. 순수 함수 — 상한을 넘으면 말줄임표를 붙여 자른다.
  function excerptDisplayText(fullText){
    if(fullText.length <= EXCERPT_DISPLAY_MAX_CHARS) return fullText;
    var cutLength = EXCERPT_DISPLAY_MAX_CHARS;
    if(HIGH_SURROGATE_PATTERN.test(fullText.charAt(cutLength - 1))) cutLength -= 1;
    return fullText.slice(0, cutLength) + TRUNCATION_MARK;
  }

  // 자동주입 태그로 시작하는 발췌는 화면에서 숨긴다(방어 필터, 결정 PS6,
  // docs/prps/hub-agent-runs-and-prompt-source.md). 발췌 값(session.task_excerpt)은
  // hub_transcript.parse_session_tail 이 transcript 꼬리의 last-prompt 줄에서 그대로 읽어
  // 오거나, 마지막 사람 입력 줄에서 호스트 규칙의 사본으로 뽑은 것이다(결정 TF1~TF3) —
  // 앞의 값을 누가 어떻게 만드는지(자동주입 블록을 벗기는지 여부)는 호스트(Claude Code)의
  // 몫이라 허브가 강제할 수 없고, 뒤의 값은 그 규칙을 옮긴 사본이라 호스트가 규칙을 바꾸면
  // 어긋날 수 있다. 최근 세션 실측(30/30)은 이 태그로 **시작하는** 값이 없었지만, 이는
  // 관측이지 계약이 아니다 — 호스트 형식이 바뀌면 재발할 수 있다는 전제로 이 필터를 접두
  // 전용 방어선으로 유지한다(hub/README.md 「알려진 한계」 참조 — 문자열 **중간**에 섞여
  // 들어오는 경우는 이 필터로 못 잡는다).
  var AUTO_INJECTED_TAG_START_PATTERN = /^\s*<(ide_\w+|task-notification)>/;
  function displayableExcerpt(taskExcerpt){
    if(!taskExcerpt) return '';
    return AUTO_INJECTED_TAG_START_PATTERN.test(taskExcerpt) ? '' : taskExcerpt;
  }

  // 발췌 1줄. 카드 높이가 고정(340px)이라 긴 프롬프트를 화면에서 다 흘릴 수 없다 — 잘린
  // 뒷부분은 hover 툴팁이 맡는다. data-tooltip 은 실제로 잘렸을 때만 붙인다: 보이는 텍스트와
  // 같은 툴팁은 정보 손실이 없어 소음이며, 카드 이름에서 이미 같은 판단을 했다(결정 R4).
  // 툴팁이 보여주는 것도 "전문"이 아니라 서버가 넘겨준 값의 상한까지다 — 그 값은
  // hub_transcript.parse_session_tail 이 transcript 꼬리에서 (호스트가 쓴 last-prompt 줄의
  // 값 또는 마지막 사람 입력 줄에서 뽑은 값으로) 읽어 hub_transcript.LAST_PROMPT_MAX_CHARS
  // (400자)로 다시 자른 것이다(결정 PS9·TF4). 서버 상한에 걸려 잘렸다면
  // hub_transcript.LAST_PROMPT_TRUNCATION_MARK 가 문구 끝에 실려 온다. 다만 호스트 자신이
  // 그보다 먼저(실측 max 201자, §1.4) 잘라 뒀을 수 있고(사람 입력 줄에서 뽑는 값도 같은
  // 200자 + … 규칙이다) 그 경우 자체 말줄임표 표시 여부는 이 코드가 알 수 없다 — 서버
  // 상한 미도달만으로 "전문"을 보장하지 않는다.
  function renderSessionExcerpt(fullText){
    if(!fullText) return '';
    var displayText = excerptDisplayText(fullText);
    var tooltipAttribute = displayText === fullText
      ? '' : ' data-tooltip="' + escapeHtml(fullText) + '"';
    return '<span class="excerpt"' + tooltipAttribute + '>' + escapeHtml(displayText) + '</span>';
  }

  // 세션 모델 표시 문구. 순수 함수 — DOM 에 닿지 않는다. 예: "Opus 5 · xhigh", "Opus 4.6"
  // (effort 가 없으면 생략, 결정 MD7 E9). 상한(MODEL_LABEL_MAX_CHARS)을 넘으면 말줄임표로
  // 자른다 — 정규화가 성공한 이름은 전부 상한 미만이라(§3.6) 이 경로는 정규화 실패 시의
  // 원문 ID 폴백(예: 구세대 "claude-3-5-sonnet-20241022")에서만 실제로 쓰인다.
  function sessionModelLabel(model){
    var label = model.model_label;
    if(label.length > MODEL_LABEL_MAX_CHARS){
      label = label.slice(0, MODEL_LABEL_MAX_CHARS) + TRUNCATION_MARK;
    }
    return model.effort ? (label + MODEL_EFFORT_SEPARATOR + model.effort) : label;
  }

  // 세션 모델 칸(요구 2). model 이 없으면 빈 문자열(줄 자체가 생기지 않는다) — 정체성
  // 필드가 아니라 정당하게 부재할 수 있는 부가 정보이기 때문이다(결정 MD7 — transcript 가
  // 없는 비대화형 세션이 실측 다수). 상한을 넘겨 실제로 잘렸을 때만 data-tooltip 으로 원문
  // 모델 ID 를 보여준다 — renderSessionExcerpt 가 이미 쓰는 관례(결정 R4, 보이는 텍스트와
  // 같은 툴팁은 소음)를 그대로 재사용한다(새 개념 0개).
  function renderSessionModel(model){
    if(!model) return '';
    var isTruncated = model.model_label.length > MODEL_LABEL_MAX_CHARS;
    var tooltipAttribute = isTruncated
      ? ' data-tooltip="' + escapeHtml(model.raw_model_id) + '"' : '';
    return '<span class="session-model"' + tooltipAttribute + '>'
      + '<span class="sr-only">' + SESSION_MODEL_SR_LABEL + '</span>'
      + escapeHtml(sessionModelLabel(model)) + '</span>';
  }

  // 센트 정수 → "≈$12.84"(100달러 미만) · "≈$123"(100달러 이상은 정수). 순수 함수 — 정수 연산만 쓴다(부동소수 잡음 없음).
  function sessionCostAmountLabel(totalCostCents){
    var dollars = Math.floor(totalCostCents / CENTS_PER_DOLLAR);
    if(dollars >= SESSION_COST_WHOLE_DOLLAR_FROM) return SESSION_COST_APPROX_PREFIX + dollars;
    var remainderCents = totalCostCents % CENTS_PER_DOLLAR;
    return SESSION_COST_APPROX_PREFIX + dollars + '.' + (remainderCents < 10 ? '0' : '') + remainderCents;
  }

  // 세션 비용 칩 문구. 순수 함수 — DOM 에 닿지 않는다. 예: "≈$12.84 · 컨텍스트 62%", "≈$123 · 컨텍스트 91%", "≈$0.03",
  // "컨텍스트 62%". 그릴 값이 없으면 빈 문자열(API 시간만 있는 캡처는 칩을 만들지 않는다 — 툴팁에만 쓰인다).
  function sessionCostLabel(cost){
    var parts = [];
    if(typeof cost.total_cost_cents === 'number') parts.push(sessionCostAmountLabel(cost.total_cost_cents));
    if(typeof cost.context_used_percent === 'number') parts.push(SESSION_CONTEXT_LABEL + cost.context_used_percent + '%');
    return parts.join(SESSION_COST_LABEL_SEPARATOR);
  }

  // 세션 비용 칩 툴팁. 순수 함수 — 고지 접두 + (API 시간이 있으면 " · API 시간 N분", 0분이면 "1분 미만").
  function sessionCostTooltip(cost){
    if(typeof cost.api_duration_minutes !== 'number') return SESSION_COST_TOOLTIP_PREFIX;
    var apiTime = cost.api_duration_minutes === 0 ? SESSION_API_TIME_UNDER_ONE_MINUTE : cost.api_duration_minutes + '분';
    return SESSION_COST_TOOLTIP_PREFIX + SESSION_API_TIME_TOOLTIP_LABEL + apiTime;
  }

  // 세션 비용·컨텍스트 칩(⑨ 안 A). cost 가 없거나 그릴 문구가 없으면 빈 문자열(줄 자체가 생기지 않는다) — 정체성 필드가 아니라
  // 정당하게 부재할 수 있는 부가 정보다(statusLine 을 켜지 않은 세션·데스크톱 진입점 등). 툴팁은 정가 기준 추정 고지라 항상 단다.
  function renderSessionCost(cost){
    if(!cost) return '';
    var label = sessionCostLabel(cost);
    if(!label) return '';
    return '<span class="session-cost" data-tooltip="' + escapeHtml(sessionCostTooltip(cost)) + '">'
      + '<span class="sr-only">' + SESSION_COST_SR_LABEL + '</span>' + escapeHtml(label) + '</span>';
  }

  // 세션 식별 줄(요구 3). 시작 시각과 short_id 를 함께 싣는다 — 하나만으로는 부족하다:
  // 시작 시각은 같은 분 기동에서 겹칠 수 있고, short_id 는 "서로 다르다"만 알려주고
  // "어떤 세션인지"를 답하지 않는다. 서수(#1·#2…)는 쓰지 않는다: 보존 창에서 옛 세션이
  // 빠지면 번호가 밀려 같은 세션이 다른 번호로 보이고, 최신순 렌더와 시작순 번호가 역행한다.
  // data-tooltip 은 결정 R4 를 충족한다 — short_id 는 session_id 의 절단이라 정보 손실이
  // 실재하고, 전체 id 는 트랜스크립트(~/.claude/projects/<enc>/<id>.jsonl) 교차 참조에 쓰인다.
  // 모델·effort(요구 2)는 세 번째 항목으로 얹는다 — 세로 증분 0px(설계 단계 실측, §3.9).
  // 비용·컨텍스트(⑨ 안 A)는 네 번째 항목이다 — 값이 없으면 빈 문자열이라 줄이 생기지 않는다.
  function renderSessionMeta(session){
    return '<div class="session-meta"><span class="session-start">'
      + SESSION_START_LABEL + ' ' + absoluteTimeLabel(session.started_at_ms, Date.now())
      + '</span><span class="session-id" data-tooltip="' + escapeHtml(session.session_id) + '">'
      + '<span class="sr-only">세션 ID </span>' + escapeHtml(session.short_id) + '</span>'
      + renderSessionModel(session.model) + renderSessionCost(session.session_cost) + '</div>';
  }

  // 칩에 보일 label. 상한(WORKFLOW_LABEL_MAX_CHARS)을 넘으면 말줄임표로 자른다 — label 은
  // 스크립트가 프롬프트 머리에서 파생시킬 수 있어 실측 max 60자까지 간다(§2, 절단은 콘텐츠
  // 취급이라 스크럽과 별개로 클라이언트가 맡는다).
  function workflowChipDisplayLabel(agent){
    var label = agent.label;
    if(label.length > WORKFLOW_LABEL_MAX_CHARS){
      return label.slice(0, WORKFLOW_LABEL_MAX_CHARS) + TRUNCATION_MARK;
    }
    return label;
  }

  // 화면에 실을 워크플로우 칩 목록의 유일한 판정자(visibleAgentRunRows 와 같은 관용구,
  // GOTCHA 3) — shouldRenderSession 이 이 함수를 반드시 경유해야 칩 유무와 줄 표시가
  // 어긋나지 않는다. 상한 밖은 표시하지 않는다("+N" 오버플로 칩은 결정 K3 로 폐기됐다).
  function visibleWorkflowAgents(agents){
    if(!agents) return [];
    return agents.slice(0, MAX_VISIBLE_WORKFLOW_CHIPS);
  }

  // 워크플로우 칩 하나. 툴팁을 붙이지 않는다(결정 WT1, docs/prps/hub-ui-4-issues.md §4) —
  // 프롬프트·결과 발췌는 읽을 수 있는 형태가 아니었다(§4.1 — 결과 84%가 raw JSON 이고 그중
  // 98.9%가 잘려서 파싱 불가). 실패한 에이전트는 색 상태만으로 구분한다(선택 항목 E, 결정
  // WT7) — renderAgentRunRow 의 runningClass 와 같은 형태, sr-only 텍스트로 색 단독을 피한다
  // (D4 다중 채널).
  function renderWorkflowChip(agent){
    var errorClass = agent.state === WORKFLOW_STATE_ERROR ? ' agent-chip-error' : '';
    var errorSrText = agent.state === WORKFLOW_STATE_ERROR
      ? '<span class="sr-only"> 실패</span>' : '';
    return '<span class="agent-chip' + errorClass + '">'
      + escapeHtml(workflowChipDisplayLabel(agent)) + errorSrText + '</span>';
  }

  // 워크플로우 칩 행 전체. workflow 가 없으면 빈 문자열 — 줄 자체가 생기지 않는다.
  // 정렬은 index 오름차순으로, 서버(hub_workflow.parse_workflow_run)가 이미 그 순서로
  // 보낸다(§2·결정 WF9).
  function renderWorkflowRun(workflow){
    if(!workflow) return '';
    var visibleAgents = visibleWorkflowAgents(workflow.agents);
    if(!visibleAgents.length) return '';
    return '<div class="workflow-runs">' + visibleAgents.map(renderWorkflowChip).join('') + '</div>';
  }

  // 세션 행의 신원·클릭 가능 속성(ST26 규칙 그대로, 담체 이름만 이전 조직도의 세션 노드에서
  // session-row 로 바뀐다, 결정 U2). 그 세션 노드가 nodeAttrs 로 하던 일을 그대로 옮긴
  // 것이다 — 불변식 OC-A(키가 없으면 사유가 반드시 붙는다)는 if/else 로 강제한다.
  // 모달 세션 카드(renderSessionCard)도 이 속성 집합을 글자 그대로 쓴다(결정 SC4) —
  // 패널 IIFE 가 한 줄도 바뀌지 않는 근거다(readCardTarget 이 카드든 모달 카드든 같은
  // 속성만 읽는다).
  function sessionRowAttributes(project, session){
    // 결정 FT4(docs/prps/hub-ui-4-issues.md §5) — 끝난 작업의 대시보드는 클릭 대상에서
    // 뺀다. 서버는 사실(bool)만 주고 클릭 가능 여부는 여기서 정한다(GN4 와 같은 관례).
    var isClickable = Boolean(session.dashboard_key) && isServed && !session.tier1_is_finished_task;
    var emptyReason = sessionPanelEmptyReason(session, isClickable);
    var attrs = ' data-project-path="' + escapeHtml(project.path || '') + '"'
      + ' ' + PROJECT_NAME_ATTRIBUTE + '="' + escapeHtml(project.display_name) + '"'
      + ' ' + SESSION_ID_ATTRIBUTE + '="' + escapeHtml(session.session_id) + '"'
      + ' ' + SESSION_SHORT_ID_ATTRIBUTE + '="' + escapeHtml(session.short_id) + '"';
    if(isClickable) attrs += ' data-dashboard-key="' + escapeHtml(session.dashboard_key) + '"';
    // else 로 붙이는 것이 불변식 OC-A 의 유일한 강제 지점이다(T25-105) — 프로젝트를 여는 다른
    // 요소(모달 루트)가 패널 속성을 잃어 이 함수 하나만 남았다(결정 MX1).
    else attrs += ' data-panel-empty-reason="' + escapeHtml(emptyReason) + '"';
    // 끝난 대시보드에는 file:// 안내 툴팁도 함께 가려야 한다 — 「서버를 켜면 볼 수
    // 있습니다」를 띄우면 사유 문구와 정면으로 어긋난다(결정 FT4).
    if(session.dashboard_key && !isClickable && !session.tier1_is_finished_task){
      attrs += ' data-tooltip="' + escapeHtml(FILE_MODE_DASHBOARD_HINT) + '"';
    }
    return attrs;
  }

  // 세션별 진행률(요구 2, 결정 U4·U9) — 항상 그리고 CSS 가 감춘다(.session-tier1 의 표시
  // 여부를 JS 가 분기하지 않는다). session.tier1 이 없으면 대시보드 없음 한 줄.
  function renderSessionProgress(session){
    var body = session.tier1
      ? renderTier1(session.tier1)
      : '<div class="session-no-dashboard">' + SESSION_NO_DASHBOARD_LABEL + '</div>';
    return '<div class="session-tier1">' + body + '</div>';
  }

  // 세션 줄·세션 카드 공통 내용(첫 줄·메타·발췌·진행·실행·워크플로). 1단 본문(첫 줄·메타·발췌)을 다 그린 뒤 2단 가지(진행률
  // → 실행 줄 → 워크플로)를 연다 — DOM 순서가 곧 시각 순서다(결정 LM2, CSS order 를 쓰지 않는다: 화면 낭독기는
  // 버튼 안 자식을 DOM 순서로 읽는다). 첫 줄(.session-line)은 상태 배지(+ 해당할 때 승인 대기 표지 —
  // 결정 AW3)와 소요 시간(작업 시작부터 — 마지막 이벤트 경과가 아니다, 그건 프로젝트 머리 .last-activity 가
  // 보인다)이고(백그라운드 대기 세션이 출력 파일을 찾았으면 그 뒤에 출력 갱신이 붙는다 — 결정 LA10),
  // 식별 줄(.session-meta)이 첫 줄 안으로 새지 않는 불변을 T25-127 이 이 함수 안에서 문다(앵커 이동 —
  // 결정 SC6). renderSession(카드 세션 줄)과 renderSessionCard(모달 세션 카드, 아래 카드 상세보기
  // 절)가 이 함수를 공유한다(DRY) — 소비자가 둘이 됐다.
  function renderSessionContent(session){
    return '<div class="session-line">'
      + renderStateBadge(session.state, session.base_state, session.last_event_at_ms, session.interruption, session.background_wait)
      + renderApprovalWaitBadge(session)
      + '<span class="session-time"><span class="sr-only">' + SESSION_DURATION_SR_LABEL + '</span>'
      + sessionElapsedLabel(session, Date.now()) + '</span>'
      + renderSessionActivity(session)
      + '</div>' + renderSessionMeta(session)
      + renderSessionExcerpt(displayableExcerpt(session.task_excerpt))
      + renderSessionProgress(session)
      + renderAgentRunList(session.agent_runs)
      + renderWorkflowRun(session.workflow);
  }

  // 세션 행 하나 — <button class="session-row"> 로 감싸 세션 대시보드로의 클릭 진입점을
  // 만든다(문제 5, 결정 U5·U14 — 확장 여부와 무관하게 항상 클릭 대상이다).
  function renderSession(project, session){
    return '<li ' + RENDER_KEY_ATTRIBUTE + '="' + escapeHtml(session.session_id) + '">'
      + '<button type="button" class="session-row"' + sessionRowAttributes(project, session) + '>'
      + renderSessionContent(session) + '</button></li>';
  }

  // 숨김 조건 = 완료 + 표시할 발췌 없음 + 보이는 실행·칩 0개(결정 V2). visibleAgentRunRows ·
  // visibleWorkflowAgents · displayableExcerpt 를 반드시 경유한다(GOTCHA 3) —
  // session.agent_runs.length 나 session.task_excerpt 를 직접 보면, 상한 밖으로 밀린 실행
  // 때문에 목록이 없는데도 줄이 남거나, 자동주입 태그로 시작해 화면에서는 숨겨진 발췌
  // 때문에 줄이 남는 어긋남이 생긴다. 워크플로우 칩만 있고 나머지가 없는 세션도 이 경유가
  // 없으면 같은 계열의 어긋남(목록은 있는데 줄이 숨음)이 난다(결정 WF9). stale 세션은
  // 마지막 이벤트로부터 STALE_SESSION_HIDE_AFTER_MS(결정 Z1) 넘게 조용하면 함께 숨긴다.
  // 셋 다 클라이언트 전용 필터라 프로젝트 배지 집계(서버의 state)에는 영향을 주지 않는다
  // (결정 V1).
  function shouldRenderSession(session){
    var hasVisibleChip = visibleAgentRunRows(session.agent_runs).length > 0
      || visibleWorkflowAgents(session.workflow ? session.workflow.agents : null).length > 0;
    if(session.state === 'done' && !displayableExcerpt(session.task_excerpt) && !hasVisibleChip) return false;
    if(session.state === 'stale' && (Date.now() - session.last_event_at_ms) >= STALE_SESSION_HIDE_AFTER_MS){
      return false;
    }
    return true;
  }

  function renderTier1ImplProgress(tier1){
    if(!tier1.impl_total) return '';
    return '<div class="tier1-impl">구현 세부 ' + tier1.impl_done + '/' + tier1.impl_total + '</div>';
  }

  // 진행률 2줄(제목 — 완료/전체 · %, 구현 세부). 호출자는 tier1 이 있을 때만 부른다 — 세션 줄·모달
  // 세션 카드(renderSessionProgress) 전용이다. 카드와 카드 상세보기 머리는 프로젝트 단위 진행률을
  // 그리지 않는다(결정 MX4, docs/prps/hub-session-modal-cleanup.md) — 그래서 이전 작업·주인 세션
  // 없음 라벨 인자와 null 가드도 없다. 진행률 줄 맨 앞 단계 칩은 없다 — 아래 서브에이전트 실행 칩과
  // 헷갈려 걷었다(결정 LM12, docs/prps/hub-session-row-layout-and-modal-size.md). 승인 대기 표지는 첫 줄에 산다 — AW3.
  function renderTier1(tier1){
    return '<div class="tier1-pct">' + escapeHtml(tier1.title) + ' — '
      + tier1.completed + '/' + tier1.total + ' · ' + tier1.percent + '%</div>'
      + renderTier1ImplProgress(tier1);
  }

  // 드래그 전용 핸들(결정 DG1~DG3). 키보드로 아무 것도 할 수 없게 됐으므로 <button> 이 아니다 —
  // 포커스는 받지만 Enter/Space 에 반응하지 않는 컨트롤은 보조기술 사용자에게 거짓말이 된다.
  // aria-hidden 으로 접근성 트리에서 빼고, Tab 순서에서도 자연히 빠진다(span 은 기본 비포커스).
  function renderDragHandle(){
    return '<span class="card-drag-handle" draggable="true" aria-hidden="true" data-tooltip="'
      + escapeHtml(DRAG_HANDLE_HINT) + '">' + DRAG_HANDLE_ICON_SVG + '</span>';
  }

  // 카드 제목 — 카드 상세보기를 열 수 있을 때만 <button aria-haspopup="dialog"> 이고, 아니면 눌러도
  // 아무 일이 없으니 <span> 이다(결정 MX2, N6 「없는 기능을 있는 척하지 않는다」 — 포커스를 받는데
  // 반응하지 않는 컨트롤은 보조기술 사용자에게 거짓말이다). 분기 조건은 티어·dashboard_key·서버 여부가
  // 아니라 카드 표지와 같은 한 값(opensSessionModal)뿐이다: 옛 OC11 은 「모든 카드가 무언가를 연다」를
  // 전제로 항상 버튼이었고, 그 전제는 보일 세션이 없는 카드에서 깨졌다(T25-256 이 이 분기를 문다).
  // aria-haspopup 은 Enter/Space 가 대화상자(모달)를 연다는 사실을 스크린리더에 알린다(결정 SC4).
  // data-tooltip 은 R4 로 제거됐다: 보이는 텍스트와 같아 정보 손실이 없다(결정 X1).
  function renderProjectNameEl(project, opensSessionModal){
    var nameHtml = escapeHtml(project.display_name);
    return opensSessionModal
      ? '<button class="project-name" type="button" aria-haspopup="dialog">' + nameHtml + '</button>'
      : '<span class="project-name">' + nameHtml + '</span>';
  }

  // 서버 hub_project.PROJECT_STATE_PRIORITY 와 같은 6값 순서(결정 SO1·SO3,
  // docs/prps/hub-session-list-and-glow-fixes.md §4 — interrupted 는 결정 RI9,
  // docs/prps/hub-rate-limit-interruption.md 가 working 다음·idle 앞에 끼워 넣고, background
  // 는 결정 BW8, docs/prps/hub-subagent-background-pause.md 가 interrupted 다음·idle
  // 앞에 끼워 넣는다) — 앞이 이긴다. 서버 상수를 import 할 수 없어 값이 두 번째 리터럴로
  // 산다(STALE_AFTER_MINUTES 와 같은 관례) — T25-219 가 이 파일과 hub_project.py 양쪽에서
  // 순서를 뽑아 대조한다.
  var SESSION_STATE_ORDER = ['working','interrupted','background','idle','stale','done'];

  // 목록에 없는 상태는 배열 끝(가장 아래)으로 폴백한다 — 새 상태가 생겨도 정렬이 예외로
  // 죽지 않는다(결정 SO3).
  function sessionStateRank(state){
    var index = SESSION_STATE_ORDER.indexOf(state);
    return index === -1 ? SESSION_STATE_ORDER.length : index;
  }

  // 세션 정렬 비교자(결정 SO1·SO2·SO5) — 표시 상태(session.state) 우선순위로 먼저 가르고,
  // 같은 상태 안에서는 최근 이벤트 내림차순, 동률은 short_id 오름차순으로 결정적으로 깬다
  // (서버 summarize_agent_runs 가 agent_id 로 타이를 깨는 것과 같은 관례, AR5). 비결정
  // 정렬은 매 틱(TICK_MS) 헛 노드 이동이 된다 — 맞대기(결정 PU1)가 순서 차이를 실제 이동으로
  // 읽어 툴팁을 닫고(PU5) 앵커를 흔든다.
  function compareSessionsForDisplay(a, b){
    var stateRankDiff = sessionStateRank(a.state) - sessionStateRank(b.state);
    if(stateRankDiff !== 0) return stateRankDiff;
    var timeDiff = b.last_event_at_ms - a.last_event_at_ms;
    if(timeDiff !== 0) return timeDiff;
    return a.short_id < b.short_id ? -1 : (a.short_id > b.short_id ? 1 : 0);
  }

  // "화면에 보이는 세션" 의 유일한 정의(결정 ST20, F4 — 소비자 둘(카드·카드 상세보기,
  // 결정 SC6) 이 된 뒤에도 shouldRenderSession 을 반드시 경유해 필터를 우회하지 않는다는
  // 계약은 그대로다, T25-160·T25-234). 정렬은 상태 우선순위 후 최신순이다(결정 SO1 — 방금
  // 끝난 세션이 진행 중인 세션 위를 차지하던 결함을 고친다). slice() 로 복제해 원본
  // project.sessions 를 변형하지 않는다 — 같은 snapshot 객체가 다음 TICK_MS 렌더에도 재사용된다.
  function visibleSessionsOf(project){
    return project.sessions
      .slice()
      .sort(compareSessionsForDisplay)
      .filter(shouldRenderSession);
  }

  // 카드는 패널 속성도 프로젝트 단위 진행률도 갖지 않는다(결정 SC4·MX4). 프로젝트의 대시보드를 여는
  // 요소는 세션 줄과 모달 세션 카드뿐이고(패널 속성은 sessionRowAttributes 만 단다), 진행률은 그
  // 대시보드를 기록한 세션 줄 아래(renderSessionProgress)에서만 그린다. 카드에 남는 것은 렌더 키와
  // data-project-path(드래그·순서 저장의 조건 — 보일 세션이 없는 카드도 순서는 바꿀 수 있다)이고, 카드
  // 상세보기를 여는지는 별도 표지 하나가 가른다(결정 MX2): 보일 세션이 있을 때만 붙고 클릭 리스너·커서
  // CSS·제목 태그가 모두 그 한 값에서 나온다. T25-233 이 패널 속성의 부재를, T25-255 가 진행률의 부재를,
  // T25-256 이 이 조건을 강제한다. visibleSessions 만 여기서 계산해 renderSession 에 넘긴다.
  function renderProject(project){
    var visibleSessions = visibleSessionsOf(project);
    var opensSessionModal = visibleSessions.length > 0;
    var sessionsHtml = visibleSessions.length
      ? '<ul class="sessions">' + visibleSessions.map(function(session){ return renderSession(project, session); }).join('') + '</ul>' : '';
    var cardAttrs = ' data-project-path="' + escapeHtml(project.path || '') + '"'
      + ' ' + RENDER_KEY_ATTRIBUTE + '="' + escapeHtml(project.path || '') + '"'
      + (opensSessionModal ? ' ' + SESSION_MODAL_OPENER_ATTRIBUTE + '="1"' : '');
    // working 만 강조한다 — stale 은 base_state 가 working 이어도 "소식 없음"이므로 강조하면
    // 지금 돌고 있다고 오해하게 된다(R3, 결정 D2).
    var stateClass = project.state === 'working' ? ' card-working' : '';
    return '<div class="card' + stateClass + '"' + cardAttrs + '>'
      + '<div class="project-head">'
      + renderDragHandle()
      + renderProjectNameEl(project, opensSessionModal)
      + '<span class="badge tier" data-tooltip="' + escapeHtml(TIER_DESCRIPTION[project.tier] || '') + '">' + escapeHtml(TIER_LABEL[project.tier] || ('티어 ' + project.tier)) + '</span>'
      + renderStateBadge(project.state, null, project.last_activity_at_ms)
      + '<span class="last-activity">' + elapsedLabel(project.last_activity_at_ms) + '</span>'
      + '</div>'
      + (project.path ? '<div class="path">' + escapeHtml(project.path) + '</div>' : '')
      + sessionsHtml + '</div>';
  }

  // 세션 행·세션 카드를 열었을 때 패널에 뜨는 사유(결정 ST25) — 패널 사유의 유일한 함수다(프로젝트
  // 요약을 여는 요소가 사라져 프로젝트판은 없다, 결정 MX1). 3분기: 클릭 가능하면 빈 문자열, 대시보드는
  // 있는데 서버가 꺼져 있으면 FILE_MODE_DASHBOARD_HINT, 대시보드 자체가 없으면
  // SESSION_NO_DASHBOARD_REASON. 끝난 대시보드는 그 두 분기보다 앞이다(아래).
  function sessionPanelEmptyReason(session, isClickable){
    if(isClickable) return '';
    // 결정 FT4(docs/prps/hub-ui-4-issues.md §5) — dashboard_key 판정보다 **앞**에 온다.
    // 뒤로 가면 키가 있는 끝난 대시보드가 FILE_MODE_DASHBOARD_HINT(서버를 켜라)로 잘못
    // 설명된다.
    if(session.tier1_is_finished_task) return SESSION_FINISHED_TASK_REASON;
    if(session.dashboard_key) return FILE_MODE_DASHBOARD_HINT;
    return SESSION_NO_DASHBOARD_REASON;
  }

  // 따옴표도 이스케이프한다 — usage-meta 의 data-tooltip="..." 이 이 함수의 첫 속성 자리
  // 사용처다(검수 m3). 텍스트 자리에서는 무해하고, 속성 자리로 재사용될 다음 호출부를 미리
  // 방어한다.
  function escapeHtml(text){
    return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // 상주 서버(개정 쟁점 R3)는 내용이 바뀌지 않으면 hub.html 을 다시 쓰지 않는다 — 그래서
  // collected_at_ms 는 "수집 시각"이 아니라 "마지막 변화 시각"이다. 폴링 성공/실패 자체가
  // 서버 생존의 증거이므로, 그 상태를 별도로 표시해야 "멈춘 것"과 "변화가 없는 것"을 구별할 수
  // 있다(초판 리스크 8 의 재발 방지).
  var POLL_FAILURE_THRESHOLD = 2;
  var consecutiveFailureCount = 0;
  var lastPollSuccessAtMs = null;
  var connectionLost = false;

  function formatTimestamp(epochMs){
    return new Date(epochMs).toLocaleString('ko-KR');
  }

  // #dzh-data 는 신뢰 가능한 서버 생성물이지만 템플릿의 관행대로 방어한다 — Number() 강제
  // 변환 후 isFinite 가 아니면 막대를 그리지 않고, 표시 폭은 0~100 으로 클램프한다(레이아웃
  // 붕괴·스타일 속성 주입 방지). 표시 숫자(rawValue)는 클램프하지 않은 원값을 쓴다.
  function clampPercent(value){
    var number = Number(value);
    if(!isFinite(number)) return null;
    return Math.max(0, Math.min(100, number));
  }

  function renderUsageBar(label, rawValue){
    var clamped = clampPercent(rawValue);
    if(clamped === null) return '';
    return '<div class="usage-row"><span>' + label + '</span><span class="usage-pct">' + rawValue + '%</span></div>'
      + '<div class="usage-bar" role="progressbar" aria-valuenow="' + clamped + '" aria-valuemin="0" aria-valuemax="100" aria-label="' + label + ' 사용률"><span style="width:' + clamped + '%"></span></div>';
  }

  // 남은 시간을 사람이 읽는 문자열로. 이미 지났으면(diffMs<=0) null — 호출자가 줄을 그리지
  // 않는다(결정 R5 의 클라이언트 쪽 2차 필터가 바로 이 판정이다).
  function remainingLabel(untilMs, nowMs){
    var diffMs = untilMs - nowMs;
    if(!isFinite(diffMs) || diffMs <= 0) return null;
    if(diffMs < MS_PER_MINUTE) return '곧';
    if(diffMs < MS_PER_HOUR) return Math.floor(diffMs / MS_PER_MINUTE) + '분 뒤';
    if(diffMs < MS_PER_DAY){
      var hours = Math.floor(diffMs / MS_PER_HOUR);
      var minutes = Math.floor((diffMs % MS_PER_HOUR) / MS_PER_MINUTE);
      return hours + '시간 ' + minutes + '분 뒤';
    }
    return Math.floor(diffMs / MS_PER_DAY) + '일 뒤';
  }

  // '초기화 18:32 · 2시간 12분 뒤'. 값이 없거나 이미 지났으면 null. 순수 — DOM 에 닿지 않는다.
  function usageResetText(resetsAtMs, nowMs){
    if(resetsAtMs === null || resetsAtMs === undefined) return null;
    var value = Number(resetsAtMs);
    if(!isFinite(value)) return null;
    var remaining = remainingLabel(value, nowMs);
    if(remaining === null) return null;
    // "오늘이면 HH:MM, 다른 날이면 M/D HH:MM" 규칙은 세션 식별 줄(renderSessionMeta)과
    // 공유하는 absoluteTimeLabel 로 옮겼다 — 사본을 두지 않는다.
    var absolutePart = absoluteTimeLabel(value, nowMs);
    return USAGE_RESET_LABEL + ' ' + absolutePart + ' · ' + remaining;
  }

  // 초기화 예정 시각 한 줄의 HTML. 그릴 값이 없으면 빈 문자열.
  // 툴팁은 R5 로 제거됐다 — 패널 안에서는 마우스를 올려도 아무 말도 걸지 않는다(결정 UT1).
  // 캡처 시각은 /hub status 의 rate_limit_capture_age_ms 로 진단한다.
  function renderUsageResetRow(resetsAtMs){
    var text = usageResetText(resetsAtMs, Date.now());
    if(text === null) return '';
    return '<div class="usage-reset">' + escapeHtml(text) + '</div>';
  }

  function hideUsagePanel(){
    usageEl.hidden = true;
    document.body.classList.remove('has-usage');
  }

  // 저장된 접힘 상태를 읽는다. 저장소 접근이 막힌 환경(file:// 등)에서는 펼침으로 본다(결정 C3).
  function readStoredUsageCollapsed(){
    try{
      return localStorage.getItem(USAGE_COLLAPSE_STORAGE_KEY) === USAGE_COLLAPSED_FLAG;
    }catch(e){
      return false;
    }
  }

  // 접힘이면 플래그를 쓰고 펼침이면 키를 지운다(결정 C2). 저장 실패는 무시한다 — 이번
  // 페이지 로드 동안만 토글이 유효하다(결정 C3, 테마 토글과 동일 처리).
  function persistUsageCollapsed(collapsed){
    try{
      if(collapsed) localStorage.setItem(USAGE_COLLAPSE_STORAGE_KEY, USAGE_COLLAPSED_FLAG);
      else localStorage.removeItem(USAGE_COLLAPSE_STORAGE_KEY);
    }catch(e){ /* 저장 실패 — 이번 로드 동안만 유효(결정 C3) */ }
  }

  // 접힘 상태에 보일 한 줄 요약 문자열. 순수 함수 — DOM 에 닿지 않는다(결정 C5).
  function usageSummaryText(usage){
    if(usage.is_stale) return USAGE_STALE_LABEL;
    return '세션 ' + usage.session_percent + '% · 주간 ' + usage.weekly_percent + '%';
  }

  // 패널 실측 높이로 본문 하단 여백(--usage-clearance)을 맞춘다(결정 L3). hidden 상태에서는
  // offsetHeight 가 0 이므로 반드시 내용 채우기 → hidden=false 이후에 호출해야 한다(GOTCHA 4).
  function applyUsageClearance(){
    document.body.style.setProperty('--usage-clearance', (usageEl.offsetHeight + USAGE_CLEARANCE_MARGIN_PX) + 'px');
  }

  // 접힘 상태를 클래스·aria-expanded·하단 여백에 반영한다. 재렌더 후 복원 경로다(불변식 H1′).
  function applyUsageCollapsedState(){
    usageEl.classList.toggle('usage-collapsed', isUsageCollapsed);
    usageToggleButton.setAttribute('aria-expanded', isUsageCollapsed ? 'false' : 'true');
    applyUsageClearance();
  }

  // 만료 행 — 막대를 그리지 않는다. 0% 로 오해되는 빈 막대보다 '값 없음'이 정직하다(결정 EX6).
  function renderUsageStaleRow(label){
    return '<div class="usage-row"><span>' + label + '</span>'
      + '<span class="usage-pct usage-pct-empty">' + USAGE_EMPTY_VALUE + '</span></div>';
  }

  // 만료 안내 한 줄. 패널 안 유일한 툴팁 트리거다(결정 EX7) — 그래서 tooltipDismissObserver 의
  // #dzh-usage-body 관찰이 함께 되살아났다(불변식 H1‴ 조항 5 의 조건).
  function renderUsageStaleNote(usage){
    return '<div class="usage-meta usage-stale-note" data-tooltip="' + escapeHtml(USAGE_STALE_TOOLTIP)
      + '">' + USAGE_STALE_LABEL + ' · 마지막 갱신 ' + elapsedLabel(usage.sampled_at_ms) + '</div>';
  }

  // 계정 줄의 이름-값 한 쌍. 값이 비문자열·빈 문자열이면 ''. 순수 — DOM 에 닿지 않는다. 값은
  // 모두 escapeHtml 을 거친다(결정 AC6 — 요금제 표시명도 같은 경로, 분기 없는 한 경로가 검사하기 쉽다).
  function renderUsageAccountPair(term, value){
    if(typeof value !== 'string' || value === '') return '';
    return '<dt>' + term + '</dt><dd>' + escapeHtml(value) + '</dd>';
  }

  // 계정 블록. account 가 없거나 쌍이 0개면 ''(빈 목록을 접근성 트리에 남기지 않는다). 계정은 패널의
  // 장식이다(결정 AC2) — 이 함수가 ''를 돌려줘도 패널은 usage 만으로 그려진다.
  function renderUsageAccount(account){
    if(!account) return '';
    var pairs = renderUsageAccountPair(ACCOUNT_PLAN_TERM, account.plan_label)
      + renderUsageAccountPair(ACCOUNT_ORGANIZATION_TERM, account.organization_name)
      + renderUsageAccountPair(ACCOUNT_EMAIL_TERM, account.email);
    return pairs ? '<dl class="usage-account">' + pairs + '</dl>' : '';
  }

  // 패널을 실제로 띄우는 유일한 경로 — 신선/만료 두 분기가 표시 상태 갱신을 공유한다.
  function showUsagePanel(bodyHtml, summaryText, isStale){
    usageSummaryEl.textContent = summaryText;
    usageBodyEl.innerHTML = bodyHtml;
    usageEl.classList.toggle('usage-stale', isStale);
    usageEl.hidden = false;
    document.body.classList.add('has-usage');
    applyUsageCollapsedState();
  }

  // 컨테이너(#dzh-usage)와 토글 버튼(#dzh-usage-toggle)은 정적, 내용(#dzh-usage-body ·
  // #dzh-usage-summary)만 파생이다(불변식 H1′, 결정 C1). usage 가 없으면(스위치 off·파일
  // 없음·계약 불일치, 결정 U3·U4) 조용히 숨긴다 — 경고를 띄우지 않는다. 만료·롤오버는 숨기지
  // 않고 usage.is_stale 분기로 그린다(R-B, 결정 EX1·EX2). resets 는 장식이다(결정 R3) —
  // 없어도 usage 만 있으면 패널은 그려진다. account 도 같은 지위의 장식이다(결정 AC2) — 두 분기
  // 모두 본문 맨 끝(갱신·만료 문구 뒤)에 계정 줄을 더한다(결정 AC5).
  function renderUsagePanel(usage, resets, account){
    if(!usage){ hideUsagePanel(); return; }
    var sessionResetRow = renderUsageResetRow(resets && resets.session_resets_at_ms);
    var weeklyResetRow = renderUsageResetRow(resets && resets.weekly_resets_at_ms);
    var accountBlock = renderUsageAccount(account);
    if(usage.is_stale){
      showUsagePanel(
        renderUsageStaleRow(USAGE_SESSION_LABEL) + sessionResetRow
        + renderUsageStaleRow(USAGE_WEEKLY_LABEL) + weeklyResetRow
        + renderUsageStaleNote(usage) + accountBlock,
        usageSummaryText(usage), true
      );
      return;
    }
    var sessionBar = renderUsageBar(USAGE_SESSION_LABEL, usage.session_percent);
    var weeklyBar = renderUsageBar(USAGE_WEEKLY_LABEL, usage.weekly_percent);
    if(!sessionBar || !weeklyBar){ hideUsagePanel(); return; }
    var meta = '마지막 갱신 ' + elapsedLabel(usage.sampled_at_ms) + ' ' + USAGE_CYCLE_NOTE;
    showUsagePanel(
      sessionBar + sessionResetRow + weeklyBar + weeklyResetRow
      + '<div class="usage-meta">' + meta + '</div>' + accountBlock,
      usageSummaryText(usage), false
    );
  }

  // 연결 상태 문구는 별도 span 이 아니라 새로고침 버튼의 data-tooltip 으로 제공한다 —
  // 좁은 화면에서 헤더 우측 텍스트가 고정 버튼과 겹치던 문제의 해소책이다. aria-label
  // ("새로고침")과 문구가 달라 전역 툴팁이 aria-describedby 를 붙여 준다(이중 낭독 없음).
  function renderConnectionStatus(){
    if(initialParseError) return;
    var lastChange = formatTimestamp(snapshot.collected_at_ms);
    // 부작용 없는 계산이라 if 체인 위로 올려 둔다(검수 지적, 8db1395 도입). 게이트가
    // "작업중 세션 유무"에서 "탭 가시성"으로 바뀌면서(설계 결정, 옛 게이트 함수 폐기)
    // 대기 분기는 도달 불가가 됐다 — 이 문구는 새로고침 버튼의 data-tooltip 이라 hover·
    // focus 로만 보이고, 그건 탭이 visible 일 때만 가능한데 visible 이면 게이트가 항상
    // 열려 폴링이 돈다. 그래서 다시 2분기로 충분하다.
    var secondsSincePoll = lastPollSuccessAtMs ? Math.floor((Date.now() - lastPollSuccessAtMs) / 1000) : 0;
    var statusText;
    if(!isServed){
      statusText = '마지막 변화: ' + lastChange + ' · 허브 서버 꺼짐';
    } else if(connectionLost){
      statusText = '서버 연결 끊김 — 화면이 ' + lastChange + ' 에 멈췄습니다';
    } else {
      statusText = '마지막 변화: ' + lastChange + ' · 서버 연결됨 (' + secondsSincePoll + '초 전 확인)';
    }
    refreshButton.setAttribute('data-tooltip', statusText);
    refreshButton.classList.toggle('connection-lost', isServed && connectionLost);
  }

  // 설치된 하네스 버전 표기와 새 버전 알림 버튼(harness-versioning 결정 UN7·UN8). 둘 다 정적 마크업이라 노드를
  // 교체하지 않고 hidden·data-tooltip·aria-label·textContent 만 맞춘다(className 은 복사 피드백 IIFE 의 것이라 건드리지
  // 않는다). 뷰가 없으면(설치 기록 없음·옛 서버의 데이터) 둘 다 숨는다 — 이 기능이 없던 화면과 같다.
  function harnessVersionTooltipText(view){
    var parts = ['coding-harness ' + view.installed_version];
    if(view.installed_commit_short) parts[0] += ' (' + view.installed_commit_short + ')';
    var installedAtMs = Date.parse(view.installed_at);
    if(isFinite(installedAtMs)) parts.push('설치 ' + formatTimestamp(installedAtMs));
    return parts.join(' · ');
  }

  function renderHarnessVersion(view){
    var hasInstalledVersion = Boolean(view && view.installed_version);
    harnessVersionEl.hidden = !hasInstalledVersion;
    if(hasInstalledVersion){
      var versionText = 'v' + view.installed_version;
      if(harnessVersionEl.textContent !== versionText) harnessVersionEl.textContent = versionText;
      harnessVersionEl.setAttribute('data-tooltip', harnessVersionTooltipText(view));
    }
    var hasUpdate = Boolean(view && view.is_update_available && view.latest_version);
    updateButtonEl.hidden = !hasUpdate;
    if(!hasUpdate) return;
    var command = updateButtonEl.getAttribute('data-command');
    var labelText = '새 버전 ' + view.latest_version;
    var labelEl = updateButtonEl.querySelector('.update-label');
    if(labelEl.textContent !== labelText) labelEl.textContent = labelText;
    updateButtonEl.setAttribute('aria-label', labelText + ' — 누르면 ' + command + ' 를 복사합니다');
    updateButtonEl.setAttribute('data-tooltip',
      '설치된 버전 ' + (view.installed_version || '알 수 없음') + ' → 최신 ' + view.latest_version
      + ' · 누르면 ' + command + ' 가 복사됩니다. Claude Code 에 붙여 넣어 실행하세요.');
  }

  // 이번 스냅샷으로 저장 순서를 갱신·영속화(필요할 때만)하고 화면에 그릴 순서를 돌려준다.
  // 계산된 전체 순서가 저장된 것과 다를 때만 쓴다(결정 O4) — 정상 상태에서는 첫 렌더 1회만
  // 쓰고 그 뒤로는 0회다(신규 프로젝트가 없는 한).
  function syncProjectOrder(snapshotPaths){
    var displayOrder = orderedProjectPaths(storedProjectOrder, snapshotPaths);
    var nextOrder = nextStoredProjectOrder(storedProjectOrder, snapshotPaths);
    if(JSON.stringify(nextOrder) !== JSON.stringify(storedProjectOrder)) persistProjectOrder(nextOrder);
    storedProjectOrder = nextOrder;
    return displayOrder;
  }

  // [M1] 렌더 맞대기(결정 PU1, docs/prps/hub-session-modal-and-partial-update.md §6·§7) —
  // 새 렌더 결과를 노드 단위로 현재 DOM 과 맞대어 바뀐 텍스트·속성만 고치고, 순서가 바뀐
  // 형제는 노드째 옮긴다. #dzh-app 을 통째로 갈아엎지 않아 스크롤·포커스·hover·진행 중
  // 애니메이션이 갱신을 넘어 산다(설계 단계 실측, 헤드리스 Chrome 153, §2.2). 아래 7함수가
  // 그 알고리즘의 구현이고, appContentHtml·parseErrorHtml 은 render() 가 맞댈 HTML 문자열을
  // 만든다 — 함수 8개 약 70줄(결정 PU1 안 A, 라이브러리 0). 파싱은 <template> 로 한다 —
  // 그 content 는 비활성 문서라 스크립트가 돌지 않고 레이아웃·스타일 계산도 없다.

  /** 새 HTML 을 템플릿으로 파싱만 하고 liveParent 의 자식을 그 결과와 같게 맞춘다. */
  function reconcileChildren(liveParent, nextHtml){
    var template = document.createElement('template');
    template.innerHTML = nextHtml;
    patchChildren(liveParent, template.content);
  }

  /** 형제 목록 맞대기 — 키 짝은 이동, 키 없는 짝은 선행 탐색, 남은 것은 제거(§6 알고리즘 정본). */
  function patchChildren(liveParent, nextParent){
    var keyed = {};
    var liveChildren = liveParent.children;
    for(var i = 0; i < liveChildren.length; i++){
      var liveKey = renderKeyOf(liveChildren[i]);
      if(liveKey !== null) keyed[liveKey] = liveChildren[i];
    }
    var cursor = liveParent.firstChild;   // 불변식: cursor 앞 = 배치 끝난 노드, cursor 이후 = 미배치
    var nextNodes = Array.prototype.slice.call(nextParent.childNodes);   // 정적 복사(입양 중 라이브 목록이 흔들리지 않게)
    for(var j = 0; j < nextNodes.length; j++){
      var nextNode = nextNodes[j];
      var nextKey = renderKeyOf(nextNode);
      var match = null;
      if(nextKey !== null){
        if(keyed[nextKey] && keyed[nextKey].tagName === nextNode.tagName){
          match = keyed[nextKey];
          delete keyed[nextKey];
        }
      } else {
        match = findUnkeyedMatch(cursor, nextNode);
      }
      if(match === null){ liveParent.insertBefore(nextNode, cursor); continue; }   // 새 노드(템플릿에서 입양)
      if(match === cursor) cursor = cursor.nextSibling; else liveParent.insertBefore(match, cursor);
      patchNode(match, nextNode);
    }
    while(cursor){   // 짝 없는 옛 노드(키 중복·태그 불일치 포함) 제거
      var toRemove = cursor;
      cursor = cursor.nextSibling;
      liveParent.removeChild(toRemove);
    }
  }

  /** 짝지어진 두 노드 — 텍스트면 nodeValue, 요소면 속성 동기화 후 자식 맞대기.
   * 전제: 렌더 출력에 HTML 주석(Comment 노드)이 없다 — render* 함수들이 주석을 만들지
   * 않으므로 항상 성립한다. Comment 노드는 .attributes 가 없어, 이 전제가 깨진 채
   * isUnkeyedSameShape 가 그것을 요소와 같은 모양으로 오판하고 짝지으면 여기 syncAttributes
   * 호출에서 TypeError 가 난다(검수 2회차, LOW — 지금은 도달 불가라 코드는 바꾸지 않는다). */
  function patchNode(liveNode, nextNode){
    if(liveNode.nodeType === Node.TEXT_NODE){
      // characterData 변이라 childList 만 보는 툴팁 해제 옵저버(PU5)가 반응하지 않는다 —
      // 30초 틱(글자만 바뀜)에 떠 있는 툴팁이 살아남는 근거다(결정 PU4).
      if(liveNode.nodeValue !== nextNode.nodeValue) liveNode.nodeValue = nextNode.nodeValue;
      return;
    }
    syncAttributes(liveNode, nextNode);
    patchChildren(liveNode, nextNode);
  }

  /** 새 결과의 속성을 쓰고 현재에만 있는 속성을 지운다(RECONCILE_PRESERVED_ATTRIBUTES 제외). */
  function syncAttributes(liveElement, nextElement){
    var nextAttrs = nextElement.attributes;
    for(var i = 0; i < nextAttrs.length; i++){
      var attr = nextAttrs[i];
      if(liveElement.getAttribute(attr.name) !== attr.value) liveElement.setAttribute(attr.name, attr.value);
    }
    var liveAttrs = Array.prototype.slice.call(liveElement.attributes);   // 정적 복사(제거 중 라이브 목록이 흔들리지 않게)
    for(var j = 0; j < liveAttrs.length; j++){
      var name = liveAttrs[j].name;
      if(RECONCILE_PRESERVED_ATTRIBUTES.indexOf(name) !== -1) continue;
      if(!nextElement.hasAttribute(name)) liveElement.removeAttribute(name);
    }
  }

  /** 커서부터 뒤로, 키 없고 모양이 같은 첫 형제. 키 있는 노드는 건너뛴다(다른 next 의 몫). 없으면 null. */
  function findUnkeyedMatch(cursor, nextNode){
    for(var node = cursor; node; node = node.nextSibling){
      if(renderKeyOf(node) !== null) continue;
      if(isUnkeyedSameShape(node, nextNode)) return node;
    }
    return null;
  }

  // 순수(노드 읽기만) — nodeType·tagName·class 첫 토큰이 같으면 같은 모양으로 본다. 형제
  // 순서가 안정적인 한(§6 의 비고), 다른 모양의 형제끼리 class 첫 토큰이 우연히 같아도
  // 커서 위치 자체가 짝을 가른다 — syncAttributes 가 최종 속성을 결과로 덮어써 정확성은
  // 지켜진다(정체성만 덜 지켜진다). class 는 .className 이 아니라 getAttribute 로 읽는다 —
  // 드래그 핸들·새로고침 등 인라인 <svg>(결정 PV9)에서는 .className 이 문자열이 아니라
  // SVGAnimatedString 이라 .split 이 없어 던진다(구현 중 실측, DOM 행동 검사가 잡았다).
  // getAttribute 는 HTML·SVG 요소 모두에서 한결같이 문자열(없으면 null)을 준다.
  function isUnkeyedSameShape(liveNode, nextNode){
    if(liveNode.nodeType !== nextNode.nodeType) return false;
    if(liveNode.nodeType !== Node.ELEMENT_NODE) return true;   // 텍스트 노드는 모양이 하나뿐이다
    if(liveNode.tagName !== nextNode.tagName) return false;
    return (liveNode.getAttribute('class') || '').split(' ')[0]
      === (nextNode.getAttribute('class') || '').split(' ')[0];
  }

  // 순수. 요소가 아니거나 키 속성이 없으면 null(그 값 자체가 "키 없음"의 표현이다).
  function renderKeyOf(node){
    return node.nodeType === Node.ELEMENT_NODE ? node.getAttribute(RENDER_KEY_ATTRIBUTE) : null;
  }

  /** #dzh-app 에 들어갈 전체 HTML((빈 상태 또는 카드들) + 경고 블록 — 경고는 두 경우 모두
   * 붙는다). 조기 반환으로 경고를 건너뛰면 "프로젝트 0개 + 경고"(예: 설정 오류로 하나도
   * 못 읽음)에서 그 경고 자체가 사라져 M1 의 「화면 모양 변화 0」을 어긴다(검수 2회차, HIGH). */
  function appContentHtml(){
    var projects = snapshot.projects || [];
    var bodyHtml;
    if(!projects.length){
      bodyHtml = '<div class="empty">아직 프로젝트가 없습니다. 훅을 설치했나요? — /hub install</div>';
    } else {
      var displayOrder = syncProjectOrder(projects.map(function(project){ return project.path; }));
      var projectsByPath = {};
      for(var i = 0; i < projects.length; i++) projectsByPath[projects[i].path] = projects[i];
      bodyHtml = displayOrder.map(function(path){ return renderProject(projectsByPath[path]); }).join('');
    }
    var warningsHtml = '';
    if(snapshot.warnings && snapshot.warnings.length){
      warningsHtml = '<div class="warnings">' + snapshot.warnings.map(escapeHtml).join('<br>') + '</div>';
    }
    return bodyHtml + warningsHtml;
  }

  /** 데이터 블록 파손 시의 안내 블록(문자 그대로 기존 인라인 문자열과 같다). */
  function parseErrorHtml(error){
    return '<div class="empty">데이터를 읽지 못했습니다 ('
      + escapeHtml(String(error.message || error))
      + '). 페이지를 새로고침해 보세요.</div>';
  }

  // [M2] 카드 상세보기(결정 SC1~SC17) — 보일 세션이 있는 카드(세션 줄 밖)를 누르면(결정 MX2)
  // 그 프로젝트의 세션 전체를 세션 카드 가로 한 줄로 보여주는 모달. 상태 3변수(openModalProjectPath 가
  // 열림의 유일한 진실, body 클래스는 그 CSS 투영)·렌더 6함수·가로 앵커(SC9)·1회성 드러내기(SC10)·
  // 넘침 단서(SC11)·열기/닫기(SC13)로 구성된다. 스냅샷을 그리므로 렌더 IIFE 안에 산다(§4).
  var SESSION_MODAL_OPEN_BODY_CLASS = 'dzh-session-modal-open';
  // 렌더 IIFE 의 클릭 리스너가 세션 줄(패널 지름길, 확정 1)과 모달 세션 카드(드러내기만,
  // 패널은 패널 IIFE 가 연다)를 가려내는 셀렉터 — CARD_SELECTOR 와 같은 관례로 상수화한다.
  var SESSION_ROW_SELECTOR = '.session-row';
  var SESSION_CARD_SELECTOR = '.session-card';
  var SESSION_MODAL_TITLE_ID = 'dzh-session-modal-title';   // 다이얼로그의 aria-labelledby 대상
  // 넘침 단서(SC11) — #dzh-session-modal-body 는 자식만 맞대기 대상이라 이 두 클래스는
  // 렌더가 지우지 않는다(정적 컨테이너 자신에 붙기 때문).
  var STRIP_HIDDEN_LEFT_CLASS = 'session-strip-hidden-left';
  var STRIP_HIDDEN_RIGHT_CLASS = 'session-strip-hidden-right';
  var STRIP_EDGE_EPSILON_PX = 1;             // 서브픽셀 반올림으로 끝에 닿았는데도 1px 남는 경우
  var SESSION_MODAL_GONE_TEXT = '이 프로젝트는 최신 목록에 없습니다 — 닫고 다시 선택하세요.';
  var SESSION_STRIP_EMPTY_TEXT = '화면에 보일 세션이 없습니다.';
  var SESSION_COUNT_SUFFIX = '개';           // 루트 머리의 세션 수 배지(SC11)
  var modalEl = document.getElementById('dzh-session-modal');
  var modalBodyEl = document.getElementById('dzh-session-modal-body');
  var modalCloseButton = document.getElementById('dzh-session-modal-close');
  var openModalProjectPath = null;   // 열림 상태의 유일한 진실(결정 SC3). body 클래스는 투영
  var modalOpenerElement = null;     // 닫을 때 포커스를 돌려줄 카드의 .project-name
  var lastModalBodyWidth = -1;       // ResizeObserver 가 폭 변화만 골라내는 기준(SC10-2)

  /** 모달 루트(프로젝트 머리, SC5) — 스크롤 칸 밖에 고정된 누를 수 없는 머리다(결정 MX1): 패널
   * 속성(data-project-path·data-dashboard-key·data-panel-empty-reason·file:// 안내 툴팁)을 어떤
   * 경우에도 달지 않는다. 눌러서 열 곳이 없는 제목이라 버튼이 아니라 span 이다(포커스를 받는데
   * 반응하지 않는 컨트롤은 보조기술에 거짓말이다, N6) — 그 id 는 다이얼로그의 aria-labelledby 대상이라
   * 남는다. 프로젝트의 대시보드를 여는 요소는 세션 줄과 세션 카드뿐이다. 프로젝트 단위 진행률도
   * 그리지 않는다(결정 MX4) — 머리는 이름·배지·세션 수·경로뿐이다. */
  function renderSessionModalRoot(project, visibleSessions){
    var linkedClass = visibleSessions.length ? ' root-linked' : '';   // 안 B(SC12) — 세션이 있을 때만 줄기를 그린다
    return '<div class="session-modal-root' + linkedClass + '">'
      + '<div class="project-head">'
      + '<span id="' + SESSION_MODAL_TITLE_ID + '" class="project-name">'
      + escapeHtml(project.display_name) + '</span>'
      + '<span class="badge tier" data-tooltip="' + escapeHtml(TIER_DESCRIPTION[project.tier] || '') + '">' + escapeHtml(TIER_LABEL[project.tier] || ('티어 ' + project.tier)) + '</span>'
      + renderStateBadge(project.state, null, project.last_activity_at_ms)
      + '<span class="badge tier">세션 ' + visibleSessions.length + SESSION_COUNT_SUFFIX + '</span>'
      + '<span class="last-activity">' + elapsedLabel(project.last_activity_at_ms) + '</span>'
      + '</div>'
      + (project.path ? '<div class="path">' + escapeHtml(project.path) + '</div>' : '')
      + '</div>';
  }

  /** 세션 카드 하나 — 카드 세션 줄과 같은 조각(renderSessionContent)을 같은 순서로 담는다.
   * sessionRowAttributes 가 카드 세션 줄과 글자 그대로 같은 속성을 달아 패널 IIFE 는
   * 무수정이다(결정 SC4). */
  function renderSessionCard(project, session){
    var workingClass = session.state === 'working' ? ' card-working' : '';
    return '<li ' + RENDER_KEY_ATTRIBUTE + '="' + escapeHtml(session.session_id) + '">'
      + '<button type="button" class="session-card' + workingClass + '"' + sessionRowAttributes(project, session) + '>'
      + renderSessionContent(session) + '</button></li>';
  }

  /** 세션 카드 가로 한 줄(SC5) — 비어 있으면 사유 한 줄(SC15). */
  function renderSessionStrip(project, visibleSessions){
    if(!visibleSessions.length) return '<p class="session-strip-empty">' + SESSION_STRIP_EMPTY_TEXT + '</p>';
    return '<div class="session-strip-frame"><ul class="session-strip session-strip-linked">'
      + visibleSessions.map(function(session){ return renderSessionCard(project, session); }).join('')
      + '</ul></div>';
  }

  /** 모달 본문 전체. 프로젝트가 사라졌으면(null) 사유 한 줄(SC15) — 그 문단에
   * SESSION_MODAL_TITLE_ID 를 달아 다이얼로그의 aria-labelledby 대상이 끊기지 않게
   * 한다(검수 1회차 MEDIUM — 그 id 는 평소 renderSessionModalRoot 의 프로젝트명 span 에만
   * 있어, 루트가 없어지는 이 분기에서 다이얼로그의 접근 가능한 이름이 비었었다).
   * visibleSessionsOf 를 반드시 경유한다(T25-160 계약을 모달에 확장, T25-234). */
  function sessionModalBodyHtml(project){
    if(!project) return '<p class="session-strip-empty" id="' + SESSION_MODAL_TITLE_ID + '">' + SESSION_MODAL_GONE_TEXT + '</p>';
    // 변수명은 modalSessions(함수 로컬) — renderProject() 의 동명 지역 변수 visibleSessions 와
    // 글자가 겹치면 T25-234 가 줄 번호 없이는 두 함수 중 어느 쪽이 깨졌는지 구분하지 못한다
    // (구현 단계 개정, 2026-09-24 — tests/mutations.tsv 머리 주석 참고).
    var modalSessions = visibleSessionsOf(project);
    return renderSessionModalRoot(project, modalSessions) + renderSessionStrip(project, modalSessions);
  }

  /** 현재 스냅샷에서 경로가 같은 프로젝트. 없으면 null(SC15). 순수 함수. */
  function findProjectByPath(projectPath){
    var projects = snapshot.projects || [];
    for(var i = 0; i < projects.length; i++) if(projects[i].path === projectPath) return projects[i];
    return null;
  }

  // 가로 앵커(결정 SC9, 실측이 요구한 것) — 브라우저 스크롤 앵커링은 블록 축(세로)만
  // 보정한다(§2.2 실측: 앞에 카드가 끼어들면 보던 카드가 한 칸 밀린다). 칸이 맨 앞
  // (scrollLeft ≤ 1px)이 아니면, 칸 왼쪽 끝에서 처음 보이는 카드의 키와 화면 x 를 잡아
  // 두었다가 맞대기 뒤 같은 x 로 되돌린다.

  /** 기준 카드(칸 왼쪽 끝에서 처음 보이는 카드)의 키·화면 x. 맨 앞이면 null(SC9). */
  function captureStripAnchor(){
    var strip = modalBodyEl.querySelector('.session-strip');
    if(!strip || strip.scrollLeft <= STRIP_EDGE_EPSILON_PX) return null;
    var stripLeft = strip.getBoundingClientRect().left;
    for(var item = strip.firstElementChild; item; item = item.nextElementSibling){
      var rect = item.getBoundingClientRect();
      if(rect.right > stripLeft) return {key: item.getAttribute(RENDER_KEY_ATTRIBUTE), x: rect.left};
    }
    return null;
  }

  /** 기준 카드가 움직인 만큼 scrollLeft 를 따라 옮긴다(자르기는 브라우저 몫). 순수 함수. */
  function anchoredScrollLeft(scrollLeft, anchorXBefore, anchorXAfter){
    return scrollLeft + (anchorXAfter - anchorXBefore);
  }

  /** 같은 키 카드의 새 x 로 scrollLeft 를 되돌린다. 기준이 없으면 아무것도 하지 않는다. */
  function restoreStripAnchor(anchor){
    if(anchor === null) return;
    var strip = modalBodyEl.querySelector('.session-strip');
    if(!strip) return;
    for(var item = strip.firstElementChild; item; item = item.nextElementSibling){
      if(item.getAttribute(RENDER_KEY_ATTRIBUTE) !== anchor.key) continue;

  function renderSessionModal(){
    if(openModalProjectPath === null) return;
    var anchor = captureStripAnchor();
    reconcileChildren(modalBodyEl, sessionModalBodyHtml(findProjectByPath(openModalProjectPath)));
    restoreStripAnchor(anchor);
    updateStripEdgeCues();   // 렌더 뒤 갱신(SC11) — 스크롤 이벤트 발화를 기다리지 않는다
  }

  /** 칸의 어느 쪽에 숨은 카드가 있는가(SC11). 순수 함수 — DOM 에 닿지 않는다. */
  function stripHiddenSides(scrollLeft, clientWidth, scrollWidth){
    return {
      left: scrollLeft > STRIP_EDGE_EPSILON_PX,
      right: scrollLeft + clientWidth < scrollWidth - STRIP_EDGE_EPSILON_PX
    };
  }

  /** 넘침 단서 클래스를 지금 스크롤 상태에 맞춰 다시 켠다(SC11) — 스크롤·렌더·크기 변화 때 부른다. */
  function updateStripEdgeCues(){
    var strip = modalBodyEl.querySelector('.session-strip');
    var sides = strip ? stripHiddenSides(strip.scrollLeft, strip.clientWidth, strip.scrollWidth) : {left: false, right: false};
    modalBodyEl.classList.toggle(STRIP_HIDDEN_LEFT_CLASS, sides.left);
    modalBodyEl.classList.toggle(STRIP_HIDDEN_RIGHT_CLASS, sides.right);
  }

  function stripScrollLeftToReveal(scrollLeft, clientWidth, itemLeft, itemWidth){
    if(itemLeft < scrollLeft) return itemLeft;
    if(itemLeft + itemWidth > scrollLeft + clientWidth) return itemLeft + itemWidth - clientWidth;
    return scrollLeft;
  }

  /** item 이 칸 안에 온전히 보이도록 스크롤한다(패딩만큼 보정). SC10-1·SC10-3 이 부른다. */
  function revealStripItem(item){
    var strip = item.parentNode;
    var padding = parseFloat(getComputedStyle(strip).paddingLeft) || 0;

  /** 패널에 열려 있는 세션이 이 모달에도 있으면 그 카드를 드러낸다(SC10-1·SC10-2). */

    if(openCard) revealStripItem(openCard.parentNode);
  }

  /** 카드 상세보기를 연다 — 목록을 inert 로 잠그고 본문을 그린 뒤 열림 1회 드러내기(SC10-1). */
  function openSessionModal(projectPath, openerElement){
    openModalProjectPath = projectPath;
    modalOpenerElement = openerElement;
    document.body.classList.add(SESSION_MODAL_OPEN_BODY_CLASS);
    app.inert = true;   // 목록만 잠근다(SC2) — 헤더·사용량·패널은 계속 쓸 수 있다
    render();           // 본문을 그리고 렌더 완료 이벤트로 패널 선택 표시까지 같은 동기 구간에 받는다
    revealOpenSessionCard();
    updateStripEdgeCues();

  function closeSessionModal(){
    if(openModalProjectPath === null) return;
    openModalProjectPath = null;
    document.body.classList.remove(SESSION_MODAL_OPEN_BODY_CLASS);
    app.inert = false;
    modalBodyEl.replaceChildren();   // 다음 열기는 가로 스크롤 0 에서 새로 그린다(SC13)
    updateStripEdgeCues();

  function render(){
    if(isReordering) return;    // 드래그 중에는 다시 그리지 않는다(결정 O6, 불변식 H1″)
    if(initialParseError){ reconcileChildren(app, parseErrorHtml(initialParseError)); return; }   // 조기 반환 불변(결정 PU6)
    reconcileChildren(app, appContentHtml());   // ← T25-107·T25-229 의 새 앵커

  usageToggleButton.addEventListener('click', function(){

    persistUsageCollapsed(isUsageCollapsed);
    applyUsageCollapsedState();

  // `if(!isServed){ … return; }` 앞에 등록돼야 한다 — 뒤로 가면 file:// 모드에서 기능이
  // 통째로 사라진다(GOTCHA 2).
  document.addEventListener('click', function(event){
    if(isUsageCollapsed) return;                       // 이미 접혀 있으면 할 일이 없다
    if(usageEl.hidden) return;                         // 패널이 없는 화면에서 접힘을 저장하지 않는다(결정 Q3)
    if(event.target.closest('#dzh-usage')) return;     // 패널 안(토글 버튼 포함)은 토글 리스너 소관(GOTCHA 1)
    if(event.target.closest('#dzh-detail-panel')) return;   // 상세 패널 클릭은 페이지 클릭이 아니다(결정 Q4 승계)
    isUsageCollapsed = true;
    persistUsageCollapsed(isUsageCollapsed);
    applyUsageCollapsedState();
  });

  // dragstart(핸들에서 시작, 카드 전체를 고스트로 삼는다) →

    var handle = event.target.closest(DRAG_HANDLE_SELECTOR);

    var draggedCard = app.querySelector('.card-dragging');
    if(!draggedCard || targetCard === draggedCard) return;

    // 넣는다 — 인덱스 산술로 순서를 옮기던 옛 방식과 결과가 정확히 같다(결정 DG4).
    // 좌표(중심점) 비교는 쓰지 않는다 — 3열 그리드에서는 좌우·상하가 섞여 새 임계값이 생긴다.
    // 카드 높이가 균일(340px)하므로 이동 직후 포인터 아래 슬롯에는 드래그 중인 카드 자신이

                             & Node.DOCUMENT_POSITION_FOLLOWING);

    if(!event.target.closest(CARD_SELECTOR)) return;
    event.preventDefault();
    commitReorder(currentCardOrder());            // DOM 이 곧 최종 순서다(결정 DG4·DG5)
  });
  document.addEventListener('dragend', function(){
    draggedProjectPath = null;
    isReordering = false;
    render();     // 드래그 중 억눌렸던 재렌더를 여기서 한 번 따라잡는다(취소 시 라이브 이동도 되돌린다)
  });

  // 카드 확장 토글(결정 U1~U7)은 결정 TR1(이슈 1, docs/prps/hub-ui-4-issues.md §2)이
  // 번복해 삭제됐다 — 트리가 상시 표시가 되며 이 리스너가 뒤집을 상태 자체가 없다.

  // [M2] 카드 상세보기 리스너(결정 SC4) — 반드시 아래 `if(!isServed){ … return; }` 앞에
  // 등록돼야 한다(T25-235, 위 사용량·드래그 리스너와 같은 GOTCHA — 뒤로 가면 file:// 에서
  // 모달이 통째로 죽는다). 패널 IIFE 의 별도 document 클릭 리스너와 대상이 서로소라 등록
  // 순서와 무관하다(SC4).
  document.addEventListener('click', function(event){
    if(event.target.closest(DRAG_HANDLE_SELECTOR)) return;                  // 결정 N6
    if((window.getSelection() || {}).toString()) return;                   // 결정 N6
    if(event.target.closest(SESSION_ROW_SELECTOR)) return;                 // 세션 줄 = 패널 지름길(확정 1)
    var sessionCard = event.target.closest(SESSION_CARD_SELECTOR);
    if(sessionCard && modalBodyEl.contains(sessionCard)){ revealStripItem(sessionCard.parentNode); return; }   // 패널은 패널 IIFE 가 연다(SC10-3)
    // 보일 세션이 있는 카드만 모달을 연다(결정 MX2) — 표지가 없는 카드(보일 세션 0)는 눌러도
    // 아무 일도 없다. 빈 모달은 사유 한 줄뿐이라 열 값어치가 없다. 드래그·순서 저장은 이 셀렉터가
    // 아니라 CARD_SELECTOR 를 쓰므로 표지 없는 카드도 그대로 끌어 옮길 수 있다.
    var card = event.target.closest(SESSION_MODAL_CARD_SELECTOR);
    if(card && app.contains(card)){
      openSessionModal(card.getAttribute('data-project-path'), card.querySelector('.project-name'));
      return;
    }
    if(openModalProjectPath !== null && event.target === modalEl) closeSessionModal();   // 스크림(SC13)
  });
  modalCloseButton.addEventListener('click', closeSessionModal);

  // defaultPrevented 라 여기서 건너뛴다. 렌더 IIFE 는 패널의 변수·클래스를 읽지 않는다 —
  // 이 표준 신호 하나만 본다.
  window.addEventListener('keydown', function(event){
    if(event.key !== 'Escape' || event.defaultPrevented) return;
    closeSessionModal();
  });

  // (툴팁 IIFE 의 974행과 같은 방식).
  document.addEventListener('scroll', function(event){
    if(event.target.classList && event.target.classList.contains('session-strip')) updateStripEdgeCues();
  }, {capture: true, passive: true});
  // 패널이 밀어내며 칸이 좁아지면(또는 창 크기가 바뀌면) 방금 고른 카드가 오른쪽으로 밀려날
  // 수 있다 — 폭이 바뀐 경우에만 드러낸다(SC10-2). 높이 변화(내용 갱신)는 무시한다 —

  // 설계 중 시제품에서 발견해 고쳤다). render() 는 revealOpenSessionCard 를 부르지 않는다
  // (T25-238 역가드).

    if(width !== lastModalBodyWidth){ lastModalBodyWidth = width; revealOpenSessionCard(); }

    document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') reloadOnce(); });
    window.addEventListener('focus', reloadOnce);

  // 동일)으로 안전하게 흡수한다(저장소 접근을 감싸는 이 파일의 관례, readStoredProjectOrder
  // 참조).
  function readReloadedTemplateStamp(){
    try{
      return sessionStorage.getItem(TEMPLATE_STAMP_RELOAD_KEY) || '';
    }catch(e){
      return '';
    }
  }
  // 자가 치유 2 — 리로드 대상을 기록한다. 기록에 성공했을 때만 true 를 돌려준다 — 그것이
  // 리로드의 전제조건이다(결정 SH9). 성공해도 지우지 않는다 — 정상적으로 이 스탬프에

  }

  var busy = false;

      .then(function(res){ if(!res.ok) throw new Error(res.status); return res.text(); })

  // hub-panel-immediate-refresh.md 결정 IR2) — 폴링에 더해 열린 상세 패널의 iframe 도
  // 갱신하라는 신호를 함께 보낸다. 60초 인터벌은 이 래퍼를 쓰지 않는다(아래 setInterval 은
  // 여전히 poll 그대로) — iframe 은 이미 자기 60초 폴링을 하므로 인터벌까지 신호를 태우면

    panelEl.classList.toggle(PANEL_EMPTY_CLASS, target.dashboardKey === null);
    // 대시보드가 없으면 about:blank 를 즉시 싣는다 — 지연하면(SP14) 옛 프로젝트의 대시보드가
    // 사유 문구 뒤에 남아 있는 프레임이 되어 R2 가 고치려는 오해를 그대로 재현한다(결정 OC3).
    if(!isSameDocument){
      loadPanelDocument(target.dashboardKey === null
        ? BLANK_DOCUMENT_URL : projectDashboardUrl(target.dashboardKey));
    }
    document.body.classList.add(PANEL_OPEN_BODY_CLASS);
    applyBackgroundInert();
    applyOpenCardMarking();
    if(!wasClosed) return;                  // 내용 교체일 뿐이면 포커스를 건드리지 않는다
    panelOpenerElement = target.openerElement;
    panelCloseButton.focus();
  }

  // 패널을 닫고 iframe 을 비운다 — 숨은 iframe 의 5초 폴링을 반드시 멈춘다(리스크 R-6).
  // visibility:hidden 도 display:none 도 iframe 의 타이머를 멈추지 않는다. 제목은 여기서
  // 지우지 않는다 — 지우면 나가는 180ms 동안 머리가 빈 패널이 보인다(GOTCHA 16).
  function closeDetailPanel(){
    if(openPanelTarget === null) return;   // 여기서 반환되므로 대기 타이머는 존재할 수 없다(OC3)
    openPanelTarget = null;
    document.body.classList.remove(PANEL_OPEN_BODY_CLASS);
    applyBackgroundInert();                 // 포커스 복귀보다 먼저 — inert 안의 요소는 포커스를 못 받는다
    // 표시는 즉시 지운다. 슬라이드아웃 180ms 를 기다리면 "닫혔는데 아직 열린 것으로 표시된"
    // 구간이 생기고, 백그라운드 탭에서 setTimeout 이 스로틀되면 그 거짓이 길어진다.
    applyOpenCardMarking();
    scheduleBlankAfterSlide();
    if(panelOpenerElement && panelOpenerElement.isConnected) panelOpenerElement.focus();
    panelOpenerElement = null;
  }

  // 로드 완료 표시(흰 플래시 방지, CSS 참고) — 1회 등록으로 문서가 바뀔 때마다 계속 듣는다.
  // about:blank 로드(닫기·빈 상태)에도 발화하지만 무해하다: 빈 상태는 .detail-empty 가
  // iframe 자체를 display:none 으로 내리고, 닫힌 패널은 부모 .detail-panel 이
  // visibility:hidden 이라 어느 쪽도 화면에 흰 프레임을 남기지 않는다.
  panelFrameEl.addEventListener('load', function(){
    panelFrameEl.classList.add(PANEL_FRAME_LOADED_CLASS);
  });

  panelCloseButton.addEventListener('click', closeDetailPanel);
  // 비모달 패널이라 브라우저가 ESC 를 대신 처리해 주지 않는다(SP1). iframe 안에 포커스가
  // 있으면 keydown 이 그 문서로 가 여기 오지 않는다 — 그래서 닫기 버튼이 1차 수단이다.
  // 패널이 열려 있을 때만 반응하고, 실제로 닫았을 때만 preventDefault 한다(SC8) — 이 ESC 는
  // 패널이 썼다는 표준 "처리됨" 신호이며, 카드 상세보기(렌더 IIFE, window 버블 단계)는
  // 다음 ESC 까지 기다린다. 렌더 IIFE 는 이 함수의 존재도, openPanelTarget 도 모른다 —
  // defaultPrevented 라는 DOM 표준 신호 하나로만 순서가 정해진다.
  document.addEventListener('keydown', function(event){
    if(event.key !== 'Escape' || openPanelTarget === null) return;
    closeDetailPanel();
    event.preventDefault();          // 이 ESC 는 패널이 썼다 — 다음 소비자는 건너뛴다
  });
  // 열어 둔 채 창 크기를 바꾸면 모드가 바뀐다 — inert·aria-modal 을 다시 계산한다.
  pushModeQuery.addEventListener('change', applyBackgroundInert);

  document.addEventListener('click', function(event){
    if(event.target.closest('.card-drag-handle')) return;         // 결정 N6 — 드래그 핸들은 별도 조작
    // 확장 셰브론 조기 반환(신설, 결정 U5)은 결정 TR1(이슈 1, docs/prps/hub-ui-4-issues.md
    // §2)이 번복해 삭제됐다 — 버튼 자체가 없으므로 가드할 대상이 없다.
    if((window.getSelection() || {}).toString()) return;          // 결정 N6 — 텍스트 선택 후 클릭 무시
    var card = event.target.closest(CLICKABLE_CARD_SELECTOR);
    if(!card) return;
    openDetailPanel(readCardTarget(card));
  });
  // 폴링·틱·dragend 뒤 맞대기(결정 PU1)가 class 를 렌더 결과로 되돌리면 표시도 지워진다 —
  // 같은 동기 구간에서 복원한다(결정 PU3). 이벤트는 값을 싣지 않으므로 여기서 읽는 것은
  // 카드 DOM 뿐이다(결정 OC8).
  document.addEventListener(RENDERED_EVENT_NAME, applyOpenCardMarking);

  // 즉시 갱신 3종이 열린 패널의 대시보드에도 닿게 한다(docs/prps/
  // hub-panel-immediate-refresh.md 결정 IR1). 렌더 IIFE 는 여전히 누가 듣는지 모르고, 이
  // IIFE 는 여전히 스냅샷을 모른다 — 이벤트 하나로만 연결한다.
  function refreshOpenPanelDocument(isExplicitRequest){
    if(openPanelTarget === null) return;                 // 닫혀 있다(대기 타이머 중이면 여기서 끝난다, OC3)
    if(openPanelTarget.dashboardKey === null) return;     // 빈 상태 — iframe 은 about:blank 다
    // 로딩 중(결정 IR6)이면 아무것도 하지 않는다 — 그 문서엔 훅이 아직 없어(스크립트 미실행)
    // 이 가드가 없으면 최신 대시보드조차 "옛 세대"로 오판돼 폴백 재로딩을 타고, 포커스를
    // 연타하면 재로딩이 꼬리를 문다.
    if(!panelFrameEl.classList.contains(PANEL_FRAME_LOADED_CLASS)) return;
    var frameWindow = panelFrameEl.contentWindow;
    // 크로스 오리진 예외는 불가능하고(전제 4) contentWindow 가 null 일 수도 없다 — 훅 부재는
    // 예외가 아니라 정상 경로(옛 세대에서는 그냥 undefined)이므로 방어 코드를 더 두지 않는다
    // (결정 IR7).
    if(typeof frameWindow[DASHBOARD_REFRESH_HOOK_NAME] === 'function'){
      frameWindow[DASHBOARD_REFRESH_HOOK_NAME]();   // 메서드 호출 형태 — this 가 iframe window 로 확정된다
      return;
    }
    // 훅 없는 옛 세대는 명시적 요청(새로고침 버튼)에서만 재로딩한다(결정 IR5) — 포커스·탭
    // 복귀까지 재로딩하면 옛 세대 사용자는 탭을 전환할 때마다 읽던 위치를 잃는다(순수 회귀).
    if(isExplicitRequest) loadPanelDocument(projectDashboardUrl(openPanelTarget.dashboardKey));
  }
  document.addEventListener(IMMEDIATE_REFRESH_EVENT_NAME, function(event){
    refreshOpenPanelDocument(event.detail.isExplicitRequest);
  });
})();
</script>
</body>
</html>
