  transition 을 걸지 않는다 — 지워졌다 되붙는 사이에 강제 레이아웃이 끼면 그 사이 값으로

  아이콘은 lucide(ISC, https://lucide.dev)의 path 좌표를 그대로 옮겨 적은 정적 인라인
  SVG 다 — CDN·런타임 라이브러리를 쓰지 않는다(file:// 로도 열려야 하기 때문, 결정 PV9).
  viewBox·stroke 속성 관용구는 새로고침 버튼(refresh-cw)이 세운 선례를 그대로 따른다.

  #dzh-usage 와 그 안의 #dzh-usage-toggle 은 정적 노드이며 class·aria-expanded 속성만
  갱신한다(노드 교체 금지). 접힘을 바꾸는 경로는 둘이다 — 제목 줄 클릭과 패널 바깥 클릭 —
  이며 둘 다 같은 함수(applyUsageCollapsedState)와 같은 저장 키를 쓴다. 패널 안에는 원칙적으로

  이고(R-B, 결정 EX7), 그래서 tooltipDismissObserver 의 #dzh-usage-body 관찰이 그 트리거를

  DOM 이 그대로 유지된다. rate_limit_resets(있으면)는 펼침 본문에 초기화 예정 시각 줄로
  더해진다(docs/prps/hub-usage-reset-time-and-refresh.md). usage·rate_limit_resets 의 값은

  `~/.claude.json` 에서 온다(docs/prps/hub-usage-panel-account.md 결정 AC1·AC2).
  #dzh-tooltip 은 전역 커스텀 툴팁의 정적 싱글턴이다(위 네 요소 바깥, docs/prps/

  내용을 바꾼다. 트리거는 data-tooltip="…" 속성을 가진 임의의 요소이며, 리스너는 재렌더로
  죽지 않도록 document 에 위임한다.
  프로젝트 상세 패널(#dzh-detail-panel, docs/prps/hub-detail-side-panel.md 결정 SP1)은
  비모달 <aside> 정적 싱글턴이다. 세션 줄·모달 세션 카드 클릭이 iframe 문서와 제목만 바꾸고

  닫힘에서 iframe 을 about:blank 로 보내 숨은 폴링을 멈춘다. 열림 상태의 유일한 진실은 패널
  IIFE 의 openPanelTarget(PanelTarget | null)이며, 신원은 data-project-path 와 세션 식별
  속성의 쌍이다(대시보드 없는 세션은 dashboard_key 가 null 이라 그 값만으로는 신원이 될 수
  없다 — OC1 개정, 결정 ST23). body.dzh-panel-open 은 openPanelTarget !== null 의 CSS
  투영이다. 대시보드가 없는 세션은 iframe 을 내리고 사유를 보인다 — 사유의 유일한 출처는 그
  세션 줄·세션 카드의 data-panel-empty-reason 이다(결정 OC4·OC7, sessionPanelEmptyReason).

  카드 상세보기(#dzh-session-modal, docs/prps/hub-session-modal-and-partial-update.md 결정
  SC1~SC17)는 .head-row 안의 정적 싱글턴이다 — 헤더 아래 가장자리에 붙고 폭은 목록을 따라
  밀어내기 모드에서 CSS 만으로 패널 왼쪽에 선다. 카드는 보일 세션이 있을 때만 이 모달을 연다(결정
  MX2 — 카드에 붙는 표지 속성 data-opens-session-modal 이 그 조건이다. 보일 세션이 없는 카드는
  눌러도 아무 일이 없고, 순서 끌어 옮기기는 모든 카드가 그대로 한다). 열림 상태의 유일한 진실은 렌더
  IIFE 의 openModalProjectPath 이고 body.dzh-session-modal-open 은 그 CSS 투영이다. 본문
  (#dzh-session-modal-body)의 자식만 렌더가 맞대기로 그린다. 모달 머리(루트)는 누를 수 없는
  머리다 — 패널 속성을 어떤 경우에도 달지 않는다(결정 MX1). 창 높이는 내용 높이이고 헤더 아래에서
  화면 아래까지 영역의 윗변에서 영역 높이의 12.5% 아래에 윗변이 걸리며(사용량 패널 상태와 무관, 길면 그 오프셋이 줄어 창이 영역 안에 든다 — 결정 LM8 — MX7 개정), 세션 카드는 메인 화면의
  카드와 비슷한 폭이고(2·3개가 칸에 딱 들어가는 폭 — 결정 MX8 개정), 내용이 영역을 넘으면 창만 세로로 스크롤한다. 머리와 세션 카드를 잇는 연결선의 기하와 칸의 번짐은
  #dzh-session-modal-body 에 선언한 사용자 정의 속성 다섯(--session-strip-bleed · --session-strip-gap ·
  --session-link-x · --session-link-stem · --session-link-drop)에서만 파생된다(결정 MX6 — 줄기와 드롭이 각자

     없는 인라인 SVG 컨테이너라 이 규칙이 지울 것이 애초에 없다(결정 IL5).

     calc(-1 * var(--dzh-wrap-gutter)) 8px 로 배경을 거터까지 흘리고, padding:32px
     var(--dzh-wrap-gutter) 10px 로 콘텐츠를 그만큼 다시 들여 h1·버튼 클러스터의 화면 위치를
     그대로 지킨다 — margin(−G) + padding(+G) = 0 이 그 항등식이다(G=--dzh-wrap-gutter).
     margin-top 은 반드시 0 이어야 한다(D15 재확인) — .wrap 은 위쪽에 border·padding 이 없어
     첫 자식의 top margin 이 마진 상쇄로 .wrap 밖까지 빠져나가고, 그러면 스크롤 초반 헤더가
     다시 따라 올라가는 결함이 되살아난다. 한계(의도적으로 고치지 않음) — 뷰포트가 1440px 를
     넘으면 .wrap 이 가운데 정렬돼 배경도 .wrap 의 테두리 상자(1440px)까지만 덮고, 카드
     그림자의 바깥 꼬리(카드 모서리에서 16~24px 구간, 알파 ≤.041, σ=12 가우시안 근사)가
     .wrap 밖 8px 에 남는다 — --bg 위에서 ΔL* 약 0.35 로 이 저장소의 식별 한계(약 2)를 크게
     밑돌아 방치한다. 헤더를 뷰포트 전폭으로 흘리면 완전히 없어지지만 넓은 화면에서 헤더
     띠가 콘텐츠보다 넓어져 디자인이 바뀌므로 기각했다(docs/prps/dashboard-hub-signal-tuning.md
     후속 결함 절). */
  .head-row{display:flex;align-items:center;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:10;background:var(--bg);padding:32px var(--dzh-wrap-gutter) 10px;margin:0 calc(-1 * var(--dzh-wrap-gutter)) 8px}
  h1{font-size:20px;margin:0;color:var(--head);letter-spacing:-.4px}
  /* 340px 는 헤더 블록(project-head+path) + 세션 약 3개가 스크롤 없이 들어가도록 고른
     값이다 — 넘치는 세션은 .sessions 만 내부 스크롤된다. 카드 높이를 프로젝트마다 다르게
     만들지 않기 위한 고정값이라 근거 없이 바꾸지 마라. */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 20px;box-shadow:var(--shadow);height:340px;display:flex;flex-direction:column;overflow:hidden;position:relative}
  /* 카드 = 모달을 여는 조건(data-opens-session-modal, 결정 MX2) — 보일 세션이 있는 카드만 이 표지를
     단다. 커서·hover 는 그 표지만 본다: 보이는 모습(커서)과 클릭 거동이 같은 렌더 결과 한 곳에서 나와야
     어긋나지 않는다. 보일 세션이 없는 카드는 눌러도 아무 일이 없으므로 손가락 커서도 hover 테두리도
     없다(드래그 핸들의 grab 커서는 그대로다). data-project-path 는 모든 카드가 갖지만 그것은 드래그·순서
     저장의 조건이지 모달의 조건이 아니다(CARD_SELECTOR). 예전엔 이 자리가 대시보드 속성에 걸렸고(결정
     OC5), 그다음엔 모든 카드에 걸렸다(결정 SC4). */
  .card[data-opens-session-modal]{cursor:pointer}
  .card[data-opens-session-modal]:hover{border-color:var(--accent)}
  /* 지금 상세 패널에 열려 있는 카드(결정 OC9). 면색이 판별 채널이고, 테두리는 그 면색이
     혼자 감당하지 못하는 몫을 메운다. 왜 면색 혼자로는 안 됐는가(라이트 테마 실측):
     옛 --accent-soft(#E4F0F8)와 페이지 배경 --bg(#EEF3F8)의 대비는 1.038:1, ΔL* 1.47 로
     넓은 면적의 식별 한계(ΔL* 약 2) 아래였다(파랑 팔레트 시절) — 열린 카드가 그리드에 뚫린
     구멍처럼 보였다.
     면색을 더 어둡게 하는 데는 천장이 있다: 카드 안에는 --muted 본문(.path·
     .session-time)이 있어 그 대비가 4.5:1(WCAG AA) 아래로 내려갈 수 없다. 금빛 팔레트의
     값은 #FCE596(muted 5.26:1, ΔL* 4.01)이다 — 천장(4.5:1)까지 여유가 있지만 면 무게를
     파랑 팔레트(ΔL* 3.96)와 같은 급으로 맞췄다(결정 LT3).
     ΔL* 4.01 은 식별 한계는 넘지만 "카드가 페이지 위에 떠 있다"는 인상까지는 못 되살린다 —
     그래서 --accent 테두리를 함께 준다(배경 대비 3.62:1, 면색 대비 3.27:1 로 비텍스트
     3:1 을 넘는다). 초판이 테두리를 피한 이유(hover·card-working 이 이미 쓴다)는
     충돌이 아니라 중복이었다 — 세 상태가 같은 --accent 테두리를 공유하므로 소스 순서상
     뒤에 오는 .card.card-working 이 이 선언을 덮어도 결과 색이 같다. 열림의 판별은 여전히
     면색 단독이고, 보조기술 채널은 JS 가 붙이는 aria-current="true" 다(결정 D4).
     다크 테마는 손대지 않는다 — #12324A 대 #0E1621 은 ΔL* 12.6 으로 처음부터 넉넉했다. */
  .card.card-open{background:var(--accent-soft);border-color:var(--accent)}
  /* 지금 작업중인 카드를 훑어 찾기 쉽게 하는 스캔 보조 신호(R3) — 배지의 텍스트+글리프+색
     3채널에 얹는 중복 신호라 새 접근성 부채가 아니다(결정 D4). 원설계는 카드 box-shadow 를
     매 프레임 보간했다(Risk 8 — 상시 리페인트) — 대신 카드에는 정적 그림자만 두고(바깥
     옅은 bloom + reduced-motion 폴백) 안쪽에 .card-working::after 오버레이를 얹어 그
     opacity 만 pulse 한다(컴포지터 친화. ::after 는 .card{position:relative} 를 기준으로
     잡고, .card 자식 중 position:absolute 는 .sr-only 뿐이라 겹치지 않는다).
     하드 링(inset 0 0 0 2px, card-open 조합 3px)은 dashboard-ui-polish-4 PRP 사용자 확인
     (2026-09-08 — "테두리가 너무 두껍다")에 따라 확산 inset bloom(14px -6px, card-open
     조합 20px -4px)으로 바꿨다. 하드 링 역할은 이미 있는 .card.card-working{border-color:
     var(--accent)} 단독이 맡는다(같은 색 링 2겹 → 1겹, 시각적 총 두께 3px → 1px). card-open
     조합의 판별은 두께 차(2px→3px, 눈으로 못 쟀다) 대신 bloom 을 더 깊고 넓게 — card-open
     단독은 정적이고 card-open+card-working 은 숨쉰다, 모션 유무가 실질 판별자다. 진폭
     .6→1 은 대시보드 진행중 단계 칩의 halo(ol.steps li.active .chip::after)와 공유하는
     모션 언어다(결정 D5). 주기는 더 이상 공유하지 않는다 — 허브는 2s, 대시보드는 4s
     (dz-step-active-pulse, 변경 없음)로 갈린다(결정 GW3, docs/prps/
     hub-session-list-and-glow-fixes.md, 2026-09-17 사용자 요청). @keyframes 이름
     (card-working-glow)은 유지한다(회귀 검사 T25-65).
     바깥 bloom 을 18px -4px → 8px -2px 로 좁힌 이유(docs/prps/dashboard-hub-signal-tuning.md
     결정 D8) — 실측(Blink, 라이트 테마) 결과 18px -4px 의 확산은 #dzh-app 의 gap:12px 안에서
     감쇠가 끝나기는커녕 명세 보수 상한(1.5×blur+spread)이 23px 로 gap 을 넘었다. 그 결과
     그림자가 그라데이션 도중에 이웃 카드의 불투명 --surface 면에 그대로 덮여 "뚝 끊긴"
     것처럼 보였다 — 원인은 overflow 클리핑이 아니라 페인트 순서다(카드는 전부
     position:relative 에 z-index 가 없어 문서 순서대로 겹쳐 그려진다). z-index 로 순서를
     올려 해결하지 않는다 — 그러면 bloom 이 옆 카드 위로 번져 인접 두 카드가 동시에
     working 일 때 서로 침범한다(결정 D9). 8px -2px 는 같은 상한 산식이 10 ≤ 12 를 만족해
     어느 렌더링 엔진에서도 gap 안에서 끝난다고 보증한다(Blink 실측은 더 타이트한 6px).
     #dzh-app 의 gap:12px 와 3열 산술은 건드리지 않는다(결정 D10). 안쪽 ::after inset
     bloom(지금 값 14px -1px, card-open 조합 20px -1px — 결정 GW1·GW2)과 위 하드 링·모션
     언어 서술은 간격과 무관해 그대로 둔다(결정 D11). */
  .card.card-working{border-color:var(--accent);box-shadow:var(--shadow),0 0 8px -2px var(--accent)}
  .card.card-working::after{content:"";position:absolute;inset:0;border-radius:inherit;
    pointer-events:none;box-shadow:inset 0 0 14px -1px var(--accent);
    animation:card-working-glow 2s ease-in-out infinite}
  @keyframes card-working-glow{0%,100%{opacity:.6}50%{opacity:1}}
  .card.card-open.card-working::after{box-shadow:inset 0 0 20px -1px var(--accent)}
  /* 무효화는 끄는 규칙보다 소스 순서상 뒤에 온다(위 관례). 모션만 끄고 정적 bloom·테두리는
     남긴다. 애니메이션은 ::after 에만 있으므로 그것만 끈다 — .card.card-working{ 셀렉터
     토큰은 위 규칙이 이미 만족시키므로 회귀 검사 T25-65 를 위해 여기에 둘 필요가 없다. */
  @media (prefers-reduced-motion:reduce){.card.card-working::after{animation:none;opacity:1}}
  /* 드래그 중인 원본 카드(R7, 결정 DG6) — 고스트(반투명 복제)와 구분되도록 낮춘다. 놓일 자리가
     곧 이 카드의 현재 위치다(dragover 의 라이브 이동). dragend 재렌더(맞대기)가 class 를
     렌더 결과로 되돌려 청소한다 — 클래스 제거 코드가 따로 필요 없다(결정 PU3). opacity 는
     컴포지터 친화 속성이라 pulse(card-working)와 겹쳐도 추가 리페인트 부담이 없다. */
  .card.card-dragging{opacity:.55}
  /* 카드 확장(결정 U1~U4·U7, docs/prps/hub-unified-card-tree-ui.md)은 삭제됐다(결정
     TR1·TR4, docs/prps/hub-ui-4-issues.md §2) — 트리·세션별 진행률이 상시가 되며 토글이
     보여줄 것이 남지 않았다. 카드 높이는 항상 340px 고정이고(TR4), 넘치는 세션은 406행
     .sessions{overflow-y:auto} 가 상시 흡수한다. */
  .project-head{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
  /* 드래그 핸들(R2) — 카드 전체 클릭(R3)과 조작 영역이 겹치지 않도록 전용 요소로 둔다
     (결정 DG3 — 드래그 전용이라 button 이 아니라 aria-hidden 인 span 이다). 22px 는 인접
     배지들보다 살짝 작게 잡아 "잡는 곳"이라는 보조적 위계를 준다. */
  .card-drag-handle{width:22px;height:22px;flex:0 0 auto;padding:0;color:var(--muted);
                     background:transparent;border:1px solid var(--line);border-radius:6px;
                     cursor:grab;display:inline-flex;align-items:center;justify-content:center}
  .card-drag-handle:hover{color:var(--accent-ink);border-color:var(--accent)}
  .card-drag-handle svg{width:14px;height:14px}
  /* font:inherit 를 먼저 두고 font-size·font-weight 를 뒤에 다시 적어, <button> 기본 폰트만
     리셋하고 크기·굵기는 명시값을 쓰게 한다(순서 의존 — .usage-toggle 과 같은 관례). 모달을 여는
     카드의 제목은 <button> 이라 이 리셋이 필요하다(결정 OC11). 보일 세션이 없어 모달을 열지 않는
     카드의 제목은 <span> 이라 닿을 것이 없고 무해하다(결정 MX2) — 아래 커서·hover·포커스 링은
     button.project-name 스코프에만 있어 span 에는 붙지 않는다. */
  .project-name{font:inherit;font-size:15px;font-weight:800;color:var(--head);overflow:hidden;
                text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto;
                border:0;background:none;padding:0;text-align:left}
  button.project-name{cursor:pointer}
  button.project-name:hover{color:var(--accent-ink)}
  button.project-name:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  /* inline-block 이던 시절엔 line-height 가 body(1.5)를 물려받아 패딩 위아래가 비대칭으로
     보였다(글리프·텍스트가 위로 치우침) — inline-flex+align-items:center 로 박스 기준
     중앙정렷하고 line-height:1 로 그 여백 자체를 없앤다. */
  .badge{display:inline-flex;align-items:center;line-height:1;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px}
  .badge .glyph{margin-right:3px}
  .project-head .badge{flex:0 0 auto}
  .badge.tier{background:var(--soft);color:var(--muted)}
  /* 상태 배지: box-shadow 왼쪽 바 대신 배경/테두리 형태로 상태를 구분한다(색맹 안전 색상+글리프는
     renderStateBadge 가 담당, 검수 M6). working 은 지금 진행 중이라 가장 눈에 띄어야 해서 채움
     배지로, stale 은 경고성이라 점선 테두리로, idle·done 은 평상시라 플랫/윤곽선으로 낮춘다.
     배경은 --accent-fill(라이트는 밝은 금 그라데이션, 다크는 --accent-ink 의 별칭), 글자는
     --on-accent-fill(라이트는 짙은 금갈색, 다크는 --bg 의 별칭)이다. 밝은 금은 밝은 글자와
     대비가 안 나와(가장 진한 정지점 #E3A600 대 --bg 1.92:1) 글자를 짙게 뒤집는다 — 정지점
     최저 6.41:1. 광택은 배경 그라데이션만으로 낸다. box-shadow·animation 은 T25-190(결정 V1)이
     금지한다(결정 LT11·LT13). */
  .badge.state-working{background:var(--accent-fill);color:var(--on-accent-fill)}
  .badge.state-idle{background:var(--soft);color:var(--muted)}
  .badge.state-stale{background:var(--attention-soft);color:var(--attention);border:1px dashed var(--attention)}
  /* interrupted(결정 RI10, docs/prps/hub-rate-limit-interruption.md) — 채움 = "지금의
     상태"(working 과 같은 문법). stale(점선 테두리)과는 형태로 갈린다. 색은 --attention 을
     반전해 배경으로 쓴다 — --surface 글자와의 대비 라이트 8.36:1·다크 7.3:1(계산, WCAG AA
     4.5:1 이상). --bg 글자는 파랑 팔레트 시절 4.50:1 로 AA 경계였다 — 지금은 7.54:1 이지만
     규칙은 그대로 --surface 를 쓴다. 광택 없는 평면 채움이다(결정 LT11) — 평상·진행의 광택과
     형태로 갈린다. 새 색 토큰 0, 애니메이션 0(T25-190 의 정신 — halo 는 working 전용). */
  .badge.state-interrupted{background:var(--attention);color:var(--surface)}
  /* background(결정 BW5·BW10, docs/prps/hub-subagent-background-pause.md) — 「할 일은
     없지만 일이 진행 중이다」를 idle(플랫)과 working(채움) 사이의 중간 형태로 표현한다.
     면색은 열린 카드·실행중 칩과 같은 --accent-soft/--accent-ink 쌍(새 색 토큰 0)이고,
     테두리(--accent)는 열린 카드·열린 행(면색이 같은 --accent-soft, .card.card-open·
     .session-row.card-open 참고 — 이 배지도 그 면 위에 놓일 수 있다) 위에서 윤곽을 지킨다.
     대비(계산) 라이트 5.12:1·다크 7.52:1, WCAG AA(4.5:1) 여유. 애니메이션 0(T25-190·T25-243
     의 halo 금지 정신 — glow 는 working 전용). */
  .badge.state-background{background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent)}
  .badge.state-done{background:transparent;color:var(--muted);border:1px solid var(--line)}
  /* 승인 대기 표지(결정 AW4, docs/prps/hub-approval-wait-badge.md) — 「사용자 조치가 필요하다」는 경고색(--attention) 계열이되 한도 초과(채움)·
     소식 없음(점선)과 흰 면 + 실선 링으로 형태가 갈린다. 면을 --surface 로 칠하는 처음 이유는 대비였다: 글자 --attention 이 --surface 위
     8.36:1(라이트)·7.29:1(다크)로 WCAG AA(4.5:1)를 넘는다. 파랑 팔레트에서는 면이 투명이면 열린 행(--accent-soft) 위 4.06:1,
     --attention-soft 면이면 4.39:1 로 11px 글자에 미달이었다. 금빛 팔레트에서는 열린 행 6.80·--attention-soft 7.07(라이트)로 모두
     넘지만, 흰 면 + 실선 링은 채움·점선과 갈리는 세 번째 형태라 그대로 둔다. 링은 border 가 아니라 안쪽 box-shadow 다 — 실측(320px 트랙)에서 1px border 는 첫 줄을 19→21px 로
     키우고 상태 배지 중심을 +1px 내려 트리 갈고리 정렬 허용치(≤1px)를 소진했지만, 안쪽 링은 표지 없는 줄과 높이·중심이 같았다.
     링은 흐림·번짐·애니메이션이 없는 1px 테두리 대용이라 halo 금지(T25-190·243·250)와 무관하다. 새 색 토큰 0. 단계 칩(.agent-chip)
     어휘를 쓰지 않는다 — 결정 LM12 가 실행 칩과 헷갈려 걷은 것의 부활이 아니다(결정 AW5). */
  .badge.approval-wait{background:var(--surface);color:var(--attention);box-shadow:inset 0 0 0 1px var(--attention)}
  .last-activity{margin-left:auto;font-size:11.5px;color:var(--muted);flex:0 0 auto;white-space:nowrap}
  .path{font-size:11.5px;color:var(--muted);margin-top:2px;word-break:break-all}
  .tier1-pct{font-size:12px;font-weight:700;color:var(--accent-ink);margin-top:8px}
  /* 진행중 단계 줄(.tier1-active)과 그 2줄 클램프(TC2, docs/prps/hub-tier1-clamp-fix-and-session-model.md)는 걷혔다 —
     단계명을 옮겨 받았던 진행률 줄 맨 앞 단계 칩도 서브에이전트 실행 칩과 헷갈려 걷었다(결정 LM4·LM12,
     docs/prps/hub-session-row-layout-and-modal-size.md). 지금 진행률 줄은 제목 — 완료/전체 · % 글자뿐이다. */
  .tier1-impl{font-size:11.5px;color:var(--muted);margin-top:2px}
  /* 세션별 진행률(요구 2, 결정 U4·U9) — 항상 렌더한다. 접힘 상태 자체가 삭제돼(결정 TR1·
     TR3, docs/prps/hub-ui-4-issues.md §2) 숨길 대상이 없다 — 옛 접힘 상태에서만
     .session-tier1 을 감추던 부정 스코프 규칙은 그래서 삭제한다. */
  .session-no-dashboard{font-size:12px;color:var(--muted);margin-top:8px}
  /* 세션 행 선택/hover 배경 여백(결정 V9, docs/prps/hub-tree-view-and-signal-fixes.md §6) — 세로 패딩을
     li 7 → li 2 + 버튼 5 로 재배분(합 14 불변, 행 높이 증분 0). 가로는 버튼을 좌우 8px 번지게 하고(텍스트
     x 원점 불변) ul 의 padding/margin 을 같은 값으로 짝지어 스크롤 컨테이너(overflow-y:auto) 안에 가둔다 —
     이 짝이 어긋나면 카드에 가로 스크롤바가 생긴다(T25-193). */
  .sessions{list-style:none;margin:10px -8px 0;padding:0 8px 0 24px;font-size:13px;flex:1 1 auto;min-height:0;overflow-y:auto}   /* 좌 24(결정 TR6 — 8(번짐)+16(1단 들여쓰기)=24, docs/prps/hub-ui-4-issues.md §2.5) */
  .sessions li{padding:2px 0;position:relative}   /* border-top 삭제(결정 TR7 — 구분선 대신 연결선이 형제를 가른다, docs/prps/hub-ui-4-issues.md §2.5) */
  .session-row{display:block;width:calc(100% + 16px);margin:0 -8px;font:inherit;color:inherit;text-align:left;
               background:none;border:0;padding:5px 8px;border-radius:8px;cursor:pointer}
  .session-row:hover{background:var(--soft)}                                /* 무변경 */
  .session-row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}   /* 무변경 — 둥근 상자를 따라간다 */
  .session-row.card-open{background:var(--accent-soft)}                     /* 무변경 */
  /* ── 세로 들여쓰기 트리(결정 V2~V8, docs/prps/hub-tree-view-and-signal-fixes.md §5. 상시
     표시로 전환 — 결정 TR1·TR2, docs/prps/hub-ui-4-issues.md §2) ──
     더 이상 옛 확장 카드 스코프가 없다 — 트리·세션별 진행률이 카드의 유일한 표시라
     아래 규칙은 항상 적용된다(TR2). DOM·JS 변경은 여전히 0.
     기하(px): 레일 = 부모 콘텐츠 왼끝 +4, 갈고리 8, 자식 = 부모 +16(단당 16, 상한 2단 = 32).
     갈고리 y 17 = li 2 + 버튼 5 + 첫 줄 중앙 ≈10 / 진행 노드는 .tier1-pct margin-top 8 + 줄 중앙 9.
     └ 는 border-left+box-shadow(inset 바닥 1px) 상자(::before) 하나, ├ 는 그 아래 레일(::after)
     — 마지막 형제는 끈다. border-bottom 은 쓰지 않는다 — 이 파일 전체 0건이 결정 G8 이다(T25-85).
     원출처는 docs/prps/hub-detail-side-panel.md R2 승인 항목 6(1801~1814행) — 시안 C 가 탈락해
     토큰을 좁힐 이유가 없어져 0건으로 확정했다. hub-panel-polish-and-icons.md(G2·536행)는 그
     결정을 승계·재확인만 한다(옛 시안 자체는 그 문서에 없다). box-sizing:border-box 는
     의사요소(::before/::after)에는 적용되지 않는다 — 전역 리셋(186행)의 `*` 는 그 둘을 포함하지 않아
     실측 box-sizing 은 content-box 다(헤드리스 Chrome 152, getComputedStyle(el,'::before').boxSizing).
     원안(border-bottom)이었다면 이 content-box 규칙으로 렌더 높이가 border 폭만큼 밖으로 늘어
     바닥선이 host 기준 y=17 에 그려졌을 것이다. box-shadow 는 상자 안쪽에 그리므로 높이를 원안
     값 그대로 두면 바닥선이 y=16 — 1px 위다. 그래서 상자 높이 자체를 1px 올렸다(17→18·27→28·
     13→14, 아래 4규칙) — 바닥선이 y=17, 원안과 같은 자리다. §11.6-4 실측 갈고리↔배지 정렬(1단
     ±0.5px — 배지 테두리 유무로 부호가 갈린다: 테두리 있는 state-stale·state-done 은 −0.5px,
     테두리 없는 state-working·state-idle 은 +0.5px / 2단 진행 노드 0px — .tier1-pct 의
     margin-top 8 + 줄상자 중앙 9 = 17 이 바닥선 y 와 정확히 만난다(line-height 가 정수 18px 로
     계산돼 반올림 여지가 없고 dsf 1·2 에서 같다) / 2단 위임 노드 −0.1484px, 헤드리스
     Chrome 152·실데이터 실측)이
     PRP 허용치(≤1px, §11.6-4·§13 위험1) 안이다. 이 대체는 docs/prps/hub-detail-side-panel.md
     1810~1814행이 「함께 막아야 할 우회로」로 지목한 것과 철자 가드 회피라는 점에서 같은
     형태이지만, 거기서 G8 이 막던 것은 헤더/본문을 가르는 전폭 하드 디바이더(--line)이고
     이것은 8px 폭 트리 연결선(--muted 50%)이라 목적·색·굵기 인상이 달라 별개로 판단했다.
     색은 --muted 50% — --line 은 열린 카드 면(--accent-soft) 위에서 ΔL* 약 2.9 로 식별 한계(약 2)를 간신히 넘을 뿐이라 약하다(라이트). */
  .sessions li::before,
  .sessions li::after,
  .session-tier1::before,
  .session-tier1::after,
  .agent-run-list::after,
  .workflow-runs::after{content:"";position:absolute;left:-12px;border-left:1px solid var(--muted);opacity:.5}
  .sessions li::before{top:0;height:18px;width:8px;box-shadow:inset 0 -1px 0 0 var(--muted)}
  .sessions li:first-child::before{top:-10px;height:28px}     /* 루트 본문까지 레일 연장(V12) */
  .sessions li::after{top:17px;bottom:0}
  .sessions li:last-child::after{display:none}
  /* 본문(첫 줄·메타·발췌) 뒤에 자식(진행·실행·워크플로)이 오는 순서는 DOM 순서가 그대로 정한다 — V7 이 CSS order 로
     시각 순서만 바꾸던 것을 접힘 화면 소멸(TR1)로 근거가 없어져 걷었다(결정 LM2). 발췌가 <span> 이라 flex 아이템으로
     블록화되는 것이 지금의 줄 모양을 만든다 — 그래서 display:flex 와 flex-basis:auto 는 남긴다. */
  .session-row{display:flex;flex-direction:column}
  .session-row>.excerpt{flex-basis:auto}
  .session-meta{flex-wrap:wrap}                      /* 최소 폭에서 들여쓰기 16px 만큼 잃은 자리 보전 */
  /* 2단 자식(진행률 → 실행 줄 → 워크플로, DOM 순서 = 시각 순서). 각 가지는 자기 갈고리(::before)와 아래로 이어지는
     레일(::after)을 갖고, 마지막 가지만 레일이 없다(:last-child — 진행률 노드는 늘 렌더되고 발췌 뒤에 오므로 버튼의
     마지막 자식은 항상 가지다, 결정 LM3. 버튼 끝에 새 형제를 더하는 변경은 이 전제를 깬다 — T25-262).
     진행률 갈고리 바닥선 17 = .tier1-pct margin-top 8 + 줄 중앙 9, 다른 두 가지의 레일 시작 9 = 갈고리 상자
     (top -4, 높이 14)의 바닥선 y. 레일은 호스트 바닥(bottom 0)에서 끝난다 — 다음 가지의 갈고리 상자가 top -4 로
     그 바닥에서 시작하므로(margin-top 4 를 거슬러 올라간다) 둘이 정확히 맞닿는다. bottom -4 로 4px 더 내리면 갈고리와
     4px 겹쳐 그 구간만 진해진다(헤드리스 Chrome 실측, 결정 LM3 개정 — PRP 원안 산식 정정). */
  .session-tier1,
  .workflow-runs{position:relative;margin-left:16px}
  .session-tier1::before{top:0;height:18px;width:8px;box-shadow:inset 0 -1px 0 0 var(--muted)}
  .session-tier1::after{top:17px;bottom:0}
  .agent-run-list::after,.workflow-runs::after{top:9px;bottom:0}
  .session-tier1:last-child::after,.agent-run-list:last-child::after,.workflow-runs:last-child::after{display:none}
  /* 안 A(권고) — 위임 노드 1개, 본문은 칩 행 그대로. 13 = 간격 4 + 칩 첫 줄 중앙 9. */
  .workflow-runs::before{content:"";position:absolute;left:-12px;top:-4px;height:14px;width:8px;
    border-left:1px solid var(--muted);box-shadow:inset 0 -1px 0 0 var(--muted);opacity:.5}
  .session-line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .session-time{font-size:11px;color:var(--muted)}
  /* 백그라운드 대기 세션의 출력 갱신(결정 LA10, docs/prps/hub-live-activity.md) — 첫 줄(flex-wrap) 끝. 글자 크기·색은
     .session-time 과 같다(새 색 토큰 0, 면색·테두리·애니메이션 없음). */
  .session-activity{font-size:11px;color:var(--muted)}
  /* 세션 식별 줄(요구 3). .session-line 의 **형제 블록**이라 첫 줄의 flex-wrap 거동을
     건드리지 않는다 — 좁은 카드에서 배지·경과시간·칩이 접히는 방식이 종전과 정의상 같다.
     340px 고정 카드에서 세션 1건이 약 20px 높아지므로 카드 높이·그리드는 불변이고
     "한 화면에 보이는 세션 수"만 줄어든다
     (docs/prps/hub-session-activity-and-tooltip.md 전제 2). */
  .session-meta{display:flex;align-items:baseline;gap:6px;margin-top:3px;font-size:11px;color:var(--muted)}
  /* 식별자는 글자 모양이 헷갈리면 소용이 없다(0/O, 1/l) — .agent-chip 과 같은 모노스페이스
     스택을 쓴다. 새 색 토큰은 만들지 않는다(.session-meta 의 --muted 를 물려받는다). */
  .session-id{font-family:ui-monospace,monospace;letter-spacing:-.2px}
  /* 세션이 지금 쓰는 모델·effort(요구 2, docs/prps/hub-tier1-clamp-fix-and-session-model.md
     결정 MD8~MD10). .session-meta 의 세 번째 항목으로 얹는다 — 새 줄이 아니라 세로 증분이
     0px 다(설계 단계 실측, 헤드리스 Chrome). 버전 숫자(4.5/4.6/4.8)가 헷갈리면 안 되는 것이
     식별자(.session-id)와 같은 사정이라 같은 모노스페이스 스택을 쓴다. 새 색 토큰은 만들지
     않는다(.session-meta 의 --muted 상속, .session-id 와 같은 선택). 폭 상한은 이 규칙이
     아니라 JS(MODEL_LABEL_MAX_CHARS)가 건다 — overflow:hidden 으로 다스리면 요구 1과 같은
     계열의 함정(가로 flex 에서 형제가 짓눌려 줄 높이가 2배로 붕괴, §3.10 GOTCHA)에 걸린다. */
  .session-model{font-family:ui-monospace,monospace;letter-spacing:-.2px}
  /* 세션 메타 세 필드의 시각적 구분(요구 2, 결정 MC1~MC5). 세 값이 같은 색·같은 크기로
     6px 간격 나열돼 "시작 8/25 14:23 63ad8669 Sonnet 5 · high" 가 한 문자열로 읽혔다.
     장치는 .agent-chip 이 이미 쓰는 --soft 면색 + --muted 글자색 쌍 그대로다 — 새 색 토큰도,
     새 색 조합도 0개(MC2). 패딩을 **가로 전용**으로 두는 것이 이 규칙의 핵심이다: .session-meta
     의 자식은 flex 아이템이라 세로 패딩은 곧 줄 높이지만 가로 패딩은 줄 높이에 기여하지 않는다
     — 실측(헤드리스 Chrome 151, 320px 트랙) 16.50px 유지, 카드에 보이는 세션 3건 불변.
     .agent-chip 을 클래스째 재사용하면 padding:2px 6px 때문에 18.30px 로 늘고(+1.8px),
     .badge 를 재사용하면 19~35px 로 늘어 보이는 세션이 3→2건으로 줄었다(둘 다 기각, §4.3).
     border-radius 는 .agent-chip 의 6px 이 아니라 5px 다 — 16.5px 높이 칩에 6px 를 주면
     모서리가 과해 윗줄 칩과 위계가 뒤집힌다. 시작 시각 칸에는 칩을 씌우지 않는다(MC3) —
     스캔의 리더이고, 칩 하나가 가로 12px 을 먹어 세 개를 씌우면 모델 라벨 상한이 실제 최장
     모델명(Sonnet 4.6 = 10자) 아래로 내려간다. box-shadow 구분선과 --line 면색은 기각했다:
     전자는 열린 카드(.card.card-open, --accent-soft)에서 ΔL* 2.15 로 사라지고(파랑 팔레트 시절 실측), 후자는 라이트
     테마 텍스트 대비가 4.35:1 로 WCAG AA(4.5:1) 미달이다(파랑 팔레트 시절 실측, §4.5). 이 칩은 반대로 열린 카드에서
     ΔL* 5.74 로 더 강해진다. 대비 계산: --muted on --soft = 6.10:1(라이트)·6.07:1(다크). */
  .session-id,.session-model{background:var(--soft);border-radius:5px;padding:0 6px}
  /* 세션 비용·컨텍스트 칩(⑨ 안 A, docs/prps/harness-benchmark-adoption.md §5-7). 식별 줄의 네 번째 칩이다 — 위 공유 규칙
     (.session-id,.session-model)은 건드리지 않고(T25-153 이 그 셀렉터 리터럴을 문다) 같은 선언을 이 별도 규칙이 반복한다.
     새 색 토큰 0개, 세로 패딩이 없어 줄 높이는 그대로다(MC 결정과 같은 이유). white-space:nowrap — 칩 안에서 「≈$12.84」와
     「컨텍스트 62%」가 갈라져 두 줄이 되면 줄 높이가 2배로 붕괴한다(.session-meta 의 형제가 짓눌리는 §3.10 GOTCHA 와 같은 계열). */
  .session-cost{background:var(--soft);border-radius:5px;padding:0 6px;white-space:nowrap}
  .agent-chip{font-family:ui-monospace,monospace;font-size:11px;font-weight:700;line-height:1.3;
              color:var(--muted);background:var(--soft);border-radius:6px;padding:2px 6px}
  .agent-chip-running{color:var(--accent-ink);background:var(--accent-soft)}
  /* 실패한 워크플로우 에이전트 칩(선택 항목 E, 결정 WT7, docs/prps/hub-ui-4-issues.md §4.5) —
     .badge.state-stale(365행)과 같은 attention 쌍. 툴팁 제거(WT1)로 실패 사유가 화면에서
     완전히 사라지는 것을 색으로 부분 보완한다 — 사유 문구 자체는 싣지 않는다. */
  .agent-chip-error{color:var(--attention);background:var(--attention-soft)}
  /* 서브에이전트 실행 목록(결정 AR8·AR12, docs/prps/hub-agent-runs-and-prompt-source.md) —
     첫 줄의 타입 합계 칩 행(.agent-runs)을 대체한다. .workflow-runs 와 같은 2단 자식
     자리를 쓴다 — 트리 기하(레일 left:-12px, 갈고리 14px)를 그대로 물려받아 새 기하
     상수를 만들지 않는다. 순서·레일은 결정 LM2·LM3(위 트리 절)이다. */
  .agent-run-list{position:relative;margin-left:16px;margin-top:4px;display:flex;flex-direction:column;gap:2px}
  .agent-run-list::before{content:"";position:absolute;left:-12px;top:-4px;height:14px;width:8px;
      border-left:1px solid var(--muted);box-shadow:inset 0 -1px 0 0 var(--muted);opacity:.5}
  .agent-run{display:flex;align-items:baseline;gap:6px;min-width:0}
  /* ★ 칩은 절대 줄지 않는다 — flex 기본 shrink:1 을 두면 320px 에서 칩 글자가 두 줄로 찢어진다
     (목업 1차 실측). .session-meta 가 겪은 것과 같은 계열의 함정이다. */
  .agent-run>.agent-chip{flex:0 0 auto;white-space:nowrap}
  .agent-run-title{flex:1 1 auto;min-width:0;font-size:11.5px;color:var(--ink);
                   overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 경과는 항상 오른쪽 끝 — 제목이 비어도 줄 모양이 흔들리지 않는다. */
  .agent-run-meta{flex:0 0 auto;margin-left:auto;font-size:11px;color:var(--muted);
                  font-family:ui-monospace,monospace;letter-spacing:-.2px;white-space:nowrap}
  .agent-run-more{font-size:11px;color:var(--muted);margin-top:2px}
  /* 도는 실행의 활동 줄(결정 LA9, docs/prps/hub-live-activity.md) — 실행 줄 **안**의 두 번째 줄이다. 활동 줄 왼쪽은 칩이 아니라 제목
     왼쪽에 맞아야 어느 서브에이전트에 딸린 내용인지 읽힌다. 칩 폭은 단계 라벨이냐 agent_type 폴백이냐에 따라 가변이라 고정 들여쓰기로는
     못 맞추므로, 활동이 있는 행만 칩 | 제목 | 경과 칸으로 나눠 활동 줄이 2칸부터 끝까지 가로지르게 한다(칸 경계가 곧 제목 왼쪽이다).
     제목 칸을 minmax(0,1fr) 로 둬야 긴 제목이 칸을 밀어내지 않고 말줄임으로 남는다. 기본 규칙(.agent-run)은 건드리지 않고 modifier 로만
     바꿔 활동이 없는 오늘의 줄 모양(flex)을 보존한다. 「새 기록 없음」은 소식 없음 배지와 같은 --attention 을 글자색으로만 쓴다 — 새 색
     토큰 0, 면색·테두리·그림자·애니메이션 없음(상태가 아니라 줄 하나의 주석이다, 결정 LA8). */
  .agent-run.agent-run-with-activity{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:6px;row-gap:0;
                                     align-items:baseline}
  .agent-run-activity{grid-column:2 / -1;font-size:11px;line-height:1.35;color:var(--muted);
                      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .agent-run-activity-stall{color:var(--attention);font-weight:700}
  .agent-run-activity .glyph{margin-right:3px}
  /* 워크플로우 서브에이전트 칩 행(docs/prps/hub-workflow-visibility.md 결정 WF9 → WT1 로
     툴팁 부분 개정, docs/prps/hub-ui-4-issues.md §4) — 새
     CSS 규칙은 이 행 컨테이너 하나뿐이다. 칩 자체는 .agent-chip 을 그대로 재사용한다(새 색
     토큰 0개). 진행률·실행 줄 뒤 마지막 가지로 놓이는 별도 줄이라 자기 줄을 갖는 블록이다. */
  .workflow-runs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
           clip:rect(0,0,0,1px);white-space:nowrap;border:0}
  .excerpt{color:var(--muted);font-size:12.5px;flex-basis:100%}
  .empty{color:var(--muted);font-size:13px;padding:20px 4px;text-align:center}
  .warnings{font-size:12px;color:var(--attention);margin-top:6px;border-left:3px solid var(--attention);padding-left:8px}
  .warnings::before{content:"⚠ "}
  .foot{font-size:11.5px;color:var(--muted)}
  /* 헤더 버튼 클러스터 — 새로고침·테마 버튼을 묶는다. R5 로 고정 위치를 버리고 .head-row
     문서 흐름 안(flex)으로 들어왔다 — margin-left:auto 로 항상 오른쪽 끝에 붙는다. */
  .top-actions{margin-left:auto;flex:0 0 auto;display:flex;align-items:center;gap:8px}
  /* 설치된 하네스 버전(harness-versioning 결정 UN7) — h1 오른쪽의 작은 고정폭 표기. 새 색 토큰 0(--muted).
     display 를 주지 않으므로 hidden 속성이 그대로 먹는다. */
  .harness-version{font-family:ui-monospace,monospace;font-size:11.5px;color:var(--muted)}
  /* 새 버전 알림 버튼(결정 UN7) — 32px 알약, .badge.state-background 가 쓰는 --accent-soft 면 + --accent-ink 글자 +
     --accent 테두리 쌍 그대로다(새 색 토큰 0, 대비는 그 배지와 같다). display:inline-flex 가 hidden 속성을 이기므로
     [hidden] 규칙이 필요하다. 라벨 셋(기본·복사됨·복사 실패)은 마크업에 함께 두고 CSS 가 하나만 보인다(결정 UN8). */
  .update-btn{height:32px;padding:0 12px;font:inherit;font-size:12.5px;font-weight:700;white-space:nowrap;cursor:pointer;
              display:inline-flex;align-items:center;color:var(--accent-ink);background:var(--accent-soft);
              border:1px solid var(--accent);border-radius:999px}
  .update-btn[hidden]{display:none}
  .update-btn:hover{border-color:var(--accent-ink)}
  .update-btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .update-label-copied,.update-label-copy-failed{display:none}
  .update-btn-copied .update-label,.update-btn-copy-failed .update-label{display:none}
  .update-btn-copied .update-label-copied,.update-btn-copy-failed .update-label-copy-failed{display:inline}
  /* 32px 원형 아이콘 버튼 — 헤더 클러스터의 두 버튼이 공유한다(결정 Y4). 상세 패널의
     닫기 컨트롤은 이 클래스를 쓰지 않는다 — 페이지 최상위 액션과 패널 안 컨트롤의
     위계를 구분한다(결정 SP11). 같은 줄에 나란히 서는 버튼들이 같은 크기·같은 테두리를
     갖게 하려고 클래스를 하나로 묶었다(추측성 추상화가 아니라, 지금 실제로 같아야 한다는
     요구에서 나온 것이다). 텍스트가 없어 aria-label 로 접근성 이름을 준다(마크업 참고).
     32px 는 유니코드 글리프(26px)가 너무 작다는 피드백을 반영해 키운 값이다. */
  .icon-btn{width:32px;height:32px;padding:0;color:var(--muted);background:var(--surface);
            border:1px solid var(--line);border-radius:999px;cursor:pointer;
            display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
  .icon-btn:hover{color:var(--accent-ink);border-color:var(--accent)}
  .icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .icon-btn svg{width:18px;height:18px}
  /* 테마 아이콘(PV10) — 두 SVG 를 마크업에 함께 두고 CSS 가 하나만 보여준다. JS 는 아이콘을
     만들지 않는다(정적 노드는 속성만 갱신한다는 불변식 H1⁗ 의 원칙). 보이는 아이콘은 "지금"이
     아니라 "전환될 대상"이다(결정 Y4) — 라이트에서 moon, 다크에서 sun.
     data-theme 는 테마 IIFE 말미의 applyTheme(currentTheme()) 가 무조건 붙이므로 이 선택자가
     빈손이 되는 상태는 없다(localStorage 가 막혀도 시스템 선호로 낙착한다). */
  .theme-toggle .theme-icon-sun{display:none}
  :root[data-theme="dark"] .theme-toggle .theme-icon-moon{display:none}
  :root[data-theme="dark"] .theme-toggle .theme-icon-sun{display:inline}
  /* 연결 두절은 hover 전용 툴팁만으로는 아무도 못 본다 — 버튼 자체를 경고색으로 바꿔
     상시 가시 신호를 유지한다(연결 상태 문구가 #dzh-collected-at 에서 툴팁으로 이동한
     뒤에도 "화면이 멈췄다"는 사실만은 능동적 상호작용 없이 보여야 한다). */
  .refresh-btn.connection-lost{color:var(--attention);border-color:var(--attention);background:var(--attention-soft)}
  /* 새로고침 회전(PV6) — "클릭이 접수됐다"만 말하는 1회 재생이다. 폴링의 진행/성공/실패는
     이미 data-tooltip 문구와 .connection-lost 색이 말하고 있어 여기서 반복하지 않는다.
     시간 숫자는 이 한 곳에만 산다 — JS 는 animationend 로 끝을 알므로 시간을 모른다(PV7).
     600ms 는 회전이 눈에 남지 않을 만큼 빨라 "돌았다"가 아니라 "번쩍했다"로 읽혔다. 1회
     재생이라 길어도 반복 피로가 없으므로, 한 바퀴를 눈으로 따라갈 수 있는 1000ms 로 늦춘다. */
  @keyframes dzh-refresh-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .refresh-btn.refresh-spinning svg{animation:dzh-refresh-spin 1000ms ease-in-out}
  /* 무효화는 반드시 위 규칙보다 뒤에 온다(.card.card-working 124행이 세운 관례). */
  @media (prefers-reduced-motion:reduce){.refresh-btn.refresh-spinning svg{animation:none}}
  /* 218px 은 JS 가 못 도는 경우에만 쓰이는 fallback 이다(펼침 실측 186 + 여유 32,
     .usage-toggle 의 line-height:1 적용 이후 재실측 — 검수 LOW). 평소에는
     applyUsageClearance() 가 --usage-clearance 를 실측값으로 덮어쓴다 —
     USAGE_CLEARANCE_MARGIN_PX 를 고치면 이 숫자도 같이 봐야 한다. */
  body.has-usage .wrap{padding-bottom:var(--usage-clearance,218px)}
  .usage{position:fixed;right:16px;bottom:16px;width:min(420px, calc(100vw - 32px));z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;box-shadow:var(--shadow)}
  .usage.usage-collapsed{width:auto;max-width:calc(100vw - 32px);padding:10px 14px}
  /* line-height:1 — font:inherit 가 body 의 1.5 를 그대로 물려받아 텍스트 줄상자에 여백(leading)이
     남는다. 접힘 알약처럼 이 여백이 곧 버튼 높이가 되는 상황에서는 그 여백이 위아래로 고르게
     안 나뉘어(글꼴 자체의 ascent/descent 비대칭) 아래쪽이 더 비어 보인다 — 실측 확인함. */
  .usage-toggle{display:flex;align-items:center;gap:8px;width:100%;padding:0;border:0;background:none;font:inherit;line-height:1;color:inherit;text-align:left;cursor:pointer}
  .usage-toggle:hover .usage-title{color:var(--accent-ink)}
  .usage-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .usage-title{font-size:12.5px;font-weight:800;color:var(--head)}
  .usage-summary{font-size:12.5px;font-weight:700;color:var(--accent-ink)}
  .usage-caret{margin-left:auto;font-size:10px;color:var(--muted)}
  .usage-caret::before{content:"▾"}
  .usage.usage-collapsed .usage-caret::before{content:"▸"}
  .usage:not(.usage-collapsed) .usage-summary{display:none}
  .usage.usage-collapsed .usage-body{display:none}
  .usage-body{margin-top:8px}
  .usage-body>.usage-row:first-child{margin-top:0}
  .usage-row{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--ink);margin-top:8px}
  .usage-pct{font-weight:700;color:var(--accent-ink)}
  .usage-bar{height:8px;border-radius:999px;background:var(--soft);margin-top:4px;overflow:hidden}
  /* 막대는 --accent-bar(라이트는 밝은 금 → 깊은 금 광택 — 아래 띠는 트랙과 3:1, T25-282 ⑦. 다크는 --accent 의 별칭)이고, 윗면 하이라이트
     --gloss-edge 는 라이트에서만 보인다(다크는 투명 그림자) — 결정 LT11·LT13. */
  .usage-bar>span{display:block;height:100%;background:var(--accent-bar);box-shadow:var(--gloss-edge);border-radius:999px}
  .usage-reset{font-size:11px;color:var(--muted);margin-top:3px;text-align:right}
  .usage-meta{font-size:11px;color:var(--muted);margin-top:10px;text-align:right}
  /* 만료(조회되지 않음) 상태 — 새 색 토큰을 만들지 않고 기존 --muted·--attention 만 쓴다(R-B). */
  .usage-pct-empty{color:var(--muted);font-weight:700}
  .usage-stale-note{color:var(--attention)}
  .usage.usage-stale .usage-summary{color:var(--muted)}
  /* 계정 줄(결정 AC5·AC6) — 이름은 auto, 값은 minmax(0,1fr) 이어야 overflow-wrap:anywhere 가 듣는다
     (1fr 만 쓰면 min-content 가 긴 이메일 폭이 되어 패널이 넘친다 — GOTCHA 7). */
  .usage-account{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;row-gap:2px;margin:10px 0 0;padding-top:8px;border-top:1px solid var(--line);font-size:11.5px}
  .usage-account dt{color:var(--muted)}
  .usage-account dd{margin:0;color:var(--ink);text-align:right;overflow-wrap:anywhere}
  /* 폭 280→420px · white-space · max-height 세 가지는 세션 발췌 전문 툴팁(.excerpt[data-tooltip])
     때문에 들어왔다 — 여기 실리는 문구가 처음으로 "한 문장"이 아니라 여러 단락의 프롬프트다.
     ① 폭: 기록 상한(500자)까지 찬 한글 프롬프트가 280px 에서 279px, 420px 에서 179px 로
     실측된다 — 폭을 넓히는 쪽이 화면을 100px 덜 가린다. 기존 트리거 문구는 전부 280px 보다
     짧아 줄 수만 줄어든다(실측 8곳 전부 1줄로 낙착, 잘림 없음).
     ② pre-wrap: 프롬프트의 줄바꿈을 살린다. 기존 문구에는 개행이 없어 영향이 없다.
     ③ max-height: ②의 대가다. 개행을 살리면 목록을 붙여넣은 프롬프트가 매우 길어진다 —
     500자에 개행 250개면 실측 4180px 로 어떤 뷰포트도 넘는다. TOOLTIP_VIEWPORT_MARGIN_PX(8)
     두 배를 뺀 값이라 tooltipPosition 의 클램프와 정확히 맞물린다. 넘치는 꼬리는 잘린다 —
     스크롤은 주지 않는다(캡처 단계 scroll 리스너가 툴팁을 즉시 숨겨 스크롤바가 동작하지 않는다). */
  .tooltip{position:fixed;left:0;top:0;z-index:40;max-width:min(420px,calc(100vw - 32px));
           max-height:calc(100vh - 16px);overflow:hidden;
           padding:6px 9px;border-radius:8px;font-size:11.5px;line-height:1.45;font-weight:600;
           color:var(--bg);background:var(--ink);box-shadow:var(--shadow);
           white-space:pre-wrap;overflow-wrap:anywhere;visibility:hidden}
  .tooltip.tooltip-visible{visibility:visible}
  /* 프로젝트 상세 패널(SP1) — 카드 클릭 시 우측에서 밀려 들어오는 **비모달** 패널이다.
     <dialog> 를 쓰지 않는 이유(결정 SP1): 넓은 화면에서는 배경 목록을 계속 써야 하므로
     showModal 메서드의 포커스 트랩·inert 가 해가 되고, show() 는 ESC 를 주지 않으며
     ::backdrop 도 렌더되지 않아 결정 N5 가 근거로 삼은 "공짜" 넷이 모두 사라진다.
     기본 규칙이 좁은 화면(오버레이)이고 아래 min-width 쿼리가 넓은 화면(밀어내기)을
     덧쓴다 — 브레이크포인트 리터럴을 한 곳에만 두기 위한 배치다(GOTCHA 2).
     닫힌 상태를 visibility:hidden 으로 두는 것은 필수다 — transform 만으로 화면 밖에
     내보내면 닫힌 패널의 버튼이 Tab 순서와 접근성 트리에 그대로 남는다.
     배경은 --surface 가 아니라 --bg 다(PV1): 이 패널은 "카드"가 아니라 "페이지"이며, 안에
     띄우는 대시보드 문서의 body 도 같은 --bg 를 칠한다. 헤드가 --surface 였을 때는 대시보드
     첫 카드(--surface)와 같은 색이 맞닿아 헤드가 카드 안쪽 제목처럼 읽혔다 — SP11 이 구분선을
     지운 판단은 옳았고, 그 판단이 성립할 조건(헤드와 카드가 다른 표면일 것)을 여기서 갖춘다.
     대시보드는 임베드되면 자기 헤더 행을 숨기고(#dz-page-head) 그 역할을 이 헤드에 넘긴다 —
     넘겨받은 쪽이 같은 표면 위에 서는 것이 정합적이다. */
  .detail-panel{position:fixed;top:0;right:0;bottom:0;left:0;z-index:30;
                display:flex;flex-direction:column;
                background:var(--bg);color:var(--ink);
                border-left:1px solid var(--line);box-shadow:-16px 0 48px rgba(0,0,0,.28);
                transform:translateX(100%);visibility:hidden;pointer-events:none;
                transition:transform 180ms ease-out, visibility 180ms}
  /* 전이 선언은 "닫힌(기본) 규칙"에 둔다. 클래스가 붙을 때와 떨어질 때 모두 살아 있는
     유일한 위치다. visibility 를 같은 시간으로 함께 전이시키면 전이 중에는 계속 visible 로
     계산돼(특수 보간) 나가는 동안 패널이 사라지지 않는다 — 지연도 상태 클래스도 필요
     없다(SP12). */
  body.dzh-panel-open{overflow:hidden}
  body.dzh-panel-open .detail-panel{transform:none;visibility:visible;pointer-events:auto}
  /* 밀어내기 모드 — 이 값(1024)은 JS 의 PANEL_PUSH_MIN_WIDTH_PX 와 같아야 한다(T25-78). */
  @media (min-width:1024px){
    .detail-panel{left:auto;width:var(--dzh-panel-width);border-radius:14px 0 0 14px}
    /* .usage 는 position:fixed 라 body 패딩을 따라오지 않는다 — 같은 폭만큼 직접 옮긴다. */
    body{transition:padding-right 180ms ease-out}
    #dzh-usage{transition:transform 180ms ease-out}
    body.dzh-panel-open{overflow:visible;padding-right:var(--dzh-panel-width)}
    body.dzh-panel-open #dzh-usage{transform:translateX(calc(-1 * var(--dzh-panel-width)))}
  }
  /* 이 오버라이드는 위 규칙들보다 반드시 뒤에 오고, 셀렉터를 그대로 반복해야 한다 —
     body.dzh-panel-open .detail-panel 은 (0,2,1)이라 .detail-panel 단독으로는 못 덮는다
     (모달 시절 같은 함정을 한 번 밟았다 — 옛 254~257행 주석). */
  @media (prefers-reduced-motion:reduce){
    .detail-panel,
    body,
    #dzh-usage,
    body.dzh-panel-open,
    body.dzh-panel-open .detail-panel,
    body.dzh-panel-open #dzh-usage{transition:none}
  }
  /* 패널 헤더(SP11) — 다이얼로그 타이틀바가 아니다. 이 허브의 헤더 관용구를 그대로 쓴다:
     구분선 없음(.project-head·.usage-toggle 어느 쪽도 쓰지 않는다), 제목이 flex:1 1 auto 로
     남는 폭을 먹고 컨트롤이 자연히 오른쪽 끝에 선다(.project-head 와 같은 구성).
     border-bottom 을 지워도 경계가 흐려지지 않는다 — 헤드 아래 패딩 10px 은 대시보드
     단독 화면의 #dz-page-head{margin:28px auto 10px}(commands/dashboard.md 1326행)과 같은
     값이다. 헤드와 카드 사이의 나머지 여백은 항상 예약된 안내 줄 자리가 만든다(PV2) —
     합계 38px 고정이며, 패널 표면 자체가 --bg 라(PV1) 그 여백이 카드를 페이지 위에
     띄워 보인다. 좌우 패딩 16px 은 취향이 아니라 정렬값이다 — iframe 이 패널 콘텐츠 박스를
     가득 채우므로 이 16px 과 대시보드 .wrap 의 padding:0 16px 이 같은 원점을 공유한다(SP11 ⑤). */
  .detail-head{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
  .detail-title{font-size:15px;font-weight:800;color:var(--head);overflow:hidden;
                text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 auto}
  /* 닫기 컨트롤 — .icon-btn(32px 원형·그림자)은 페이지 최상위 액션(새로고침·테마)의 표기라
     패널 안 컨트롤이 그것을 쓰면 헤드가 창 제목줄로 읽힌다. 카드의 .card-drag-handle 과
     같은 계열(작고 투명하고 사각)로 낮춰 "이 구역의 컨트롤"이라는 위계를 준다.
     글리프 » 는 lucide chevrons-right 로 바뀌었고(PV12) 의미는 같다: 패널이 오른쪽으로
     밀려 나가는 실제 동작(SP12)을 가리킨다. 접근성 이름은 여전히 aria-label 이 고정한다. */
  .detail-close{width:24px;height:24px;flex:0 0 auto;padding:0;color:var(--muted);
                background:transparent;border:1px solid var(--line);border-radius:6px;
                cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .detail-close:hover{color:var(--accent-ink);border-color:var(--accent)}
  .detail-close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .detail-close svg{width:14px;height:14px}
  /* 로딩 중 흰 플래시 방지(브라우저 계측 확인) — 카드 클릭이 location.replace 로 iframe 을
     새 문서로 이동시키는 순간과 그 문서의 첫 페인트 사이(20ms+)에 브라우저가 iframe 영역을
     UA 기본(라이트) 캔버스로 칠한다. 문서 자체는 첫 관측 순간부터 이미 다크(head 테마
     스크립트가 body 파싱 전에 적용됨)라 문서 쪽 CSS/JS 로는 없앨 수 없고, 로딩 중인 iframe
     을 안 보여주는 것만이 견고하다. visibility 를 쓰는 이유는 .detail-note(아래)와 같다 —
     접근성 트리에서 반쯤 로드된 문서를 빼면서 레이아웃 상자(flex:1 1 auto)는 그대로 둔다.
     이 숨김은 로딩 중 한정이고 폴링 억제 목적이 아니다 — closeDetailPanel 의 주석대로
     iframe 의 타이머는 visibility 로 멈추지 않으며, 그 목적은 여전히 about:blank 로의
     실제 이동(JS)이 담당한다. 완료는 detail-frame-loaded 클래스가 붙는다(패널 IIFE). */
  .detail-frame{flex:1 1 auto;width:100%;border:0;visibility:hidden}
  .detail-frame.detail-frame-loaded{visibility:visible}
  /* 빈 상태(결정 OC7) — 대시보드가 없는 프로젝트를 열었을 때 iframe 대신 사유를 보인다.
     상태 클래스는 패널에 붙이고 무엇을 보일지는 CSS 가 고른다(테마 아이콘 2개 중 하나를
     CSS 가 고르는 결정 PV10 과 같은 관례) — JS 는 클래스 1개와 문구 1개만 만진다.
     iframe 을 display:none 으로 내리는 것이 필수다: about:blank 만 실으면 --bg 와 다른
     빈 면이 사유 아래에 남아 "로딩 중"으로 읽히고, 접근성 트리에도 빈 프레임의
     aria-label("프로젝트 진행 대시보드")이 남아 낭독된다.
     문구를 마크업에 고정하지 않는 것이 안내 줄(.detail-note, PV3)과 다른 점이다 —
     사유가 프로젝트마다 다르므로 유일한 출처는 카드 속성이다(결정 OC4). */
  .detail-empty-reason{display:none;margin:0;padding:0 16px;font-size:13px;color:var(--muted)}
  .detail-panel.detail-empty .detail-frame{display:none}
  .detail-panel.detail-empty .detail-empty-reason{display:block}
  /* 안내 줄(결정 GN6 → PV3) — 자리를 항상 차지한다. hidden 속성 토글을 버린 이유:
     [hidden]{display:none} 은 상자를 없애 헤더 높이가 프로젝트마다 달라지고, 패널을 연 채
     다른 카드를 누르면 대시보드가 위아래로 튄다(요구 R2). visibility:hidden 은 상자를
     남기면서 접근성 트리에서는 빠지므로 빈 안내가 낭독되지 않는다.
     한 줄 클램프는 높이 고정의 필요조건이다 — 오버레이 모드에서 패널 폭은 뷰포트 폭이라
     어떤 문구든 접힐 수 있다. 전문은 data-tooltip 이 보존한다(PV4).
     line-height 를 명시하는 이유: 상속값(1.5)은 글꼴 메트릭에 따라 반올림이 달라져 "고정"의
     근거가 되지 못한다. */
  .detail-note{margin:0;padding:0 16px 12px;font-size:11.5px;line-height:16px;
               color:var(--attention);overflow:hidden;text-overflow:ellipsis;
               white-space:nowrap;visibility:hidden}
  .detail-note.detail-note-visible{visibility:visible}
  /* ── 카드 상세보기 모달(결정 SC1~SC17, docs/prps/hub-session-modal-and-partial-update.md) ──
     .head-row(position:sticky) 안의 절대 위치 자식이다 — top:100% 가 곧 헤더 아래 가장자리이고,
     폭은 .head-row 의 패딩 상자(= .wrap 테두리 상자)를 따르므로 밀어내기 모드에서는 JS 없이
     패널 왼쪽으로 좁아진다(SC1). .wrap 안에 있어 좁은 화면 패널의 inert(SP3)가 그대로
     덮는다(SC14). 새 색 토큰·새 @keyframes 0개(T25-195) — 열기는 opacity 전이 1회, 닫기는
     즉시(SP5 기법, SC13). */
  .session-modal{position:absolute;top:100%;left:0;right:0;height:calc(100vh - 100%);
                 visibility:hidden;opacity:0;pointer-events:none;
                 display:flex;flex-direction:column;padding-bottom:16px}
  /* 아래 여백은 16px 고정이다 — 사용량 패널(#dzh-usage)은 화면에 떠 있는 컴포넌트라 펼침·접힘·없음 어느 쪽도 창의 자리·최대 높이를
     바꾸지 않는다(결정 SC16 개정 — 예전에는 패널이 있으면 이 자리가 --usage-clearance 로 늘어 창이 패널 높이만큼 위로 올라갔다.
     --usage-clearance 는 카드 목록(.wrap)의 아랫 여백만 쓴다). */
  /* 창 윗변의 자리(결정 LM8 재개정) — 영역(이 오버레이의 헤더 아래 ~ 아래 padding 16px 위, 곧 content box) 윗변에서 영역 높이의 12.5% 아래다(화면 높이 924px 에서 창 윗변이 화면의 약 20%).
     창 앞의 빈 flex 아이템(::after 에 order:-1 을 줘 첫 아이템으로 둔다)이 flex-basis 12.5% 로 그 높이를 차지하고, 창의 세로 margin 은 0 이라
     창이 그 바로 밑에 걸린다(가운데 정렬이 아니다 — 남는 공간은 전부 창 아래로 간다). 이 아이템은 flex-shrink 1 이고 창은 flex-shrink 0 이라
     내용이 길어 12.5% 오프셋이면 창이 영역 아래를 넘을 때 아이템이 먼저 줄어 창을 영역 안(아래 16px 여백 유지)에 들이고(오프셋이 연속적으로 0
     까지 줄어든다), 그래도 넘치면(창 높이 ≥ 영역) 아이템이 0 이 되고 창이 max-height 에서 멈춰 창 안에서 스크롤한다 — 윗변이 헤더 밑으로 잘려
     올라가지 않는다. 12.5% 는 디자인 판단(사용자 지시 「약간만 위로」 — 창 아랫변이 화면 세로 중앙선에 닿는 자리)이다. 예전 30% 는 영역(헤더 아래 ~ 화면 아래) 높이의 30% 라서
     창 높이 280~350px 인 일반 화면에서는 사실상 세로 가운데와 같은 자리가 됐다(결정 LM8 재재개정). 바꿀 때는 test_hub_template_dom_modal_layout.py 의 비율 상수와 같이
     바꾼다. 퍼센트를 쓰는 이유는 영역이 작은 화면에서는 오프셋도 작아야 하기 때문이다. 이 아이템을 ::before 가 아니라 order:-1 을 준 ::after 로
     두는 이유 — ::before 는 아래 배경 가림막(absolute, inset:0)이 쓰고 있고, 가림막을 ::after 로 옮기면 DOM 순서상 창 뒤에 와서 창을 덮는다.
     order 는 이 빈 아이템의 화면 순서만 바꾼다(내용이 없어 읽는 순서에 영향이 없다). 창을 아래로 내리는 transform·relative 오프셋은 쓰지
     않는다: 넘칠 때도 그대로 내려가 창이 영역 밖으로 나간다. */
  .session-modal::after{content:"";order:-1;flex:0 1 12.5%}
  /* 가려진 목록 — 페이지 면(--bg)을 반투명으로 덮어 카드가 뒤로 물러나 보이게 한다(새 색 0개). */
  .session-modal::before{content:"";position:absolute;inset:0;background:var(--bg);opacity:.8}
  /* 소스 순서상 @media (min-width:1024px) 블록(위)보다 뒤에 둔다 — 밀어내기 모드에서 이
     스크롤 잠금이 body.dzh-panel-open{overflow:visible} 를 덮어써야 한다(T25-239). */
  body.dzh-session-modal-open{overflow:hidden}
  body.dzh-session-modal-open .session-modal{visibility:visible;opacity:1;pointer-events:auto;
                 transition:opacity 180ms ease-out}
  @media (prefers-reduced-motion:reduce){body.dzh-session-modal-open .session-modal{transition:none}}
  /* 창 높이(결정 LM8 — MX7 개정, docs/prps/hub-session-row-layout-and-modal-size.md) — 내용 높이이고 영역 윗변에서 영역 높이의 12.5% 아래에
     걸린다: 오버레이(.session-modal)가 세로 flex 컨테이너이고 아래 padding-bottom(16px 고정 — 사용량 패널과 무관, 결정 LM8 개정)이 영역의
     아랫변을 정하며, 창 앞의 ::after 빈 아이템(flex-basis 12.5%)이 창을 그 높이만큼 내리고 창의 세로 margin 은 0 이다. justify-content:center
     나 자동 여백이 아니라 앞 스페이서를 쓰는 이유 — 스페이서는 줄어들 수 있어(위 ::after 설명) 넘칠 때 창 윗변이 헤더 밑으로 잘려 올라가지 않는다(안전
     정렬). 내용이 영역을 넘으면 max-height:100% 에서 멈추고 이 다이얼로그만 세로로 스크롤한다(overflow-y:auto). flex-shrink:0 — 스페이서가
     줄어들 자리를 줘야 하므로 창이 대신 줄지 않게 한다. 카드 아래 빈 면이 없다 — 높이는 가장 긴 세션 카드가 정한다.
     container-type:inline-size — 세션 카드 폭(아래 .session-modal-body 의 --session-card-width)이 이 창의 폭을 cqw 로 읽는다.
     창의 폭은 자식 내용이 아니라 오버레이가 정하므로(가로 stretch) 인라인 크기 격리가 아무것도 바꾸지 않는다. */
  .session-modal-dialog{position:relative;display:flex;flex-direction:column;gap:12px;
                 margin:0 var(--dzh-wrap-gutter);max-height:100%;overflow-y:auto;flex-shrink:0;container-type:inline-size;
                 background:var(--surface);border:1px solid var(--line);border-radius:14px;
                 padding:16px 20px 12px;box-shadow:var(--shadow)}
  /* 닫기 — 패널 닫기(.detail-close)와 같은 "이 구역의 컨트롤" 위계(SP11·PV12). */
  .session-modal-close{position:absolute;top:14px;right:14px}
  /* 본문(렌더가 자식만 맞대기로 그린다)이 하는 일은 둘이다.
     ① 세로 flex 컨테이너 + flex:1 0 auto — 창 높이가 내용에서 나오므로 grow(1)는 사실상 비활성이고 shrink(0)가
        창이 max-height 에 닿아 넘칠 때의 하중이다(결정 LM9 — 줄면 칸이 자기 안에서 세로로 스크롤한다). 본문 flex 에는 gap 을 두지 않는다: 루트 아랫변과 프레임 윗변이 맞닿아야 아래 연결선 산식이 성립한다.
     ② 연결선 기하의 단일 출처(결정 MX6) — 줄기·드롭·버스·칸 번짐이 전부 아래 사용자 정의 속성 다섯에서만
        파생된다. bleed 는 칸이 다이얼로그 패딩 끝까지 번지는 폭이자 칸 안쪽 패딩(짝), gap 은 세션 카드 간격(버스가
        잇는 간격), link-x 는 줄기·드롭의 x(루트·첫 카드 왼끝에서), link-stem 은 루트 아랫변 → 버스, link-drop 은
        버스 → 카드 윗변이다. 줄기(루트 쪽)와 드롭(칸 쪽)이 각자 리터럴을 가졌을 때 1px 어긋났고 줄기가 버스
        아래로 삐져나왔다. */
  .session-modal-body{flex:1 0 auto;display:flex;flex-direction:column;
                 --session-strip-bleed:20px;--session-strip-gap:12px;
                 --session-link-x:22px;--session-link-stem:13px;--session-link-drop:14px;
                 --session-list-width:calc(100cqw + 2 * var(--session-strip-bleed) + 2px);
                 --session-card-width:max(320px, var(--session-list-width))}
  /* 세션 카드 폭(결정 MX8 개정) — 메인 화면의 카드(div.card, #dzh-app 그리드 트랙)와 비슷한 폭이다. 그리드는 열 최소폭 320px 로
     auto-fill 한다: 목록 폭 G 에서 2열은 G ≥ 2·320+12, 3열은 G ≥ 3·320+24 부터다. 이 칸은 같은 열 수를 따르되 폭은 그리드 열 폭
     ((G − 간격)/열 수)이 아니라 **칸 안쪽 폭**(100cqw — 창의 콘텐츠 폭이자 칸의 스크롤 영역에서 좌우 패딩을 뺀 폭) 기준이라, 2·3개 세션이
     가로 스크롤 없이 딱 들어간다. 그리드 열은 칸 안쪽보다 G − 100cqw(= 창 안쪽 패딩 + 테두리 = 42px)만큼 넓은 폭을 나누므로 메인 카드보다
     열 수로 나눈 만큼 좁다(2열 21px · 3열 14px, 메인 카드의 약 3~7%). 열 최소폭 320px 는 그대로 지켜서(max) 그 문턱 바로 위 구간
     (안쪽 폭 610~652px 의 2열, 942~984px 의 3열)에서는 딱 맞지 않고 최대 42px 넘친다 — 320 밑으로 줄이면 카드 안 글이 메인 카드보다 좁아진다.
     --session-list-width 는 그리드 폭 G 다(창의 테두리 상자 폭이 곧 그리드 폭이므로 100cqw 에 좌우 안쪽 패딩 = --session-strip-bleed 의
     짝과 테두리 2px 를 더한다) — 1열(좁은 화면)이 메인 카드와 같은 폭이 되도록 쓴다. 카드 사이 간격은 칸의 --session-strip-gap 이다.
     아래 두 문턱(610px·942px)은 컨테이너 쿼리가 var() 를 못 읽어 리터럴이다: G 문턱 652·984 에서 창의 안쪽 폭 차이(42px)를 뺀 값이다.
     1열은 기본값 — 카드가 목록 폭 하나를 다 쓰되 열 최소폭 320px 를 지키고, 칸에 다음 카드가 엿보이도록 li 의 max-width 가 누른다.
     목록이 밀어내기 패널 때문에 좁아져도 창이 함께 좁아지므로 이 식이 그대로 맞는다. */
  @container (min-width:610px){
    .session-modal-body{--session-card-width:max(320px, calc((100cqw - var(--session-strip-gap)) / 2))}
  }
  @container (min-width:942px){
    .session-modal-body{--session-card-width:max(320px, calc((100cqw - 2 * var(--session-strip-gap)) / 3))}
  }
  /* 루트(프로젝트 머리, SC5) — 누를 수 없는 머리다(결정 MX1): 패널 속성을 어떤 경우에도 달지 않아
     커서·hover·열림 표시가 전부 없다. 스크롤 칸 밖·다이얼로그 위쪽에 고정돼 가로로 넘겨도 늘 보인다.
     상자는 여백·패딩·테두리 없이 오른쪽 30px 만 둔다 — 그 자리는 닫기 버튼(24px, right:14px)이 다이얼로그
     콘텐츠 상자 안으로 들어와 머리 끝(.last-activity)과 겹치지 않게 하는 여유다. 예전의 음수 여백·패딩·
     투명 테두리·모서리는 누를 수 있던 시절의 hover 테두리와 열림 배경을 위한 것이라 그 동작과 함께
     걷었다 — 그 결과 루트 왼끝이 첫 세션 카드 왼끝과 같은 x 가 된다. */
  .session-modal-root{position:relative;margin:0 30px 0 0}
  /* 옛 루트 아랫 여백(패딩 8 + 테두리 1 = 9px)이 사라진 자리를 메우는 값 — 세션이 0개인 채 열려 있을 때
     머리 경로와 빈 문구가 붙어 버리지 않게 한다(세션이 있으면 칸의 위 패딩이 이 간격을 갖는다). */
  .session-modal-root + .session-strip-empty{margin-top:9px}
  /* 가로 한 줄 — 넘치면 가로 스크롤(결정 SC5, 줄바꿈하지 않는다). 스크롤 칸이 다이얼로그
     패딩 끝까지 번지도록 음수 여백 + 같은 값(bleed = 다이얼로그 좌우 패딩)의 안쪽 패딩으로
     짝짓는다(.sessions 의 8px 번짐과 같은 관례, V9). overscroll-behavior-x:contain 은 맥 트랙패드
     가로 스와이프가 칸 끝에서 브라우저 뒤로 가기로 새는 것을 막는다.
     세로는 flex:1 0 auto 이고 grow(1)는 창 높이가 내용에서 나오는 지금은 비활성이다(결정 LM8·LM9). 끝의 0 이 하중을 진다 —
     칸은 overflow-x:auto 라 스크롤 컨테이너이고 스크롤 컨테이너의 자동 최소 높이는 0 이라, 줄어들 수 있으면(1)
     내용이 넘칠 때 칸이 자기 안에서 세로로 스크롤한다(SC6 이 기각한 가로·세로 스크롤 칸의 겹침). 0 이면 칸은
     내용 높이 밑으로 줄지 않고 넘침은 다이얼로그가 받는다. 본문·프레임도 같은 0 을 둔다: overflow 가 visible 인 그 둘은
     min-height:auto 가 내용 높이에 묶어 주지만 누가 min-height:0 을 더하면 풀리고, 그때도 칸의 0 하나만, 또는
     본문·프레임의 0 둘만 있어도 칸이 줄지 않는다(실측) — 세 단계 모두 0 인 것은 중복 방어다. */
  .session-strip-frame{position:relative;margin:0 calc(-1 * var(--session-strip-bleed));
                 flex:1 0 auto;display:flex;flex-direction:column}
  .session-strip{position:relative;display:flex;align-items:stretch;gap:var(--session-strip-gap);list-style:none;
                 margin:0;padding:4px var(--session-strip-bleed) 10px;overflow-x:auto;overscroll-behavior-x:contain;
                 scroll-padding-inline:var(--session-strip-bleed);flex:1 0 auto;scrollbar-width:none}
  /* 스크롤 막대는 보이지 않는다 — 가로 스크롤(트랙패드·Shift+휠·드래그·키보드)과 넘침 단서(SC11 그라데이션)가 그대로 신호를 준다.
     scrollbar-width 는 표준이고 ::-webkit-scrollbar 는 그것을 못 읽는 WebKit 계열의 짝이다. 막대가 차지하던 높이가 없어도 위 10px
     아래 패딩은 카드 그림자·강조 번짐이 잘리지 않게 하는 숨 쉴 자리이고 넘침 단서의 bottom:10px 과 짝이라 그대로 둔다. */
  .session-strip::-webkit-scrollbar{display:none}
  /* min-width:0 필수(GOTCHA, 결함 ②, 2026-09-28 실측 확인) — flex 아이템의 기본
     min-width:auto(자동 최소 크기 = 내용의 min-content)를 이 선언이 누르지 않으면, 줄바꿈
     없는 내용(그때는 nowrap+ellipsis 였던 실행 줄 제목 .agent-run-title)의 min-content 가 그대로 li 폭에
     반영돼 실행 줄이 있는 카드만 정한 폭보다 넓어졌다(폭이 280px 이던 때 1440px 뷰포트 실측 328.4px). 지금은
     상세보기의 실행 줄 제목이 줄바꿈하지만(아래 잘림 해제, 결정 MX9) 이 선언은 다른 줄바꿈 없는 내용이 카드 폭을
     밀지 못하게 계속 막는다. 폭은 결정 MX8(개정) — 위 본문 규칙의 --session-card-width, 메인 화면 카드와 비슷하되 2·3개가 칸에 딱 들어가는 폭이다(옛 고정
     320px 는 폭이 280 이던 때의 실측으로 정한 값이라 넓은 화면에서 메인 카드보다 훨씬 좁았다). max-width 는 좁은 화면에서 다음 카드를 엿보이게 한다. */
  .session-strip>li{flex:0 0 var(--session-card-width);max-width:calc(100% - 40px);min-width:0;display:flex;position:relative}
  /* 넘침 단서(SC11) — 숨은 쪽에만 뜬다. #dzh-session-modal-body 의 두 클래스(JS 가 스크롤·
     렌더·크기 변화 때 갱신)로만 켠다 — 그 요소는 자식만 맞대기 대상이라 렌더가 이 클래스를
     지우지 않는다. */
  .session-strip-frame::before,.session-strip-frame::after{content:"";position:absolute;top:0;bottom:10px;
                 width:32px;pointer-events:none;opacity:0;z-index:1}
  .session-strip-frame::before{left:0;background:linear-gradient(to right,var(--surface),transparent)}
  .session-strip-frame::after{right:0;background:linear-gradient(to left,var(--surface),transparent)}
  .session-modal-body.session-strip-hidden-left .session-strip-frame::before,
  .session-modal-body.session-strip-hidden-right .session-strip-frame::after{opacity:1}
  .session-strip-empty{margin:0;font-size:12.5px;color:var(--muted)}
  /* 세션 카드(SC6) — 카드 안 세션 줄과 같은 조각(renderSessionContent)을 같은 순서로 담는다.
     flex-basis:auto 필수(GOTCHA) — .excerpt 의 flex-basis:100%(세로 flex 전용)를 이 가로
     카드 안에서 상속하면 발췌가 카드 높이의 100% 를 먹는다(세션 줄이 이미 겪은 함정). */
  .session-card{display:flex;flex-direction:column;width:100%;position:relative;font:inherit;color:inherit;
                text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;
                padding:12px 14px;cursor:pointer}
  .session-card:hover{border-color:var(--accent)}
  .session-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .session-card.card-open{background:var(--accent-soft);border-color:var(--accent)}
  .session-card>.excerpt{flex-basis:auto}
  /* 상세보기는 카드 목록보다 덜 보여 주지 않는다(결정 MX9) — 카드 목록의 세션 줄은 340px 고정 카드 때문에 실행 줄
     제목을 한 줄 말줄임으로 자르는데, 모달 세션 카드는 그 잘림이 필요 없다. 명세가 더 큰 이 스코프 규칙이 모달 세션
     카드만 푼다 — 카드 목록은 그대로다. overflow-wrap:anywhere 는 끊을 곳 없는 긴 토큰이 가로로 잘리는 것을 막는다.
     진행중 단계 줄(.tier1-active)의 같은 해제 규칙은 그 줄과 함께 걷혔다(결정 LM4 — 단계명은 줄바꿈하는 진행률 줄 안
     칩이라 두 화면 모두 클램프가 없다). */
  .session-card .agent-run-title{white-space:normal;overflow-wrap:anywhere}
  /* 작업중 강조 — .card.card-working 과 같은 값·같은 keyframes(T25-65·T25-221 이 카드 규칙
     리터럴을 물고 있어 셀렉터를 합치지 않는다 — T25-88 선례와 같은 선택). */
  .session-card.card-working{border-color:var(--accent);box-shadow:0 0 8px -2px var(--accent)}
  .session-card.card-working::after{content:"";position:absolute;inset:0;border-radius:inherit;
    pointer-events:none;box-shadow:inset 0 0 14px -1px var(--accent);
    animation:card-working-glow 2s ease-in-out infinite}
  .session-card.card-open.card-working::after{box-shadow:inset 0 0 20px -1px var(--accent)}
  @media (prefers-reduced-motion:reduce){.session-card.card-working::after{animation:none;opacity:1}}
  /* 루트↔세션 연결선(안 B, 승인 4, 결정 SC12) — 루트 아래 줄기(스크롤 칸 밖, 제자리) → 가로
     버스(스크롤 칸 안, 카드와 함께 흐름) → 각 카드로 떨어지는 드롭. 선 언어는 카드 안 세로
     트리(V2~V8)와 같다 — 1px · --muted · 투명도 .5. 버스는 형제 간격(gap)을 반씩 양쪽으로 이어 칸 어디서나
     줄기와 만난다.
     기하는 전부 본문의 사용자 정의 속성 다섯(결정 MX6)에서 파생되고, 등식은 구성으로 성립한다:
       가로 — 루트 왼끝 = 첫 카드 왼끝(루트 상자 단순화 MX1 + 프레임 번짐·칸 패딩의 짝)이라 줄기 x = 드롭 x = link-x.
       세로 — 프레임 윗변 = 루트 아랫변(본문 flex 에 gap·루트 여백이 없다). 칸 위 패딩 = stem + drop 이라 줄기(루트 아랫변
              부터 stem)의 아랫끝 = 버스 윗변(카드 윗변 − drop)이고, 드롭(버스부터 drop)의 아랫끝 = 카드 윗변이다.
       스크롤 — 줄기는 칸 밖이라 제자리이고 버스는 칸 안이라 흐르지만, 최대 스크롤에서도 줄기 x 는 버스 구간 안이다
              (li 의 max-width 가 칸 안에 카드 한 장 + 40px 를 남긴다) — T 자 접합이 유지된다.
     stem 13 + drop 14 = 27px 는 루트 글자 아래에서 카드 윗변까지의 세로 리듬을 그대로 잇는 값이다. */
  .session-strip.session-strip-linked{padding-top:calc(var(--session-link-stem) + var(--session-link-drop))}
  .session-strip-linked>li::before{content:"";position:absolute;left:var(--session-link-x);
                 top:calc(-1 * var(--session-link-drop));height:var(--session-link-drop);
                 border-left:1px solid var(--muted);opacity:.5}
  .session-strip-linked>li::after{content:"";position:absolute;top:calc(-1 * var(--session-link-drop));
                 left:calc(var(--session-strip-gap) / -2);right:calc(var(--session-strip-gap) / -2);
                 border-top:1px solid var(--muted);opacity:.5}
  .session-strip-linked>li:first-child::after{left:var(--session-link-x)}
  .session-strip-linked>li:last-child::after{right:auto;width:calc(var(--session-link-x) + var(--session-strip-gap) / 2)}
  .session-strip-linked>li:only-child::after{display:none}
  .session-modal-root.root-linked::after{content:"";position:absolute;left:var(--session-link-x);top:100%;
                 height:var(--session-link-stem);border-left:1px solid var(--muted);opacity:.5}
</style>
<script>
/* body 파싱 전에 실행돼 첫 페인트부터 확정 테마로 그린다(FOUC 방지).
   저장값이 없으면 시스템 선호를 한 번만 읽어 확정하고 그대로 굳힌다(결정 Y1·Y3) —
   이후로는 OS 테마가 바뀌어도 따라가지 않는다. localStorage 는 file:// 등에서 던질 수 있어 감싼다. */
try{
  var s = localStorage.getItem('dzh-theme');
  var t = (s === 'light' || s === 'dark') ? s
        : ((window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', t);
  if(s !== t) localStorage.setItem('dzh-theme', t);
}catch(e){}
</script>
</head>
<body>
<div class="wrap">
  <div class="head-row">
    <h1>Claude Agents Manager</h1>
    <span id="dzh-harness-version" class="harness-version" hidden></span>
    <div class="top-actions">
      <button id="dzh-update" class="update-btn" type="button" data-command="/harness-update" hidden>
        <span class="update-label"></span><span class="update-label-copied">복사됨 · /harness-update</span><span class="update-label-copy-failed">/harness-update 를 입력하세요</span>
      </button>
      <button id="dzh-refresh" class="icon-btn refresh-btn" type="button" aria-label="새로고침" data-tooltip="새로고침">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
          <path d="M8 16H3v5"/>
        </svg>
      </button>
      <button id="dzh-theme-toggle" class="icon-btn theme-toggle" type="button"
              aria-label="다크 테마로 전환" data-tooltip="다크 테마로 전환">
        <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/>
        </svg>
        <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2"/><path d="M12 20v2"/>
          <path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/>
          <path d="M2 12h2"/><path d="M20 12h2"/>
          <path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>
        </svg>
      </button>
    </div>
    <div id="dzh-session-modal" class="session-modal">
      <section class="session-modal-dialog" role="dialog" aria-labelledby="dzh-session-modal-title">
        <button id="dzh-session-modal-close" class="detail-close session-modal-close" type="button"
                aria-label="세션 목록 닫기" data-tooltip="닫기 (Esc)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
          </svg>

<script>
(function(){
  // 테마 토글 — 라이트/다크 2상태(결정 Y1~Y4). <head> 인라인 스크립트가 첫 페인트 전에
  // 이미 시스템 선호를 1회 확정해 두므로(FOUC 방지), 여기서는 그 값을 읽고 바꾸기만 한다.
  // 버튼은 #dzh-app 밖의 정적 마크업이라 폴링(불변식 H1″)과 무관하게 이 IIFE 하나로 수명이
  // 끝난다.
  var THEME_STORAGE_KEY = 'dzh-theme';
  var THEME_CYCLE = ['light', 'dark'];
  // 아이콘·라벨은 "지금" 이 아니라 "전환될 대상"을 가리킨다 — 라이트일 때 moon(다크로 전환),
  // 다크일 때 sun(라이트로 전환). 새로고침 버튼의 라벨 규약("동작"을 말한다)과 같다.
  // 아이콘 자체는 CSS 가 고른다(PV10) — 두 SVG 를 마크업에 함께 두고 data-theme 로 스와핑한다.
  var THEME_ACTION_LABEL = {light:'다크 테마로 전환', dark:'라이트 테마로 전환'};
  var toggleButton = document.getElementById('dzh-theme-toggle');
  if(!toggleButton) return;

  // 시스템 선호를 1회 읽는다. matchMedia 가 없는 극단적 환경이면 라이트로 낙착(결정 Y3).
  function resolveSystemTheme(){
    try{
      return (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }catch(e){
      return 'light';
    }
  }

  // 지금 유효한 테마. 저장값이 light/dark 가 아니면(부재·구버전 문자열 등) 시스템 선호로
  // 확정한다 — <head> 스크립트가 이미 저장해 두지만, localStorage 가 막힌 환경에서는
  // 여기서도 방어적으로 다시 판정한다(결정 Y1).
  function currentTheme(){
    try{
      var stored = localStorage.getItem(THEME_STORAGE_KEY);
      return (stored === 'light' || stored === 'dark') ? stored : resolveSystemTheme();
    }catch(e){
      return resolveSystemTheme();
    }
  }

  // data-theme 속성·aria-label·data-tooltip 을 한꺼번에 맞춘다. 아이콘 선택은 CSS 가 한다(PV10).
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    toggleButton.setAttribute('aria-label', THEME_ACTION_LABEL[theme]);
    toggleButton.setAttribute('data-tooltip', THEME_ACTION_LABEL[theme]);
  }

  toggleButton.addEventListener('click', function(){
    var next = THEME_CYCLE[(THEME_CYCLE.indexOf(currentTheme()) + 1) % THEME_CYCLE.length];
    try{ localStorage.setItem(THEME_STORAGE_KEY, next); }
    catch(e){ /* 저장 실패 — 이번 페이지 로드 동안만 토글이 적용된다(결정 Y3) */ }
    applyTheme(next);
  });
  applyTheme(currentTheme());
})();

(function(){
  // 새로고침 회전(PV6~PV8) — 클릭 피드백 전용. 렌더 IIFE 안에 넣지 않는 이유: 그 IIFE 는
  // file:// 모드에서 조기 반환하므로 등록 위치에 따라 회전이 조용히 죽는다. 스냅샷을 모르는
  // 순수 표현이라 테마 토글·툴팁과 같은 층위의 독립 IIFE 가 맞다.
  var REFRESH_SPIN_CLASS = 'refresh-spinning';
  var refreshButton = document.getElementById('dzh-refresh');
  var refreshIconEl = refreshButton && refreshButton.querySelector('svg');
  if(!refreshButton || !refreshIconEl) return;

  refreshButton.addEventListener('click', function(){
    // 제거 → 강제 리플로우 → 재추가. 제거만 하고 곧바로 추가하면 브라우저가 두 변경을 한
    // 프레임에 합쳐 "변화 없음"으로 처리해 연속 클릭에서 재생되지 않는다.
    refreshButton.classList.remove(REFRESH_SPIN_CLASS);
    void refreshButton.offsetWidth;
    refreshButton.classList.add(REFRESH_SPIN_CLASS);
  });
  // 시간을 JS 가 알 필요가 없다 — 애니메이션이 끝났다고 브라우저가 알려준다(PV7).
  refreshIconEl.addEventListener('animationend', function(){
    refreshButton.classList.remove(REFRESH_SPIN_CLASS);
  });
})();

(function(){
  // 새 버전 알림 버튼(harness-versioning 결정 UN7~UN9) — 누르면 /harness-update 를 클립보드에 넣는다. 업데이트를
  // 직접 실행하지 않는다(사용자가 Claude Code 에 붙여 넣어 실행 — 서버는 GET 전용을 지킨다). 렌더 IIFE 안에 넣지
  // 않는 이유: 그 IIFE 는 file:// 모드에서 `if(!isServed){ … return; }` 로 조기 반환하므로 그 뒤에 두면 복사가
  // 조용히 죽는다(GOTCHA 4 선례). 스냅샷을 모르는 상수 문자열 복사라 새로고침 회전과 같은 층위의 독립 IIFE 가 맞다.
  // 피드백(.update-btn-copied·.update-btn-copy-failed)은 사용자 상태다 — 이 IIFE 만 붙이고 떼며 렌더 IIFE 는
  // 건드리지 않는다(폴링 재렌더가 지우지 않는다, 결정 UN8). 복사할 명령은 마크업의 data-command 가 단일 출처다.
  var UPDATE_COPIED_CLASS = 'update-btn-copied';
  var UPDATE_COPY_FAILED_CLASS = 'update-btn-copy-failed';
  var UPDATE_COPY_FEEDBACK_MS = 2000;     // 복사 피드백 표시 시간
  var updateButton = document.getElementById('dzh-update');
  if(!updateButton) return;
  var UPDATE_COMMAND_TEXT = updateButton.getAttribute('data-command');
  var feedbackTimer = null;

  function showCopyFeedback(feedbackClass){
    updateButton.classList.remove(UPDATE_COPIED_CLASS, UPDATE_COPY_FAILED_CLASS);
    updateButton.classList.add(feedbackClass);
    clearTimeout(feedbackTimer);
    feedbackTimer = setTimeout(function(){ updateButton.classList.remove(feedbackClass); }, UPDATE_COPY_FEEDBACK_MS);
  }

  updateButton.addEventListener('click', function(){
    var clipboard = navigator.clipboard;
    if(!clipboard || typeof clipboard.writeText !== 'function'){ showCopyFeedback(UPDATE_COPY_FAILED_CLASS); return; }
    // writeText 가 동기로 던지는 브라우저도 같은 실패 경로로 모은다.
    Promise.resolve().then(function(){ return clipboard.writeText(UPDATE_COMMAND_TEXT); }).then(
      function(){ showCopyFeedback(UPDATE_COPIED_CLASS); },
      function(){ showCopyFeedback(UPDATE_COPY_FAILED_CLASS); }
    );
  });
})();

(function(){
  // 전역 커스텀 툴팁 — data-tooltip 트리거 전체가 공유하는 position:fixed 싱글턴(결정 T1).
  // 네이티브 title 은 지연·스타일·위치를 제어할 수 없고 .card{overflow:hidden} 안에서 잘리므로
  // 이 파일 안의 바닐라 CSS/JS 로 대체한다(요구 2). 스냅샷 렌더와 무관한 범용 UI 컴포넌트라
  // 테마 토글과 같은 층위의 독립 IIFE 로 둔다.
  var TOOLTIP_SHOW_DELAY_MS = 120;          // 마우스 hover-intent (결정 T3)
  var TOOLTIP_GAP_PX = 8;                   // 트리거와 툴팁 사이 간격
  var TOOLTIP_VIEWPORT_MARGIN_PX = 8;       // 뷰포트 경계 최소 여백
  var TOOLTIP_VISIBLE_CLASS = 'tooltip-visible';
  var TOOLTIP_ELEMENT_ID = 'dzh-tooltip';
  var TOOLTIP_TRIGGER_SELECTOR = '[data-tooltip]';

  var tooltipEl = document.getElementById(TOOLTIP_ELEMENT_ID);
  if(!tooltipEl) return;
  var currentTrigger = null;                // 표시 중인 트리거(없으면 null)
  var showTimerId = null;

  // 트리거 사각형·툴팁 크기·뷰포트로 {left, top} 을 계산한다. 순수 함수 — DOM 에 닿지 않는다.
  function tooltipPosition(triggerRect, tooltipWidth, tooltipHeight, viewportWidth, viewportHeight){
    var left = triggerRect.left + triggerRect.width / 2 - tooltipWidth / 2;
    left = Math.max(TOOLTIP_VIEWPORT_MARGIN_PX, Math.min(left, viewportWidth - tooltipWidth - TOOLTIP_VIEWPORT_MARGIN_PX));
    var below = triggerRect.bottom + TOOLTIP_GAP_PX;
    var above = triggerRect.top - tooltipHeight - TOOLTIP_GAP_PX;
    var top = (below + tooltipHeight + TOOLTIP_VIEWPORT_MARGIN_PX <= viewportHeight) ? below : above;
    top = Math.max(TOOLTIP_VIEWPORT_MARGIN_PX, Math.min(top, viewportHeight - tooltipHeight - TOOLTIP_VIEWPORT_MARGIN_PX));
    return {left: left, top: top};
  }

  // 트리거의 접근성 이름 근사값. aria-label 이 있으면 그것, 없으면 textContent 를 다듬는다.
  function accessibleNameOf(element){
    var ariaLabel = element.getAttribute('aria-label');
    if(ariaLabel) return ariaLabel.trim();
    return (element.textContent || '').replace(/\s+/g, ' ').trim();
  }

  // 툴팁 문구가 접근성 이름과 다를 때만 true — 같으면 aria-describedby 가 이중 낭독이 된다.
  function shouldDescribe(trigger, text){
    return accessibleNameOf(trigger) !== text;
  }

  // 표시를 끄고 지연 타이머를 취소하고 aria-describedby 를 되돌린다. 언제 불려도 안전하다.
  function hideTooltip(){
    if(showTimerId !== null){ clearTimeout(showTimerId); showTimerId = null; }
    tooltipEl.classList.remove(TOOLTIP_VISIBLE_CLASS);
    if(currentTrigger && currentTrigger.getAttribute('aria-describedby') === TOOLTIP_ELEMENT_ID){
      currentTrigger.removeAttribute('aria-describedby');
    }
    currentTrigger = null;
  }

  // 문구를 채우고 위치를 잡아 표시하고, 필요하면 aria-describedby 를 연결한다(표시 순서 GOTCHA).
  function showTooltip(trigger){
    if(showTimerId !== null){ clearTimeout(showTimerId); showTimerId = null; }
    var text = trigger.getAttribute('data-tooltip') || '';
    tooltipEl.textContent = text;                  // innerHTML 이 아니다 — 문구가 그대로 텍스트가 된다
    tooltipEl.style.left = '0px';
    tooltipEl.style.top = '0px';                    // GOTCHA 3 — 측정 전 좌표 리셋
    var tooltipWidth = tooltipEl.offsetWidth;
    var tooltipHeight = tooltipEl.offsetHeight;
    var position = tooltipPosition(
      trigger.getBoundingClientRect(), tooltipWidth, tooltipHeight,
      window.innerWidth, window.innerHeight
    );
    tooltipEl.style.left = position.left + 'px';
    tooltipEl.style.top = position.top + 'px';
    tooltipEl.classList.add(TOOLTIP_VISIBLE_CLASS);
    currentTrigger = trigger;
    if(shouldDescribe(trigger, text)) trigger.setAttribute('aria-describedby', TOOLTIP_ELEMENT_ID);
  }

  // 표시 요청. 이미 다른 트리거를 보여주는 중이면 지연 없이 즉시 교체한다(결정 T3).
  function requestTooltip(trigger, isImmediate){
    if(trigger === currentTrigger) return;
    if(showTimerId !== null){ clearTimeout(showTimerId); showTimerId = null; }
    if(isImmediate || currentTrigger){ showTooltip(trigger); return; }
    showTimerId = setTimeout(function(){ showTimerId = null; showTooltip(trigger); }, TOOLTIP_SHOW_DELAY_MS);
  }

  // 이벤트 배선 — 전부 document 위임이다(결정 T2). 맞대기(결정 PU1)가 기존 노드를 살려도
  // 키가 새로 생기는 노드(새 카드·새 세션)는 매 렌더 새로 만들어지므로 위임이 여전히
  // 유일하게 안전하다 — 개별 요소에 리스너를 붙이면 그 노드가 교체되는 순간 죽는다.
  document.addEventListener('mouseover', function(event){
    var trigger = event.target.closest(TOOLTIP_TRIGGER_SELECTOR);
    if(trigger){ requestTooltip(trigger, false); return; }
    if(event.target.closest('#' + TOOLTIP_ELEMENT_ID)) return;   // hoverable(WCAG 1.4.13)
    hideTooltip();
  });
  document.addEventListener('mouseleave', function(){ hideTooltip(); });   // 포인터가 창 밖으로 나가면 mouseover 가 더 안 온다
  document.addEventListener('focusin', function(event){
    var trigger = event.target.closest(TOOLTIP_TRIGGER_SELECTOR);
    if(trigger) requestTooltip(trigger, true);   // 포커스 이동은 의도적 행위다 — 지연 0
  });
  document.addEventListener('focusout', function(){ hideTooltip(); });
  document.addEventListener('keydown', function(event){
    if(event.key === 'Escape') hideTooltip();
  });
  document.addEventListener('click', function(){ hideTooltip(); });
  document.addEventListener('scroll', function(){ hideTooltip(); }, {capture: true, passive: true});
  window.addEventListener('resize', function(){ hideTooltip(); });

  // 30초 틱이 트리거 노드를 파괴하는데 포인터가 멈춰 있으면 마우스 이벤트가 안 와 낡은 문구가
  // 남는다(결정 T6) — 구조 변화(삽입·삭제·이동)를 감시해 고아 툴팁을 막는다. 부분 갱신
  // (결정 PU1)에서는 카드 안 깊은 곳의 세션 줄이 사라져도 #dzh-app 직계는 그대로일 수 있어
  // #dzh-app 대신 .wrap 을 subtree 까지 관찰한다(결정 PU5) — 이동도 닫는 이유는 트리거
  // 위치가 바뀌었을 수 있어서다(툴팁은 표시 순간의 좌표로 고정된다). 글자·속성만 바뀌면
  // (nodeValue 대입·syncAttributes) 이 옵저버는 반응하지 않는다 — 그래서 30초 틱에도 떠 있는
  // 툴팁이 남는다. .wrap 은 카드 상세보기 모달(2단계)이 얹힐 자리까지 미리 덮는다 — 그때도
  // 이 옵저버는 고치지 않는다. #dzh-usage-body 관찰은 R5 로 지웠다가(결정 UT4) R-B 가
  // 되살렸다(결정 EX7) — 만료 안내 줄(.usage-stale-note)이 그 안의 유일한 트리거이고, 30초
  // 틱마다 본문이 통째로 교체되므로 이 관찰이 없으면 그 트리거에서도 같은 고아 툴팁이 생긴다.
  var wrapElForTooltipObserver = document.querySelector('.wrap');
  var usageBodyElForTooltipObserver = document.getElementById('dzh-usage-body');
  var tooltipDismissObserver = new MutationObserver(function(){ hideTooltip(); });
  if(wrapElForTooltipObserver) tooltipDismissObserver.observe(wrapElForTooltipObserver, {childList: true, subtree: true});
  if(usageBodyElForTooltipObserver) tooltipDismissObserver.observe(usageBodyElForTooltipObserver, {childList: true});

  // 표시 중인 트리거의 data-tooltip 이 폴링·틱으로 갱신될 수 있다(#dzh-refresh 의 연결 상태
  // 문구 등) — showTooltip 은 진입 시점에만 속성을 읽으므로, 포인터를 올려둔 채면 다음 진입
  // 전까지 낡은 문구가 남는다. 속성 변경을 감시해 표시 중이면 그 자리에서 다시 그린다.
  var tooltipTextRefreshObserver = new MutationObserver(function(mutations){
    if(!currentTrigger) return;
    for(var i = 0; i < mutations.length; i++){
      if(mutations[i].target === currentTrigger){ showTooltip(currentTrigger); return; }
    }
  });
  tooltipTextRefreshObserver.observe(document.body, {attributes: true, attributeFilter: ['data-tooltip'], subtree: true});
})();

(function(){
  // 상호작용 잠금(요구 2, docs/prps/dashboard-lead-tooltip-and-interaction-lockdown.md 결정
  // IL1~IL7) — 우클릭 네이티브 메뉴를 막는다. 선택 차단은 위 <style> 의
  // html{...user-select...} 규칙이 이미 맡고 있다. 스냅샷 렌더와 무관한 범용 UI 동작이라
  // 테마 토글·툴팁과 같은 층위의 독립 IIFE 로 둔다 — 아래 렌더 IIFE 는 회귀 없이 그대로
  // 둔다(수술적 변경). 이 문서에만 적용되며, 상세 패널 iframe 안 대시보드 문서는 자기
  // 잠금을 별도로 갖는다(위 머리 주석 참조, 결정 IL1).
  //
  // 우회 예외(user-select:text 등)는 만들지 않는다 — 사용자가 "일부 영역만 복사 허용"을
  // 명시적으로 거부했다(결정 IL7, 승인 항목 3).
  //
  // 실측(2026-08-26, Claude Code 내장 브라우저/Chromium 기반, 뷰포트 1280px, M4) — 이
  // 문서(hub.html)에서: html/body/자손 모두 user-select 계산값이 none, 실제 우클릭에
  // 네이티브 메뉴가 뜨지 않았고, 합성 contextmenu 이벤트는 defaultPrevented=true·
  // cancelBubble=false 로 도달했다(결정 IL3 — 전파를 멈추지 않는다 — 이 실측대로
  // 지켜졌다). 드래그 선택 결과는 0자. 나머지 문서(단독 대시보드 탭·상세 패널 iframe·PiP

    if(minutes < MINUTES_PER_HOUR) return minutes + '분 전';
    return Math.floor(minutes / MINUTES_PER_HOUR) + '시간 ' + (minutes % MINUTES_PER_HOUR) + '분 전';
